const IMG = {};
Object.keys(B64).forEach(k=>{
  const im = new Image();
  im.onload = ()=>{ IMG[k]=im; };
  im.src = "data:image/webp;base64,"+B64[k];
});
document.getElementById('cameoImg').src = "data:image/webp;base64,"+B64.yang;

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=960, H=600, PX=W/2, PY=86, MAXLEN=500;
const TIME_LIMIT=60, TARGET=500;
/* 类型：分值 / 重量（越重收绳越慢）/ 半径 */
const TYPES = {
  dust_s: { v:10,  w:1,   r:14, name:'小星尘' },
  dust_l: { v:25,  w:2,   r:20, name:'大星尘' },
  leaf:   { v:50,  w:3.5, r:18, name:'金叶徽章', img:'goldleaf' },
  lamp:   { v:30,  w:1.5, r:18, name:'灯猫的小灯', img:'lamp' },
  fog:    { v:-15, w:1,   r:22, name:'雾团' },
  shiny:  { v:120, w:2.5, r:16, name:'闪光星尘', rare:true },
  dustbag:{ v:80,  w:2,   r:20, name:'星尘袋', img:'dustbag', rare:true },
};
const G = { state:'title', score:0, time:TIME_LIMIT, ang:0, t:0,
            rope:'swing', len:80, grab:null, stun:0, items:[], floats:[],
            combo:0, lucky:0, grabs:0,
            stat:{ maxCombo:0, shiny:0, dustbag:0, yang:0 } };

const YANG_LINES = {
  combo5: '哟，手气不错嘛——连击继续，别停！',
  lucky: '看我的骰子！接下来三钩，神速！',
  dustbag: '星尘袋！这可是老物件了，收好。',
  shiny: '闪光星尘！今晚泉底对你不薄。',
  win: '泉眼都点头了，你小子有前途。',
  lose: '别灰心，雾团专挑心急的人下手。',
};
let cameoTimer=null;
function showCameo(text, ms){
  document.getElementById('cameoText').textContent=text;
  document.getElementById('cameo').classList.add('show');
  G.stat.yang++;
  clearTimeout(cameoTimer);
  cameoTimer=setTimeout(()=>document.getElementById('cameo').classList.remove('show'), ms||2600);
}

function show(html){ document.getElementById('ocard').innerHTML=html;
  document.getElementById('overlay').classList.remove('hidden'); }
function hide(){ document.getElementById('overlay').classList.add('hidden'); }

function titleScreen(){
  G.state='title';
  show(`<h2>星尘打捞</h2>
    <p>星尘泉的夜晚，星屑沉在泉底。<br>摇钩，看准，点一下。</p>
    <div class="rule">
      <b>点一下</b> 就放钩，钩到东西自动收回来<br>
      小星尘 <b>+10</b> · 大星尘 <b>+25</b> · 灯猫的小灯 <b>+30</b> · 金叶徽章 <b>+50</b>（最沉）<br>
      <b>连击</b>：连续钩中不落空，4 连击起计分 <b>×2</b>，8 连击 <b>×3</b>！碰雾团或落空就断<br>
      别碰<b>雾团</b>：扣 15 分，钩子还会被缠住 2 秒<br>
      泉底偶尔有<b>闪光星尘</b>（+120）和<b>星尘袋</b>（+80，有惊喜）<br>
      洋的骰子会不定时带来<b>神速钩</b>：接下来三钩收绳飞快<br>
      <b>60 秒</b>内拿到 <b>500 分</b>，泉眼就认可你
    </div>
    <div class="btnrow"><button onclick="startGame()">下钩</button></div>`);
}
function spawnItem(){
  const roll=Math.random();
  let type;
  if(roll<0.05) type='dustbag';
  else if(roll<0.11) type='shiny';
  else if(roll<0.36) type='dust_s';
  else if(roll<0.58) type='dust_l';
  else if(roll<0.70) type='leaf';
  else if(roll<0.82) type='lamp';
  else type='fog';
  G.items.push({ x:60+Math.random()*(W-120), y:200+Math.random()*(H-260), type, ph:Math.random()*6.28 });
}
function startGame(){
  G.state='play'; G.score=0; G.time=TIME_LIMIT; G.items=[]; G.floats=[];
  G.rope='swing'; G.len=80; G.grab=null; G.stun=0;
  G.combo=0; G.lucky=0; G.grabs=0;
  G.stat={ maxCombo:0, shiny:0, dustbag:0, yang:0 };
  for(let i=0;i<10;i++) spawnItem();
  document.getElementById('score').textContent='0';
  updateComboTag(); updateLuckyTag();
  hide();
}
function comboMult(){ return G.combo>=8?3 : G.combo>=4?2 : 1; }
function updateComboTag(){
  const el=document.getElementById('comboTag'), m=comboMult();
  if(m>1){ el.style.display='inline-block'; el.textContent='连击 ×'+m+'（'+G.combo+'连）'; }
  else el.style.display='none';
}
function updateLuckyTag(){
  document.getElementById('luckyTag').style.display = G.lucky>0?'inline-block':'none';
}
function breakCombo(){
  if(G.combo>=4) floatText(PX,160,'连击中断','#8a5aa0');
  G.combo=0; updateComboTag();
}
function endGame(win){
  G.state='end';
  const s=G.stat, yangImg="data:image/webp;base64,"+B64.yang;
  const praise = G.score>=800 ? '传奇守泉人'
    : G.score>=600 ? '泉眼贵客'
    : G.score>=TARGET ? '合格的打捞手' : '见习打捞手';
  const marvels=[];
  if(s.maxCombo>=4) marvels.push(`最高 <b>${s.maxCombo}</b> 连击`);
  if(s.shiny>0) marvels.push(`捞到 <b>${s.shiny}</b> 颗闪光星尘`);
  if(s.dustbag>0) marvels.push(`入手 <b>${s.dustbag}</b> 只星尘袋`);
  if(s.yang>0) marvels.push(`洋现身 <b>${s.yang}</b> 次`);
  show(`<h2>${win?'泉眼认可了你':'差一点'}</h2>
    <p>${TIME_LIMIT} 秒，得分 <b style="color:#e8c26a">${G.score}</b> —— ${praise}</p>
    <div class="end-yang"><img src="${yangImg}">
      <div class="words">洋：「${win?YANG_LINES.win:YANG_LINES.lose}」</div></div>
    ${marvels.length?`<div class="marvels">本局奇遇：${marvels.join(' · ')}</div>`:''}
    <div class="btnrow"><button onclick="startGame()">${win?'再捞一次':'再试一次'}</button></div>`);
}
function floatText(x,y,txt,color,size){
  G.floats.push({x,y,txt,color:color||'#e8c26a',size:size||20,life:1.4});
}

cv.addEventListener('pointerdown', ()=>{
  if(G.state!=='play'||G.rope!=='swing'||G.stun>0) return;
  G.rope='extend';
});

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(G.state==='play'){
    G.t+=dt; G.time-=dt; G.stun=Math.max(0,G.stun-dt);
    G.ang=Math.sin(G.t*1.4)*1.05;
    const dx=Math.sin(G.ang), dy=Math.cos(G.ang);
    if(G.rope==='extend'){
      G.len+=460*dt;
      const hx=PX+dx*G.len, hy=PY+dy*G.len;
      for(let i=G.items.length-1;i>=0;i--){
        const it=G.items[i], T=TYPES[it.type];
        if(Math.hypot(hx-it.x,hy-it.y) < T.r+12){
          G.grab=it; G.items.splice(i,1); G.rope='retract'; break;
        }
      }
      if(G.len>=MAXLEN || HXout(hx,hy)){ G.rope='retract'; }
    } else if(G.rope==='retract'){
      const w=G.grab?TYPES[G.grab.type].w:1;
      const speed = G.lucky>0 ? 2.6 : 1;   // 神速钩
      G.len-=300/w*speed*dt;
      if(G.len<=80){
        G.len=80; G.rope='swing';
        if(G.grab){
          const T=TYPES[G.grab.type], it=G.grab;
          if(it.type==='fog'){
            G.score=Math.max(0,G.score+T.v); G.stun=2;
            floatText(it.x,it.y,'雾团缠钩! -15','#8a5aa0');
            breakCombo();
          } else {
            const m=comboMult(), pts=T.v*m;
            G.score+=pts; G.combo++;
            G.stat.maxCombo=Math.max(G.stat.maxCombo,G.combo);
            floatText(it.x,it.y,'+'+pts+(m>1?' ×'+m:''),'#e8c26a', m>1?26:20);
            if(G.combo===5) showCameo(YANG_LINES.combo5);
            if(it.type==='shiny'){ G.stat.shiny++; showCameo(YANG_LINES.shiny); }
            if(it.type==='dustbag'){ G.stat.dustbag++; showCameo(YANG_LINES.dustbag); }
            if(G.lucky>0){ G.lucky--; updateLuckyTag(); }
            G.grabs++;
            if(G.grabs%12===0 && G.lucky===0){   // 洋的骰子：神速钩
              G.lucky=3; updateLuckyTag();
              showCameo(YANG_LINES.lucky);
              floatText(PX,200,'洋掷出了骰子！神速钩 ×3','#7fd4ff',22);
            }
            updateComboTag();
          }
          document.getElementById('score').textContent=G.score;
          G.grab=null;
        } else {
          breakCombo();  // 落空断连击
        }
      }
    }
    if(Math.random()<dt*1.4 && G.items.length<12) spawnItem();
    for(let i=G.floats.length-1;i>=0;i--){ const f=G.floats[i]; f.y-=34*dt; f.life-=dt;
      if(f.life<=0) G.floats.splice(i,1); }
    document.getElementById('timefill').style.width=(G.time/TIME_LIMIT*100)+'%';
    document.getElementById('timelabel').textContent=Math.ceil(G.time)+'s';
    if(G.time<=0) endGame(G.score>=TARGET);
  }
  draw();
  requestAnimationFrame(loop);
}
function HXout(x,y){ return x<10||x>W-10||y>H-10; }

function drawItem(it){
  const T=TYPES[it.type], bob=Math.sin(G.t*2+it.ph)*4, y=it.y+bob;
  const im=T.img?IMG[T.img]:null;
  if(im){ const s=T.r*2.6; ctx.drawImage(im,it.x-s/2,y-s/2,s,s); }
  else if(it.type==='fog'){
    ctx.save(); ctx.translate(it.x,y);
    ctx.fillStyle='rgba(60,30,90,.85)';
    ctx.beginPath(); ctx.arc(0,0,T.r,0,6.29); ctx.fill();
    ctx.fillStyle='rgba(90,50,130,.5)';
    ctx.beginPath(); ctx.arc(-6,-5,T.r*0.55,0,6.29); ctx.fill();
    ctx.strokeStyle='#8a5aa0'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,T.r,0,6.29); ctx.stroke();
    ctx.restore();
  } else if(it.type==='shiny'){
    // 闪光星尘：星芒 + 拖尾光点
    ctx.save(); ctx.translate(it.x,y);
    const tw=0.6+0.4*Math.sin(G.t*8+it.ph);
    const g=ctx.createRadialGradient(0,0,1,0,0,T.r*1.6);
    g.addColorStop(0,'rgba(255,250,220,'+(0.95*tw)+')');
    g.addColorStop(.4,'rgba(255,220,120,'+(0.7*tw)+')');
    g.addColorStop(1,'rgba(255,200,80,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,T.r*1.6,0,6.29); ctx.fill();
    ctx.strokeStyle='#fff8dd'; ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(-T.r*1.4,0); ctx.lineTo(T.r*1.4,0);
    ctx.moveTo(0,-T.r*1.4); ctx.lineTo(0,T.r*1.4); ctx.stroke();
    ctx.restore();
  } else { // 普通星尘
    ctx.save(); ctx.translate(it.x,y);
    const g=ctx.createRadialGradient(0,0,1,0,0,T.r);
    g.addColorStop(0,'#fff3d0'); g.addColorStop(.4,'#e8c26a'); g.addColorStop(1,'rgba(232,194,106,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,T.r,0,6.29); ctx.fill();
    ctx.strokeStyle='#fff3d0'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-T.r*1.3,0); ctx.lineTo(T.r*1.3,0);
    ctx.moveTo(0,-T.r*1.3); ctx.lineTo(0,T.r*1.3); ctx.stroke();
    ctx.restore();
  }
}

function draw(){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#06060f'); sky.addColorStop(.55,'#0b0b18'); sky.addColorStop(1,'#101a2a');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(120,150,200,.14)'; ctx.lineWidth=2;
  for(let i=0;i<5;i++){ const yy=220+i*80+Math.sin(G.t+i)*6;
    ctx.beginPath();
    for(let x=0;x<=W;x+=24) ctx.lineTo(x, yy+Math.sin(x*0.03+G.t*1.5+i)*5);
    ctx.stroke(); }
  G.items.forEach(drawItem);
  // 绞盘架
  ctx.fillStyle='#2a2110'; ctx.fillRect(PX-70,PY-24,140,22);
  ctx.fillStyle='#3a2f1d'; ctx.beginPath(); ctx.arc(PX,PY-13,16,0,6.29); ctx.fill();
  ctx.strokeStyle='#b08d57'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(PX,PY-13,16,0,6.29); ctx.stroke();
  // 绳钩
  const dx=Math.sin(G.ang), dy=Math.cos(G.ang);
  const hx=PX+dx*G.len, hy=PY+dy*G.len;
  ctx.strokeStyle=G.lucky>0?'#7fd4ff':(G.stun>0?'#8a5aa0':'#c9b98f');
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(PX,PY); ctx.lineTo(hx,hy); ctx.stroke();
  ctx.strokeStyle=G.lucky>0?'#7fd4ff':'#e8c26a'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(hx,hy,10,0.3,2.8); ctx.stroke();
  if(G.grab){
    const T=TYPES[G.grab.type], gy=hy+14;
    const im=T.img?IMG[T.img]:null;
    if(im){ const s=T.r*2.4; ctx.drawImage(im,hx-s/2,gy-s/2,s,s); }
    else { ctx.fillStyle='#e8c26a'; ctx.beginPath(); ctx.arc(hx,gy,8,0,6.29); ctx.fill(); }
  }
  if(G.stun>0){
    ctx.fillStyle='#b48ad0'; ctx.font='15px "PingFang SC",sans-serif'; ctx.textAlign='center';
    ctx.fillText(`雾团缠钩…${G.stun.toFixed(1)}s`, PX, PY+44);
  }
  G.floats.forEach(f=>{
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.fillStyle=f.color; ctx.font='bold '+f.size+'px "PingFang SC",sans-serif'; ctx.textAlign='center';
    ctx.fillText(f.txt,f.x,f.y); ctx.globalAlpha=1;
  });
  if(G.state==='play'&&G.rope==='swing'){
    ctx.save(); ctx.setLineDash([8,10]); ctx.strokeStyle='rgba(201,185,143,.28)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(PX,PY); ctx.lineTo(PX+dx*120,PY+dy*120); ctx.stroke(); ctx.restore();
  }
}
titleScreen();
requestAnimationFrame(loop);
</script>
