<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>金榜大亨 v0.9 | MYSKME</title>
<style>
:root{
--bg:#FAF7F0; --card:#FFFFFF; --ink:#4A4238; --ink2:#8A7F72;
--gold:#C9A86A; --gold-d:#A98850; --blue:#7A9BB5; --bamboo:#7BA08B;
--line:#E8DFD0; --red:#D98E8E; --shadow:0 2px 10px rgba(74,66,56,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,html,body{height:100dvh;overflow:hidden;overscroll-behavior:none}
body{margin:0;padding:0;color:var(--ink);
background-color:#FAF7F0;
background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.30 0 0 0 0 0.27 0 0 0 0 0.22 0 0 0 0.035 0"/></filter><rect width="140" height="140" filter="url(%23n)"/></svg>');
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
font-size:15px;line-height:1.5}
.hidden{display:none!important}
#app{max-width:640px;margin:0 auto;height:100dvh;max-height:100dvh;overflow:hidden;padding:10px;display:flex;flex-direction:column}
/* 顶栏 */
#topbar{display:flex;align-items:center;justify-content:space-between;
padding:8px 4px;border-bottom:2px solid var(--gold);margin-bottom:10px}
#topbar h1{font-size:17px;margin:0;color:var(--ink)}
#topbar h1 small{font-size:11px;color:var(--ink2);font-weight:normal}
#topbar.grp{display:flex;gap:6px}
.tbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);
border-radius:10px;padding:8px 10px;font-size:13px;min-height:40px}
/* 棋盘 */
#boardWrap{position:relative}
#board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);
border-radius:8px;min-height:48px;padding:2px;
display:flex;flex-direction:column;align-items:center;justify-content:center;
font-size:10px;color:var(--ink2);text-align:center;box-shadow:var(--shadow)}
@media (max-width:420px){
.tile{min-height:44px}
.tile.tn{font-size:10px}
.tk{width:12px;height:12px;font-size:8px}
}
.tile.tn{font-size:11px;font-weight:bold;color:var(--ink);line-height:1.25}
.tile.tp{font-size:10px;color:var(--gold-d)}
.tile.t-start{background:linear-gradient(135deg,#F6ECD8,#EFDDB8);border-color:var(--gold)}
.tile.t-box{background:#EDF2F7;border-color:var(--blue)}
.tile.t-fate{background:#EDF5F1;border-color:var(--bamboo)}
.tile.t-tax{background:#F9EFEF;border-color:var(--red)}
.tile.t-land.l1{border-left:4px solid var(--bamboo)}
.tile.t-land.l2{border-left:4px solid var(--blue)}
.tile.t-land.l3{border-left:4px solid var(--gold)}
.tile.cur{outline:3px solid var(--gold);outline-offset:-1px}
.tile.own{position:absolute;top:1px;left:3px;font-size:9px;font-weight:bold}
.tile.lv{position:absolute;top:1px;right:3px;font-size:9px;color:var(--gold-d)}
.tile.tks{position:absolute;bottom:1px;left:0;right:0;display:flex;justify-content:center;gap:1px;flex-wrap:nowrap}
.tk{width:14px;height:14px;border-radius:50%;font-size:9px;color:#fff;
display:flex;align-items:center;justify-content:center;font-weight:bold;
border:1px solid rgba(255,255,255,.7);flex:0 0 auto}
.tk.more{background:#8A7F72!important}
img.av{object-fit:cover;border-radius:50%;border:2px solid #C9A86A;background:#fff}
/* 套色集齐标记：暖金光晕 */
.tile.setdone{box-shadow:0 0 0 2px var(--gold),var(--shadow)}
/* ===== v0.8 棋盘视觉升级 ===== */
.tico{width:24px;height:24px;margin:0 auto;flex:none}
.tico svg{width:100%;height:100%;display:block}
.tile.t-land.l1{background:#F1F6F0}
.tile.t-land.l2{background:#EFF3F8}
.tile.t-land.l3{background:#FBF5E9}
.tile .obdg{position:absolute;bottom:2px;left:3px;width:16px;height:16px;border-radius:50%;border:1px solid var(--gold);object-fit:cover}
#topbar h1{position:relative;padding-left:12px}
#topbar h1::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:4px;border-radius:2px;background:linear-gradient(var(--gold),var(--gold-d))}

/* 开局分段选择器 */
.seg{display:flex;gap:6px;justify-content:center;margin:6px 0}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink2);
border-radius:10px;padding:8px 14px;font-size:14px;min-height:44px}
.seg button.sel{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#fff;border-color:var(--gold);font-weight:bold}
.seglab{font-size:12px;color:var(--ink2);text-align:center;margin-top:10px}
/* 中央面板 */
#center{grid-area:2/2/5/8;background:var(--card);border:2px solid var(--gold);
border-radius:12px;padding:10px;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow);min-height:150px}
#center.cp{font-size:16px;font-weight:bold}
#center.cp.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}
#center.csub{font-size:12px;color:var(--ink2);text-align:center}
#dice{font-size:44px;line-height:1}
/* 按钮 */
.btn{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#fff;border:none;
border-radius:12px;min-height:50px;padding:12px 22px;font-size:16px;font-weight:bold;
box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.blue{background:linear-gradient(135deg,var(--blue),#5E84A0)}
.btn:disabled{opacity:.5}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* 玩家卡 */
#plist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:8px 10px;box-shadow:var(--shadow);font-size:13px}
.pcard.on{border:2px solid var(--gold)}
.pcard.out{opacity:.45}
.pcard.ph{display:flex;align-items:center;gap:6px;font-weight:bold;font-size:14px}
.pcard.pdot{width:14px;height:14px;border-radius:50%;color:#fff;font-size:10px;
display:flex;align-items:center;justify-content:center}
.pcard.pa{color:var(--gold-d);font-weight:bold}
.pcard.pit{font-size:11px;color:var(--ink2)}
.pcard.rank{margin-left:auto;font-size:11px;color:var(--ink2)}
/* 日志 */
#log{background:var(--card);border:1px solid var(--line);border-radius:12px;
margin-top:10px;padding:8px 10px;font-size:12px;color:var(--ink2);
max-height:110px;overflow-y:auto}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 弹窗 */
#modal{position:fixed;inset:0;background:rgba(74,66,56,.45);z-index:50;
display:flex;align-items:center;justify-content:center;padding:16px}
#mbox{background:var(--bg);border-radius:16px;max-width:440px;width:100%;
max-height:86vh;overflow:auto;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
#mbox h2{margin:0 0 10px;font-size:18px;text-align:center}
#mbox.q{font-size:16px;font-weight:bold;margin-bottom:12px}
.qopt{display:block;width:100%;text-align:left;background:var(--card);
border:1px solid var(--line);border-radius:12px;min-height:52px;
padding:10px 12px;font-size:15px;margin-bottom:8px;color:var(--ink)}
.qopt:active{border-color:var(--gold)}
.qopt.right{border:2px solid var(--bamboo);background:#EDF5F1}
.qopt.wrong{border:2px solid var(--red);background:#F9EFEF}
#mbox.c{font-size:14px;color:var(--ink2);text-align:center;margin:8px 0}
#mbox.big{font-size:26px;font-weight:bold;text-align:center;color:var(--gold-d);margin:6px 0}
/* 棋子逐格跳动 */
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-7px)}100%{transform:translateY(0)}}
.tile.cur .tk{animation:hop .22s ease}

/* ===== v0.5 动画 ===== */
.tile .flag{position:absolute;top:3px;right:5px;width:2px;height:15px;background:var(--gold-d);transform-origin:bottom center;animation:flagpop .55s ease;z-index:3}
.tile .flag::after{content:'';position:absolute;top:0;left:2px;border:5px solid transparent;border-left:8px solid var(--gold)}
@keyframes flagpop{0%{transform:scale(0) rotate(-25deg)}60%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes growpulse{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.tile.grow{animation:growpulse .7s ease;z-index:2}
.floatxt{position:fixed;transform:translateX(-50%);font-weight:800;font-size:18px;color:var(--gold-d);z-index:70;pointer-events:none;animation:floatup .9s ease-out forwards;white-space:nowrap}
@keyframes floatup{to{transform:translate(-50%,-32px);opacity:0}}
.coinfly{position:fixed;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F6DEA8,var(--gold));z-index:70;pointer-events:none;transition:transform .7s ease-in,opacity .7s}
.boxclosed{width:84px;height:84px;margin:10px auto;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold-d));position:relative;animation:boxshake .32s ease 3;box-shadow:var(--shadow)}
.boxclosed::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:7px;margin-left:-3.5px;background:rgba(255,255,255,.55);border-radius:4px}
@keyframes boxshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-11deg)}75%{transform:rotate(11deg)}}
.fcard{perspective:700px;width:230px;min-height:120px;margin:10px auto}
.fcin{position:relative;width:100%;min-height:120px;transform-style:preserve-3d;transition:transform .6s}
.fcard.flip .fcin{transform:rotateY(180deg)}
.fcface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:bold}
.fcfront{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#fff;font-size:46px}
.fcback{background:var(--card);border:2px solid var(--gold);color:var(--ink);font-size:15px;transform:rotateY(180deg);padding:10px;text-align:center;position:relative;min-height:120px}
@keyframes edgesh{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
body.edgeshake #app{animation:edgesh .4s ease}
#sSetup,#sGame{display:flex;flex-direction:column;height:100%;overflow:hidden;min-height:0}
#setbox{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.scroll-inner{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#sGame #topbar{flex:none}
#boardWrap{flex:none}
#plist{flex:none}
#log{flex:none}
.bigpop{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%) scale(.5);font-size:44px;font-weight:900;color:var(--gold-d);text-shadow:0 2px 0 #fff,0 4px 14px rgba(201,168,106,.55);z-index:80;pointer-events:none;animation:bigpop .85s ease-out forwards;white-space:nowrap}
@keyframes bigpop{30%{transform:translate(-50%,-50%) scale(1.18);opacity:1}100%{transform:translate(-50%,-64%) scale(1);opacity:0}}
/* ===== v0.9 彩蛋惊喜 ===== */
#eggLayer{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
#eggLayer .egg{position:absolute;left:-70px;top:60vh;width:56px;height:56px;cursor:pointer;pointer-events:auto;animation:eggrun 4s linear forwards,eggbob .55s ease-in-out infinite alternate}
#eggLayer .egg.rtl{animation-name:eggrunR,eggbob}
#eggLayer .egg .eggav,#eggLayer .egg svg{width:56px;height:56px;display:block}
#eggLayer .egg svg{filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
#eggLayer .egg .eggav{border-radius:50%;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
#eggLayer .egg.roll .eggav{animation:eggroll .7s linear infinite}
#eggLayer .egg.goldm .eggav{filter:sepia(.9) saturate(2.6) hue-rotate(-12deg) brightness(1.12) drop-shadow(0 0 10px #f6dea8)}
#eggLayer .egg .trail{position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle,rgba(246,222,168,.6),transparent 70%);animation:trailpulse .6s ease-in-out infinite alternate;pointer-events:none}
#eggLayer .egg.caught{pointer-events:none;animation:eggpop .32s ease-out forwards}
@keyframes eggrun{from{left:-70px}to{left:calc(100vw + 70px)}}
@keyframes eggrunR{from{left:calc(100vw + 70px)}to{left:-70px}}
@keyframes eggbob{from{transform:translateY(-7px)}to{transform:translateY(7px)}}
@keyframes eggroll{to{transform:rotate(360deg)}}
@keyframes eggpop{40%{transform:scale(1.35)}100%{transform:scale(.1);opacity:0}}
@keyframes trailpulse{from{opacity:.5;transform:scale(.92)}to{opacity:1;transform:scale(1.08)}}
.dust{position:fixed;width:9px;height:9px;border-radius:50%;background:#CBBFAE;z-index:70;pointer-events:none;animation:dustup .7s ease-out forwards}
@keyframes dustup{to{transform:translateY(-28px) scale(1.7);opacity:0}}
.stamp{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);border:4px solid #C05555;color:#C05555;font-size:42px;font-weight:900;padding:4px 20px;border-radius:10px;z-index:80;pointer-events:none;opacity:0;background:rgba(255,255,255,.88);text-align:center;line-height:1.3}
.stamp small{font-size:14px;display:block;font-weight:normal}
@keyframes stampin{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4)}22%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(.96)}}
.stamp.go{animation:stampin 1.1s ease forwards}
.pcard.out{filter:grayscale(.85)}
body.noanim *{animation-duration:.01ms!important;transition-duration:.01ms!important}
/* 新手引导 */
#tut{position:fixed;inset:0;background:rgba(74,66,56,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
#tutbox{background:var(--bg);border-radius:16px;max-width:420px;width:100%;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#tutbox h2{margin:0 0 8px;font-size:18px;text-align:center}
#tutstep{text-align:center;font-size:12px;color:var(--ink2);margin-bottom:8px}
#tutbody{font-size:15px;line-height:1.7;margin-bottom:14px}
#tutbody b{color:var(--gold-d)}
/* 结算屏 */
.srow{display:flex;align-items:flex-start;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.srow.win{border:2px solid var(--gold);background:#FBF6EA}
.sdot{width:16px;height:16px;border-radius:50%;flex:0 0 auto;margin-top:2px}
.sstat{font-size:11px;color:var(--ink2);margin-top:2px;line-height:1.5}
/* ===== v0.7 道具/技能/调试 ===== */
.ichip{border:1px solid var(--gold);background:#FBF6EA;color:var(--gold-d);
border-radius:8px;padding:3px 7px;font-size:11px;margin:1px 2px 1px 0;min-height:30px}
.ichip.off{opacity:.45;border-color:var(--line);color:var(--ink2);background:var(--card)}
.skillbtn{border:1px solid var(--blue);background:#EDF2F7;color:#5E84A0;
border-radius:8px;padding:3px 7px;font-size:11px;margin-top:4px;min-height:30px;width:100%}
.skillbtn.off{opacity:.45;border-color:var(--line);color:var(--ink2);background:var(--card)}
.pit{line-height:1.9}
.bdg{position:absolute;bottom:1px;right:3px;font-size:9px;background:var(--red);color:#fff;
border-radius:6px;padding:0 4px;font-weight:bold;z-index:2}
#dbgbox h3{margin:0 0 8px;font-size:13px;color:#9a958c;text-align:center;font-weight:normal}
#dbgbox .dbtn{display:block;width:100%;background:none;border:1px solid #ddd8cc;border-radius:8px;
color:#8a857c;font-size:13px;padding:9px;margin-bottom:6px;min-height:40px}
#dbgbox .dbtn:active{background:#e9e5da}
/* 设置页 */
#setbox{background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
#setbox h2{margin-top:0;text-align:center}
.prow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.prow.pdot{width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;
display:flex;align-items:center;justify-content:center;font-weight:bold}
.prow input{flex:1;border:1px solid var(--line);border-radius:10px;
min-height:44px;padding:8px 12px;font-size:15px}
.pblock{margin-bottom:10px}
.chara-card{font-size:12px;color:var(--ink2);background:#FBF8F1;border:1px dashed var(--line);
border-radius:10px;padding:6px 10px;margin-top:6px;line-height:1.6}
.chara-card b{color:var(--gold-d)}
.chara-card .intro{color:var(--ink2);font-style:italic}
.cntrow{display:flex;align-items:center;justify-content:center;gap:16px;margin:14px 0}
.cntrow.btn{min-width:52px}
#pcount{font-size:22px;font-weight:bold;min-width:40px;text-align:center}
.note{font-size:12px;color:var(--ink2);background:#F6F1E7;border-radius:10px;padding:10px;margin-top:12px}
</style>
</head>
<body>
<div id="app">
<!-- 设置页 -->
<div id="sSetup">
<div id="topbar"><h1>金榜大亨 <small>课堂版 · MYSKME</small></h1></div>
<div id="setbox">
<h2>开局设置</h2>
<div class="cntrow">
<button class="btn ghost" id="pMinus">−</button>
<div><div id="pcount">4</div><div style="font-size:12px;color:var(--ink2)">玩家人数</div></div>
<button class="btn ghost" id="pPlus">＋</button>
</div>
<div id="pnames"></div>
<div class="seglab">回合数</div>
<div class="seg" id="segRound">
<button data-v="15">15 回合</button><button data-v="20" class="sel">20 回合</button><button data-v="25">25 回合</button>
</div>
<div class="seglab">起始金币</div>
<div class="seg" id="segCash">
<button data-v="1000">1000</button><button data-v="1500" class="sel">1500</button><button data-v="2000">2000</button>
</div>
<div class="seglab">出题方式</div>
<div class="seg" id="segQmode">
<button data-v="bank" class="sel">内置题库</button><button data-v="offline">线下出题</button>
</div>
<div class="seglab">动画效果</div>
<div class="seg" id="segAnim">
<button data-v="1" class="sel">开启动画</button><button data-v="0">减弱动画</button>
</div>
<div class="seglab">彩蛋惊喜</div>
<div class="seg" id="segEgg">
<button data-v="1" class="sel">开</button><button data-v="0">关</button>
</div>
<div class="btnrow" style="margin-top:14px">
<button class="btn" id="btnStart">开始游戏</button>
</div>
<div class="btnrow" style="margin-top:8px">
<button class="btn ghost hidden" id="btnContinue">继续上局</button>
</div>
<div class="note">2～6 人本地轮流。棋子按顺序：猴先生、鱼小姐、蛋、驴、茶壶、蛇（猴先生系列），每人有被动技能。2 人局默认 15 回合，多人默认 20 回合。集齐同色系地产（竹青/雾蓝/暖金各 5 块）该系租金翻倍、升级费 8 折。破产即淘汰。</div>
</div>
</div>
<!-- 游戏页 -->
<div id="sGame" class="hidden">
<div id="topbar">
<h1 id="gameTitle">金榜大亨 <small id="roundLab">第 1/20 回合</small></h1>
<div class="grp">
<button class="tbtn" id="btnRule">规则</button>
<button class="tbtn" id="btnEnd">结算</button>
<button class="tbtn" id="btnNew">重开</button>
</div>
</div>
<div id="boardWrap"><div id="board"></div></div>
<div id="plist"></div>
<div id="log"></div>
</div>
<!-- 弹窗 -->
<div id="modal" class="hidden"><div id="mbox"></div></div>
<!-- v0.9 彩蛋惊喜层 -->
<div id="eggLayer"></div>
<!-- 新手引导 -->
<div id="tut" class="hidden"><div id="tutbox"><h2>玩法速览</h2><div id="tutstep"></div><div id="tutbody"></div><div class="btnrow"><button class="btn ghost" id="tutPrev">上一步</button><button class="btn" id="tutNext">下一步</button></div></div></div>
</div>
<script>
"use strict";
/* ============================================================
金榜大亨 v0.4（成品候选）—— MYSKME × 英语课堂
单文件离线版。题库 QBANK 为内置中考英语样例，

v0.2 新增：地产套色收集加成（同色系集齐租金翻倍）、

}

/* 租金 = 地价 × [0.3, 0.6, 1.0][等级-1]；升级费 = 地价 × 0.5（集齐该系套色后 8 折）；
   套色加成：集齐同色系 5 块地产，该系租金 ×2、升级费 8 折 */
function rentOf(tile){ return Math.round(tile.price*[0.3,0.6,1.0][(tile.level||1)-1]*setMult(tile));}
function upCost(tile){
  var base=tile.price*0.5;
  if(tile.owner!=null&&typeof G!=='undefined'&&G&&hasSet(tile.owner,landTier(tile.price)))base*=0.8;
  return Math.round(base);
}
function setMult(tile){
  if(tile.t!=='land'||tile.owner==null||!G)return 1;
  return hasSet(tile.owner,landTier(tile.price))?2:1;
}
function hasSet(pid,tier){
  var all=G.tiles.filter(function(t){return t.t==='land'&&landTier(t.price)===tier;});
  return all.length>0&&all.every(function(t){return t.owner===pid;});
}
function setProgress(pid,tier){
  var all=G.tiles.filter(function(t){return t.t==='land'&&landTier(t.price)===tier;});
  var mine=all.filter(function(t){return t.owner===pid;}).length;
  return mine+'/'+all.length;
}

/* canvas-confetti 自包含实现（MIT，与连连看/寻微同款移植） */
function confetti(o){
  try{
  var c=document.createElement('canvas');
  c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:99';
  document.body.appendChild(c);
  var x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  var n=o.particleCount||60, sp=((o.spread||70)*Math.PI/180)/2,
      ox=(o.origin&&o.origin.x||.5)*c.width, oy=(o.origin&&o.origin.y||.5)*c.height,
      cl=o.colors||['#C9A86A','#7A9BB5','#7BA08B','#F6DEA8'], ps=[], i, a;
  for(i=0;i<n;i++){ a=-Math.PI/2+(Math.random()*2-1)*sp;
    ps.push({x:ox,y:oy,vx:Math.cos(a)*(3+Math.random()*5),vy:Math.sin(a)*(3+Math.random()*5),
      s:3+Math.random()*5,r:Math.random()*6.3,w:(Math.random()-.5)*.3,c:cl[i%cl.length],l:1}); }
  var t0=Date.now();
  (function f(){ x.clearRect(0,0,c.width,c.height); var k=0;
    for(i=0;i<n;i++){ var q=ps[i]; if(q.l<=0)continue; k=1;
      q.x+=q.vx; q.y+=q.vy; q.vy+=.22; q.vx*=.99; q.r+=q.w; q.l-=.008;
      x.save(); x.translate(q.x,q.y); x.rotate(q.r);
      x.globalAlpha=q.l<0?0:q.l; x.fillStyle=q.c;
      x.fillRect(-q.s/2,-q.s/3,q.s,q.s*.66); x.restore(); }
    if(k&&Date.now()-t0<3000)requestAnimationFrame(f);
    else if(c.parentNode)c.parentNode.removeChild(c); })();
  }catch(e){}
}

async function useItem(p,k){

  if(k==='remote'){
    p.items.remote--; p.rmt=true;

  }
  if(k==='free'){ addLog(p.name+'：免租卡在交租时用，先揣兜里'); sNo(); return; }

  if(k==='barrier'){
    showM('<h2>路障</h2><div class="c">在前方几格设卡？路过者罚站 1 回合</div>'+
      '<div class="btnrow">'+[1,2,3,4,5,6].map(function(n){return '<button class="btn ghost" data-v="'+n+'">'+n+' 格</button>';}).join('')+'</div>'+
      '<div class="btnrow" style="margin-top:6px"><button class="btn ghost" data-v="x">取消</button></div>');
    var v=await waitBtn('.btn'); hideM();
    if(v==='x'||v==null)return;
    var idx=(p.pos+(+v))%TILES.length;
    if(G.barriers.indexOf(idx)<0)G.barriers.push(idx);
    p.items.barrier--;
    addLog(p.name+' 在「'+G.tiles[idx].name+'」设下路障，过路的准备罚站吧');
    sOk(); save(); doTurn(); return;
  }
  if(k==='swap'){
    var cands=alivePlayers().filter(function(q){return q!==p;});
    if(!cands.length){ addLog('没人可换，换位卡省下了'); return; }
    showM('<h2>换位卡</h2><div class="c">和谁交换位置？乾坤大挪移！</div>'+
      '<div class="btnrow">'+cands.map(function(q){return '<button class="btn ghost" data-v="'+q.id+'">'+q.name+'</button>';}).join('')+'</div>'+
      '<div class="btnrow" style="margin-top:6px"><button class="btn ghost" data-v="x">取消</button></div>');
    var v2=await waitBtn('.btn'); hideM();
    if(v2==='x'||v2==null)return;
    var q=G.players[+v2], tp=p.pos; p.pos=q.pos; q.pos=tp;
    p.items.swap--;
    addLog(p.name+' 使用换位卡，和 '+q.name+' 交换位置！'+q.name+'：我怎么在这？');
    sOk(); renderAll(); save(); doTurn(); return;
  }
}

async function useSkill(p){

  }
  if(cid==='fish'){
    p.koi=true; p.skillCd=sk.cd;

  }
  if(cid==='egg'){
    p.skillCd=sk.cd;
    addLog(p.name+'【滚】：蛋滚起来了，前进 3 格！');
    floatBig('滚！'); sStep();
    await moveSteps(p,3);

  }
  if(cid==='donkey'){
    p.halfBuy=true; p.skillCd=sk.cd;
    addLog(p.name+'【脚踏实地】：下次买地 5 折，实在人！');
    floatBig('脚踏实地！'); sOk(); renderAll(); save(); return;
  }
  if(cid==='teapot'){
    cands=alivePlayers().filter(function(x){return x!==p;});
    if(!cands.length){ addLog('没人可请，茶先自己喝了'); sNo(); return; }

      '<div class="btnrow">'+cands.map(function(x){return '<button class="btn ghost" data-v="'+x.id+'">'+x.name+'</button>';}).join('')+'</div>'+
      '<div class="btnrow" style="margin-top:6px"><button class="btn ghost" data-v="x">取消</button></div>');
    v=await waitBtn('.btn'); hideM();
    if(v==='x'||v==null)return;

    addLog(p.name+'【请喝茶】请 '+t.name+' 喝茶，'+t.name+' 喝完这壶再走，罚站 1 回合');
    floatBig('请喝茶！'); sOk(); renderAll(); save(); return;
  }
  if(cid==='snake'){
    var lands=[];
    G.tiles.forEach(function(t,i){ if(t.t==='land'&&t.owner===p.id)lands.push(i); });
    if(!lands.length){ addLog(p.name+'【滑】：名下无地产，滑了个寂寞'); sNo(); return; }

    floatBig('滑！'); sStep(); renderAll(); save(); return;

async function quizPhase(p){
  G.phase='quiz';

  if(G.cfg.qmode==='offline'){
    showM('<h2>'+p.name+' 请答题</h2><div class="q">请老师线下出题，学生作答后判定</div>'+

      '<div class="c">线下出题模式：用纸质题提问，手动判定</div>');
    var v=await waitBtn('.qopt');
    ok=(v==='1');
    hideM();
  }else{
    var q=drawQ();
    var opts=q.opts.map(function(o,i){
      return '<button class="qopt" data-v="'+i+'">'+'ABCD'[i]+'. '+o+'</button>';
    }).join('');
    showM('<h2>'+p.name+' 请答题</h2><div class="q">'+q.q+'</div>'+opts+'<div class="c">答对才能掷骰子</div>');
    var v2=await waitBtn('.qopt');
    var btns=document.querySelectorAll('.qopt');
    ok=(+v2===q.a);
    btns[q.a].classList.add('right');
    if(!ok&&btns[+v2])btns[+v2].classList.add('wrong');
    await sleep(ok?600:1400);
    hideM();
  }
  p.st=p.st||{qOk:0,qTot:0,mx:0,box:0};
  p.st.qTot++;
  if(ok){
    p.st.qOk++;
    p.combo++;
    p.st.mx=Math.max(p.st.mx,p.combo);
    sOk();
    addLog(p.name+' 答对了'+(p.combo>=2?'（'+p.combo+'连击！）':''));
    if(p.combo===3){
      var rk3=randItemKey();
      if(giveItem(p,rk3))addLog('3 连击奖励：'+p.name+' 获得道具【'+ITEMNAME[rk3]+'】');
      else addLog('3 连击奖励：'+p.name+' 道具栏满了，奖励被驴叼走了');
    }
    dicePhase(p,false);
  }else{
    p.combo=0;
    sNo();
    addLog(p.name+' 答错了，回合结束');
    endTurn();
  }
}

var DICEFACE=['⚀','⚁','⚂','⚃','⚄','⚅'];
async function dicePhase(p,bonus){
  G.phase='dice';
  renderAll();
  if(p.rmt){
    setCenter('<div class="cp">'+p.name+' 遥控骰子</div><div class="csub">选择点数</div>'+

        return '<button class="btn ghost" data-v="'+n+'">'+n+'</button>';}).join('')+'</div>');
    var v=await new Promise(function(res){
      $('center').onclick=function(e){var b=e.target.closest('button');if(b){$('center').onclick=null;res(+b.getAttribute('data-v'));}};
    });
    p.rmt=false;
    await moveAndSettle(p,v,bonus);
    return;
  }
  setCenter('<div class="cp">'+p.name+' 掷骰子</div><div id="dice">⚄</div>'+
    '<button class="btn" id="btnRoll">掷！</button>');

    $('btnRoll').onclick=function(){ $('btnRoll').disabled=true; sDice(); res(); };
  });
  var face=0, iv=setInterval(function(){ face=(Math.random()*6)|0; $('dice').textContent=DICEFACE[face]; },80);
  await sleep(700); clearInterval(iv);
  var steps=face+1;
  if(p.diceMod){ steps+=p.diceMod; addLog('舌头打结：掷骰 '+(p.diceMod>0?'+':'')+p.diceMod+' 点'); p.diceMod=0; }
  if(p.dicePlus){ steps+=p.dicePlus; addLog('接住滚来的蛋：掷骰 +'+p.dicePlus+' 点，稳！'); p.dicePlus=0; }
  steps=Math.max(1,steps);
  if(p.koi){ face=5; steps=6; p.koi=false; addLog(p.name+'【锦鲤附体】：必出 6 点！'); $('dice').textContent=DICEFACE[5]; }
  if(p.combo>=2){
    steps+=1; addLog('连击加成：+1 步');
    floatBig('连击 ×'+p.combo);
    document.body.classList.add('edgeshake');
    setTimeout(function(){document.body.classList.remove('edgeshake');},450);
  }
  $('dice').textContent=DICEFACE[face];
  await sleep(400);
  await moveAndSettle(p,steps,bonus);
}
/* ---------- 移动 ---------- */
async function moveSteps(p,steps,dir){
  dir=dir||1;
  for(var s=0;s<steps;s++){
    p.pos=(p.pos+dir+TILES.length)%TILES.length;
    if(dir>0&&p.pos===0){
      var fb=(p.chara&&p.chara.id==='fish')?100:0;
      p.cash+=SALARY+fb;
      addLog(p.name+' 经过起点，领工资 +'+(SALARY+fb)+(fb?'（如鱼得水 +100）':''));
      /* v0.7：经过起点 30% 得随机道具（每人最多 3 个） */
      if(Math.random()<0.3){
        var gk=randItemKey();
        if(giveItem(p,gk))addLog('起点福利：'+p.name+' 顺手捞到【'+ITEMNAME[gk]+'】');
        else addLog('起点福利：'+p.name+' 道具栏满了，福利被驴叼走了');
      }
    }
    /* v0.7：路障 */
    if(dir>0&&G.barriers&&G.barriers.indexOf(p.pos)>=0){
      G.barriers.splice(G.barriers.indexOf(p.pos),1);
      p.stuck=true;
      addLog(p.name+' 哎哟！踩中路障，罚站 1 回合');
      renderTiles();
      await sleep(anim()?500:60);
      break;
    }
    renderTiles();
    var d=$('tile'+p.pos); if(d)d.classList.add('cur');
    sStep();
    await sleep(200);
    if(d)d.classList.remove('cur');
  }
  renderAll();
}
async function maybeChase(p){
  if(G.over||p.elim||!p.chara||p.chara.id!=='snake')return;
  if(G.chaseRound===G.round)return;
  var eg=charaPlayer('egg');

  eg.pos=(eg.pos+1)%TILES.length;
  renderAll();
  dustPuff(eg.pos);
  sStep();
  await sleep(anim()?600:80);
  renderAll();
}
async function moveAndSettle(p,steps,bonus){

/* ---------- 盲盒（含保底） ---------- */
function drawBox(p){
  var pool=BOXPOOL, i, tot=0;
  if(G.pity>=3){ pool=pool.filter(function(b){return b.good;}); addLog('保底触发！必出好东西'); }
  /* 猴先生【主角光环】：好东西概率相对 +15%（精确换算权重乘数） */
  var isMonkey=(p&&p.chara&&p.chara.id==='monkey')&&G.pity<3, m=1;
  if(isMonkey){
    var wg=0, wb=0;
    for(i=0;i<pool.length;i++){ if(pool[i].good)wg+=pool[i].w; else wb+=pool[i].w; }
    if(wb>0.15*wg)m=1.15*wb/(wb-0.15*wg);
  }
  for(i=0;i<pool.length;i++)tot+=pool[i].w*(pool[i].good?m:1);
  var r=Math.random()*tot, b=null;
  for(i=0;i<pool.length;i++){ r-=pool[i].w*(pool[i].good?m:1); if(r<0){b=pool[i];break;} }
  return b||pool[pool.length-1];
}
async function blindBox(p){
  sBox();
  showM('<h2>盲盒</h2><div class="boxclosed"></div><div class="c">晃三下，开！</div>');
  await sleep(anim()?1000:80);
  var b=drawBox(p);
  p.st=p.st||{qOk:0,qTot:0,mx:0,box:0};
  p.st.box++;
  if(b.good)G.pity=0; else G.pity++;
  var desc='';
  if(b.k==='cash'){ p.cash+=b.v; desc='金币 +'+b.v+'（剩余 '+p.cash+'）'; }
  else if(b.k==='step'){ desc='额外前进 '+b.v+' 步'; }
  else if(b.k==='item'){ var gk=giveItem(p,b.v); desc=gk?('获得道具：'+ITEMNAME[b.v]):('道具栏满了，【'+ITEMNAME[b.v]+'】被驴叼走了'); }
  else if(b.k==='back'){ desc='倒退 '+b.v+' 步…'; }
  else if(b.k==='tax'){
    if(p.items.shield>0){ p.items.shield--; desc='保护伞自动撑开！免交 '+b.v+' 罚款'; addLog(p.name+' 保护伞发动，免交罚款 '+b.v); }
    else { p.cash-=b.v; desc='交税 -'+b.v+'（剩余 '+p.cash+'）'; } }
  else if(b.k==='diceminus'){ p.diceMod=-1; desc='下回合掷骰 -1 点，舌头还没捋直'; }
  showM('<h2>盲盒</h2><div class="big">'+b.label+'</div><div class="c">'+desc+'</div>'+
    '<div class="btnrow"><button class="btn" data-v="ok">收下</button></div>');
  await waitBtn('.btn'); hideM();
  addLog(p.name+' 开盲盒：'+b.label+((p.chara&&p.chara.id==='monkey'&&b.good)?'【主角光环】':''));
  if(b.k==='step'){ await moveSteps(p,b.v); await settle(p); await maybeChase(p); }
  else if(b.k==='back'){ await moveSteps(p,b.v,-1); await settle(p); await maybeChase(p); }
  renderAll(); await checkBankrupt(p);
}

async function fateDraw(p){
  var pool=FATEPOOL;
  /* 茶壶【壶里乾坤】：必出正面事件（含绕口令新卡） */
  if(p.chara&&p.chara.id==='teapot'){
    pool=FATEPOOL.filter(function(f){
      return (f.f==='move'&&f.v>0)||(f.f==='cash'&&f.v>0)||f.f==='tostart'||f.f==='item'
        ||f.f==='tq'||f.f==='tqall';
    });
    addLog(p.name+' 壶里乾坤：必出正面事件！');
  }
  var f=pool[(Math.random()*pool.length)|0];
  await fateFlipAnim(f.label);
  addLog(p.name+' 抽到命运：'+f.label);
  if(f.f==='move'){ await moveSteps(p,Math.abs(f.v),f.v>0?1:-1); await settle(p); await maybeChase(p); }
  else if(f.f==='cash'){ p.cash+=f.v; }
  else if(f.f==='tostart'){
    p.pos=0;
    var fb2=(p.chara&&p.chara.id==='fish')?100:0;
    p.cash+=SALARY+fb2;
    addLog(p.name+' 直达起点 +'+(SALARY+fb2)+(fb2?'（如鱼得水 +100）':''));
  }
  else if(f.f==='item'){ p.items[f.v]++; }
  else if(f.f==='tq'){ await tongueChallenge(p,f.v); }
  else if(f.f==='tqall'){ await tongueContest(p,f.v); }
  renderAll(); await checkBankrupt(p);
}

/* ---------- 破产 ---------- */
async function checkBankrupt(p){
  if(p.cash>=0||p.elim)return;
  /* 蛋【蛋壳护体】：第一次破产保留 500 金币、地产不释放 */
  if(p.chara&&p.chara.id==='egg'&&!p.eggUsed){
    p.eggUsed=true; p.cash=500;
    addLog(p.name+' 蛋壳护体发动！保留 500 金币，地产不释放（蛋壳已碎，仅一次）');
    var sn=charaPlayer('snake');
    if(sn)addLog('蛇：哟，蛋壳还挺硬嘛——下次可没这么走运');
    renderAll(); return;
  }
  p.elim=true;
  G.tiles.forEach(function(t){ if(t.owner===p.id){t.owner=null;t.level=1;t.upSpent=0;} });
  addLog(p.name+' 破产淘汰！地产全部释放，大家快来捡漏');
  renderAll();
  bankruptStamp(p.name);
  await sleep(anim()?1150:60);
}
/* ================= 回合结束 / 胜负 ================= */
function endTurn(){
  if(G.over)return;
  G.phase='end';
  G.turnSeq=(G.turnSeq||0)+1;
  var alive=alivePlayers();
  if(alive.length===1){ gameOver(alive[0],'对手全部破产'); return; }
  var n=G.players.length, i=G.turn;
  for(var k=0;k<n;k++){ i=(i+1)%n; if(!G.players[i].elim)break; }
  if(i<=G.turn){ G.round++; }
  G.turn=i;
  save(); renderAll();
  if(G.round>G.cfg.maxRound){
    var rk=rankList();
    gameOver(rk[0],G.cfg.maxRound+' 回合结束，资产最高');
    return;
  }
  /* 长对局中场战报：第 13 回合播报资产榜 */
  if(G.round===13&&G.cfg.maxRound>=25&&!G.midShown){
    G.midShown=true; save();
    var rk2=rankList();
    showM('<h2>中场战报</h2><div class="c">第 13 回合，赛程过半，看看谁领先</div>'+
      rk2.map(function(p,j){
        return '<div class="prow"><b>'+(j+1)+'.</b> '+p.name+'<span style="margin-left:auto">资产 '+assets(p)+'</span></div>';
      }).join('')+
      '<div class="btnrow" style="margin-top:10px"><button class="btn" data-v="ok">继续比赛</button></div>');
    waitBtn('.btn').then(function(){ hideM(); setTimeout(function(){ if(!G.over)doTurn(); },350); });
    return;
  }
  /* 延迟一拍再开下回合，避免 modal 残留 */
  setTimeout(function(){ if(!G.over)doTurn(); },350);
}
function gameOver(winner,reason){
  G.over=true; clearSave(); renderAll(); sWin();
  if(anim())confetti({particleCount:130,spread:110,colors:['#C9A86A','#7A9BB5','#7BA08B','#F6DEA8']});
  var rk=rankList();
  var medals=['冠军','亚军','季军'];
  var rows=rk.map(function(p,i){
    var st=p.st||{qOk:0,qTot:0,mx:0,box:0};
    var lands=G.tiles.filter(function(t){return t.owner===p.id;}).length;
    var rate=st.qTot?Math.round(st.qOk/st.qTot*100)+'%':'—';
    return '<div class="srow'+(i===0?' win':'')+'">'+
      avImg(p.chara,'sdot')+
      '<div><b>'+(medals[i]||('第'+(i+1)+'名'))+' · '+p.name+'</b>'+(p.elim?'（破产）':'')+
      '<div class="sstat">资产 '+assets(p)+' · 地产 '+lands+' 块 · 答题 '+st.qOk+'/'+st.qTot+'（'+rate+'） · 最高连击 '+st.mx+' · 盲盒 '+st.box+' 次</div></div></div>';
  }).join('');
  showM('<h2>比赛结束</h2><div class="big">★ '+winner.name+' 夺冠 ★</div>'+
    '<div class="c">'+reason+'</div>'+rows+
    '<div class="btnrow" style="margin-top:12px"><button class="btn" data-v="ok">再来一局</button></div>');
  waitBtn('.btn').then(function(){ location.reload(); });
}
/* ================= 规则 / 设置页接线 ================= */
function showRule(){
  showM('<h2>玩法规则</h2><div style="font-size:14px">'+
    '<p><b>1. 答题掷骰</b>：每回合先答题，答对才能掷骰子。内置题库模式用屏幕题目；线下出题模式由老师用纸质题提问、手动判定对错。连续答对有连击：2 连击移动 +1 步，3 连击以上再掷一次。</p>'+
    '<p><b>2. 买地收租</b>：走到空地可购买；自己的地可升级到 Lv3，租金递增；走到别人的地要交租，也可以用免租卡或再答一题免租。</p>'+
    '<p><b>3. 套色加成</b>：地产分竹青 / 雾蓝 / 暖金三系，每系 5 块。集齐一系 5 块，该系所有地产租金翻倍（金色光晕标记），升级费 8 折。</p>'+
    '<p><b>4. 盲盒格</b>：12 种开奖，有金币、道具、额外步数，也有整蛊（倒退、罚款、舌头打结）；连续 3 次没开出好东西必保底。</p>'+
    '<p><b>5. 命运格</b>：10 张命运卡，前进后退、奖惩金币、直达起点、送免租卡，外加绕口令挑战（念出\"猴鲤鱼与绿鲤鱼与驴\"）和黑化肥大赛。</p>'+
    '<p><b>6. 道具</b>：遥控骰子（自选点数）、免租卡、路障（前方设卡罚站）、换位卡、保护伞（免税/罚款），每人最多 3 个；经过起点、开盲盒、3 连击可获得。</p>'+
    '<p><b>7. 胜负</b>：金币归零即破产，地产释放；回合走完后资产（金币+地产）最高者胜。经过起点领 '+SALARY+' 工资。顶栏"结算"按钮可随时提前结算。</p>'+
    '<p><b>8. 角色被动</b>：猴先生【主角光环】盲盒好东西概率+15%；鱼小姐【如鱼得水】过起点多领 100；蛋【蛋壳护体】首次破产保 500 金币不丢地；驴【倔驴讲价】买地 9 折；茶壶【壶里乾坤】命运必出正面；蛇【见好就收】有免租卡自动提示用，无卡租金 9 折。</p>'+
    '<p><b>9. 主动技能</b>：每人 1 个，冷却制——猴先生【顺手牵羊】随机偷 200；鱼小姐【锦鲤附体】下次必出 6；蛋【滚】前进 3 格；驴【脚踏实地】下次买地 5 折；茶壶【请喝茶】指定对手罚站；蛇【滑】瞬移到最近己方地产。点玩家面板上的技能按钮释放。</p>'+
    '<p><b>10. 彩蛋惊喜</b>：每回合有 25% 概率刷出小惊喜横穿屏幕——金元宝（+金币）、驴（掉道具）、蛋（下次掷骰+1）、问号盒（三选一）、稀有金猴（+500）。点中得奖，4 秒后跑掉。开局设置页可开关。</p></div>'+
    '<div class="btnrow"><button class="btn" data-v="ok">知道了</button></div>');
  waitBtn('.btn').then(hideM);
}
/* ---------- v0.7 隐藏调试菜单（标题连击 5 下） ---------- */
function showDebug(){
  showM('<div id="dbgbox"><h3>调试菜单（测试用）</h3>'+
    '<button class="dbtn" data-v="undo">撤销上一步</button>'+
    '<button class="dbtn" data-v="skip">跳过本回合</button>'+
    '<button class="dbtn" data-v="end">直接结算</button>'+
    '<button class="dbtn" data-v="x">关闭</button></div>');
  waitBtn('.dbtn').then(function(v){
    hideM();
    if(!G||G.over)return;
    if(v==='undo'){
      if(!SNAP){ addLog('没有可撤销的快照'); return; }
      try{ G=JSON.parse(JSON.stringify(SNAP)); }catch(e){ addLog('快照恢复失败'); return; }
      normalizeSave();
      save(); renderAll();
      addLog('已撤销上一步，回到本回合开始');
      doTurn();
    }else if(v==='skip'){
      addLog('调试：跳过 '+cur().name+' 的回合');
      endTurn();
    }else if(v==='end'){
      var rk=rankList(); gameOver(rk[0],'调试菜单直接结算');
    }
  });
}
/* ---------- 新手引导（首次打开，4 步） ---------- */
var TUTKEY='myskme_dfw_tut_v1', TUTI=0;
var TUTSTEPS=[
'<b>第一步：答题开路</b><br>每回合先答一道英语题（或老师用纸质题线下出题），答对才能掷骰子。连续答对有连击：2 连击多走 1 步，3 连击再掷一次！',
'<b>第二步：买地收租</b><br>走到空地可以买下来，自己的地能升级到 Lv3；踩到别人的地要交租。集齐同色系 5 块地，该系租金翻倍、升级 8 折。',
'<b>第三步：赢下比赛</b><br>回合走完后，资产（金币+地产）最高者夺冠；金币归零就破产淘汰。盲盒格和命运格里有惊喜——也有整蛊，小心驴尥蹶子！',
'<b>第四步：道具与技能</b><br>每人最多带 3 个道具：遥控骰子自选点数、免租卡、路障设卡、换位卡、保护伞。经过起点、开盲盒、3 连击都能拿到。每人还有 1 个主动技能（冷却制），点玩家面板上的技能按钮释放！'];
function renderTut(){
  $('tutstep').textContent='第 '+(TUTI+1)+' / 4 步';
  $('tutbody').innerHTML=TUTSTEPS[TUTI];
  $('tutPrev').style.visibility=TUTI===0?'hidden':'visible';
  $('tutNext').textContent=TUTI===3?'知道了，开玩！':'下一步';
}
function showTut(){ TUTI=0; renderTut(); $('tut').classList.remove('hidden'); }
function boot(){
  renderSetupNames();
  $('pcount').textContent=PCOUNT;
  syncRoundDefault();
  segWire('segRound',function(v){SEL_ROUNDS=v;});
  segWire('segCash',function(v){SEL_CASH=v;});
  segWire('segQmode',function(v){SEL_QMODE=v;});
  segWire('segAnim',function(v){SEL_ANIM=v;});
  segWire('segEgg',function(v){SEL_EGG=v;});
  $('pMinus').onclick=function(){ if(PCOUNT>2){PCOUNT--;renderSetupNames();$('pcount').textContent=PCOUNT;syncRoundDefault();} };
  $('pPlus').onclick=function(){ if(PCOUNT<6){PCOUNT++;renderSetupNames();$('pcount').textContent=PCOUNT;syncRoundDefault();} };
  $('btnStart').onclick=function(){ clearSave(); newGame(); };
  var sv=loadSave();
  if(sv&&sv.players&&!sv.over){
    if(!sv.cfg)sv.cfg={maxRound:20,startCash:1500};
    if(!sv.cfg.qmode)sv.cfg.qmode='bank';
    if(sv.cfg.egg==null)sv.cfg.egg=true;
    $('btnContinue').classList.remove('hidden');
    $('btnContinue').onclick=function(){
      G=sv;
      normalizeSave();
      if(G.cfg&&G.cfg.anim===undefined)G.cfg.anim=true;
      $('sSetup').classList.add('hidden'); $('sGame').classList.remove('hidden');
      applyAnimClass();
      buildBoard(); renderAll();
      addLog('读档成功，继续第 '+G.round+' 回合');
      doTurn();
    };
  }
  $('tutPrev').onclick=function(){ if(TUTI>0){TUTI--;renderTut();} };
  $('tutNext').onclick=function(){
    if(TUTI>=3){ $('tut').classList.add('hidden'); try{localStorage.setItem(TUTKEY,'1');}catch(e){} }
    else { TUTI++; renderTut(); }
  };
  try{ if(!localStorage.getItem(TUTKEY))showTut(); }catch(e){}
  document.addEventListener('pointerdown',function(){ac();},{passive:true});
  $('btnRule').onclick=showRule;
  $('btnNew').onclick=function(){
    if(confirm('确定重开一局吗？当前进度会丢失。')){ clearSave(); location.reload(); }
  };
  /* v0.7：随时结算 */
  $('btnEnd').onclick=function(){
    if(!G||G.over)return;
    showM('<h2>提前结算</h2><div class="c">现在就结束比赛，按当前资产排名结算？</div>'+
      '<div class="btnrow"><button class="btn" data-v="yes">确认结算</button>'+
      '<button class="btn ghost" data-v="no">再玩会儿</button></div>');
    waitBtn('.btn').then(function(v){ hideM();
      if(v==='yes'){ var rk=rankList(); gameOver(rk[0],'提前结算'); }
    });
  };
  /* v0.7：玩家面板道具/技能点击 */
  $('plist').onclick=function(e){
    if(!G||G.over)return;
    var b=e.target.closest('button'); if(!b)return;
    var k=b.getAttribute('data-k'), sk=b.getAttribute('data-sk');
    if(k){ var p=G.players[+b.getAttribute('data-p')]; useItem(p,k); }
    else if(sk){ var p2=G.players[+sk]; useSkill(p2); }
  };
  /* v0.7：标题连击 5 下（每次间隔 <500ms）→ 隐藏调试菜单 */
  (function(){
    var taps=[], gt=$('gameTitle');
    if(!gt)return;
    gt.style.userSelect='none'; gt.style.webkitUserSelect='none';
    gt.addEventListener('click',function(){
      var now=Date.now();
      taps=taps.filter(function(t){return now-t<500;});
      taps.push(now);
      if(taps.length>=5){ taps=[]; showDebug(); }
    });
  })();
}
boot();
</script>
