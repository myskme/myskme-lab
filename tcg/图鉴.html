<title>百变萌友 · 图鉴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{background:#e8dcc0;background-image:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.4) 0%,transparent 50%),repeating-linear-gradient(0deg,transparent 0 28px,rgba(120,90,20,.03) 28px 29px);color:#3a3226;font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0);overscroll-behavior-y:contain}
input,textarea{-webkit-user-select:text;user-select:text}
.top{text-align:center;padding:calc(20px + env(safe-area-inset-top,0)) 16px 8px}
.top h1{font-size:30px;color:#8a6d1a;letter-spacing:8px;font-weight:800;text-shadow:0 1px 0 #fff,0 2px 8px rgba(200,160,40,.2)}
.top p{font-size:11px;color:#a09070;margin-top:4px;letter-spacing:3px}
.bar{max-width:1100px;margin:12px auto;padding:0 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.bar input{flex:1;min-width:180px;max-width:280px;padding:11px 16px;border:1px solid #d4c89a;border-radius:22px;background:#fff;font-size:14px;outline:none;box-shadow:0 2px 8px rgba(120,90,20,.08);transition:border-color .2s,box-shadow .2s}
.bar select{padding:11px 14px;border:1px solid #d4c89a;border-radius:22px;background:#fff;font-size:14px;outline:none;cursor:pointer;box-shadow:0 2px 8px rgba(120,90,20,.08)}
.bar .toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:#6a5d40;cursor:pointer;user-select:none}
.bar .toggle input{accent-color:#c9a227}
.count{text-align:center;font-size:13px;color:#8a7d60;margin:8px 0}
.count b{color:#8a6d1a}
.overall{max-width:1100px;margin:8px auto;padding:0 16px}
.overall .label{font-size:12px;color:#8a7d60;margin-bottom:4px}
.overall .track{height:8px;background:#e8ddb8;border-radius:4px;overflow:hidden}
.overall .fill{height:100%;background:linear-gradient(90deg,#d4af37,#f0d98c);transition:width .5s}
.series-group{max-width:1100px;margin:0 auto;padding:0 16px 20px}
.series-head{display:flex;align-items:center;gap:12px;margin:20px 0 10px;background:linear-gradient(90deg,#f5ead0,#fff8e0,#f5ead0);border:1px solid #d4c89a;border-radius:10px;padding:10px 14px}
.series-head h2{font-size:16px;color:#8a6d1a;white-space:nowrap}
.series-head .track{flex:1;height:6px;background:#e8ddb8;border-radius:3px;overflow:hidden}
.series-head .fill{height:100%;background:linear-gradient(90deg,#d4af37,#f0d98c);transition:width .5s}
.series-head .pct{font-size:12px;color:#8a7d60;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;background:#fffdf5;border:1px solid #d4c89a;box-shadow:0 3px 12px rgba(120,90,20,.12),inset 0 0 0 1px rgba(255,255,255,.6);transition:transform .15s,box-shadow .15s}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 45%,transparent 60%);transform:translateX(-100%);pointer-events:none;z-index:2}
.card:hover::after{transform:translateX(100%);transition:transform .7s}
.card:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 12px 28px rgba(120,90,20,.22),inset 0 0 0 1px rgba(255,255,255,.6)}
.card.not-collected::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,220,100,.15) 50%,transparent 60%);z-index:1;pointer-events:none;animation:shimmer 3s infinite}
@keyframes shimmer{0%,100%{opacity:0}50%{opacity:1}}
.card img{width:100%;display:block;border-bottom:1px solid #e8ddb8}
.card .name{padding:7px 8px 8px;font-size:12px;text-align:center;font-weight:600}
.card .meta{font-size:10px;color:#999;text-align:center;padding-bottom:7px}
.card.not-have{opacity:1;filter:none}
.card.not-have .name{color:#8a7d60}
.card.not-have .meta{color:#b0a080}
.card.not-have .badge{opacity:.5}
.card.r-ur{box-shadow:0 0 16px 2px rgba(255,180,0,.5)}
.card.r-ssr{box-shadow:0 0 12px 2px rgba(200,100,255,.35)}
.badge{position:absolute;top:6px;right:6px;font-size:10px;font-weight:800;padding:2px 6px;border-radius:7px}
.r-ssr .badge{background:linear-gradient(135deg,#e040fb,#00bcd4);color:#fff}
.r-ur .badge{background:linear-gradient(135deg,#ffd700,#ff6a00);color:#000}
.r-sr .badge{background:#c9a227;color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.show{display:flex}
.modal .box{background:#faf3e0;border-radius:16px;padding:20px;max-width:340px;text-align:center}
.modal img{width:100%;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.3);transition:transform .15s;transform-style:preserve-3d;cursor:pointer}
.modal .box{perspective:1000px}
.modal .m-name{font-size:18px;font-weight:700;color:#8a6d1a;margin:12px 0 4px}
.modal .m-meta{font-size:13px;color:#8a7d60}
.modal .m-status{margin-top:8px;font-size:13px;font-weight:600}
.modal .m-status.yes{color:#2a8a2a}
.modal .m-status.no{color:#b04040}
.modal .close{position:absolute;top:16px;right:20px;color:#fff;font-size:32px;cursor:pointer}
@media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr);gap:8px}.top h1{font-size:22px}}
/* iPhone 优先响应式 */
@media(max-width:430px){
  .top h1{font-size:24px;letter-spacing:5px}
  .bar{padding:0 10px;gap:8px}
  .bar input{padding:10px 14px;font-size:13px;min-height:44px}
  .bar select{padding:10px 10px;font-size:13px;min-height:44px}
  .grid{grid-template-columns:repeat(3,1fr);gap:10px}
  .card .name{font-size:11px;padding:5px 4px 6px}
  .series-head{padding:8px 10px;margin:14px 0 8px}
  .series-head h2{font-size:14px}
}
@media(max-width:375px){
  .top h1{font-size:21px;letter-spacing:4px}
  .grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .card .name{font-size:10px}
}
@media(min-width:768px){
  .series-group{max-width:900px}
  .grid{grid-template-columns:repeat(5,1fr)}
}
</style>

<script>
// WebP 检测：支持则用 .webp，否则用 .jpg
window.USE_WEBP = false;
(function(){
  try{
    const c = document.createElement('canvas');
    window.USE_WEBP = c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
  }catch(e){ window.USE_WEBP = false; }
})();
function webpUrl(url){
  if(!window.USE_WEBP) return url;
  return url.replace(/\.jpg$/i, '.webp').replace(/\.png$/i, '.webp');
}
</script>

const RARITY_ORDER={R:1,SR:2,SSR:3,UR:4};
const collected=new Set(JSON.parse(localStorage.getItem("mm_col")||"[]"));
const seriesOrder=["基础","系列2","系列3","系列4","第三波","第四波","传说","性格","四季·春","东西方桥梁","补完","三国","北欧","西游记","水浒","中西名将","神话传说","射日女皇埃及","日本战国","欧洲帝王","中国帝王将相","替补","四季·夏","四季·秋","四季·冬","十二生肖","原始人","中世纪","蒸汽朋克","未来","蛋蛇补完","大师系列","隐藏款"];
const sel=document.getElementById("series");
seriesOrder.forEach(s=>{if(CARDS.some(c=>c[4]===s)){const o=document.createElement("option");o.value=s;o.textContent=s;sel.appendChild(o);}});
function getFiltered(){
  const q=document.getElementById("search").value.trim();
  const r=document.getElementById("rarity").value;
  const s=document.getElementById("series").value;
  const h=document.getElementById("have").value;
  const sort=document.getElementById("sort").value;
  let list=CARDS.filter(c=>{
    const has=collected.has(c[0]+"-"+c[1]);
    if(q&&!c[1].includes(q))return false;
    if(r&&c[2]!==r)return false;
    if(s&&c[4]!==s)return false;
    if(h==="yes"&&!has)return false;
    if(h==="no"&&has)return false;
    return true;
  });
  if(sort==="rarity") list.sort((a,b)=>RARITY_ORDER[b[2]]-RARITY_ORDER[a[2]]||a[0].localeCompare(b[0]));
  else if(sort==="name") list.sort((a,b)=>a[1].localeCompare(b[1],"zh"));
  else list.sort((a,b)=>{if(a[0]==="UR")return 1;if(b[0]==="UR")return -1;return parseInt(a[0])-parseInt(b[0]);});
  return list;
}
function cardEl(c){
  const has=collected.has(c[0]+"-"+c[1]);
  const d=document.createElement("div");
  d.className="card"+(c[2]==="SSR"?" r-ssr":"")+(c[2]==="UR"?" r-ur":"")+(c[2]==="SR"?" r-sr":"")+(!has?" not-have":"");
  d.innerHTML=`<img src="${has?('thumbs/'+webpUrl(c[3]).replace('.png','.jpg')):('thumbs/卡背-百变萌友-正式.jpg')}" loading="lazy"><div class="name">${has?c[1]:"???"}</div><div class="meta">${c[0]}/296 · ${c[4]}</div>${(c[2]==="SSR"||c[2]==="UR"||c[2]==="SR")?`<span class="badge">${c[2]}</span>`:""}`;
  d.onclick=()=>{
    const modalImg=document.getElementById("modalImg");
    if(has){ modalImg.src=c[3]; }
    else{ modalImg.src="卡背-百变萌友-正式.png"; }
    document.getElementById("modalName").textContent=has?c[1]:"???";
    document.getElementById("modalMeta").textContent=`${c[0]}/296 · ${c[4]} · ${c[2]}`;
    const st=document.getElementById("modalStatus");
    st.textContent=has?"已收集":"未收集，去开包！";
    st.className="m-status "+(has?"yes":"no");
    document.getElementById("modal").classList.add("show");
  };
  return d;
}
function render(){
  const list=getFiltered();
  const container=document.getElementById("container"); container.innerHTML="";
  const grouped=document.getElementById("groupBy").checked;
  document.getElementById("shown").textContent=list.length;
  document.getElementById("collected").textContent=collected.size;
  document.getElementById("overallFill").style.width=(collected.size/293*100).toFixed(1)+"%";
  if(!grouped){
    const wrap=document.createElement("div"); wrap.className="series-group";
    const grid=document.createElement("div"); grid.className="grid";
    list.forEach(c=>grid.appendChild(cardEl(c)));
    wrap.appendChild(grid); container.appendChild(wrap);
    return;
  }
  seriesOrder.forEach(s=>{
    const inSeries=list.filter(c=>c[4]===s);
    if(inSeries.length===0) return;
    const total=CARDS.filter(c=>c[4]===s).length;
    const have=CARDS.filter(c=>c[4]===s&&collected.has(c[0]+"-"+c[1])).length;
    const pct=total?Math.round(have/total*100):0;
    const wrap=document.createElement("div"); wrap.className="series-group";
    wrap.innerHTML=`<div class="series-head"><h2>${s}</h2><div class="track"><div class="fill" style="width:${pct}%"></div></div><span class="pct">${have}/${total} · ${pct}%</span></div>`;
    const grid=document.createElement("div"); grid.className="grid";
    inSeries.forEach(c=>grid.appendChild(cardEl(c)));
    wrap.appendChild(grid); container.appendChild(wrap);
  });
}
["search","rarity","series","have","sort","groupBy"].forEach(id=>document.getElementById(id).addEventListener("input",render));
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")e.target.classList.remove("show");};
render();
// 图鉴详情 3D 倾斜
const modalImg=document.getElementById("modalImg");
const modalBox=document.querySelector(".modal .box");
if(modalBox && modalImg){
  modalBox.addEventListener("pointermove",e=>{
    const r=modalImg.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    modalImg.style.transform=`rotateY(${x*16}deg) rotateX(${-y*16}deg) scale(1.02)`;
  });
  modalBox.addEventListener("pointerleave",()=>{ modalImg.style.transform=""; });
}
</script>
