/* ---------- 战报分享图 ----------
   canvas 竖版 1080×1350: 深青底 + 暖金框, 与游戏结算同基调。
   数据口径: 普通对局用 G.result(结算快照), 残局/每日用 finishChallenge 写入的 G.reportSnap;
   联机结算不走本地结算面板, 天然不在此列(无完整本地数据口径)。
   头像一律用现有 assets(玩家=猴先生头像, 与牌桌「你」的头像一致), 不用 emoji。
   导出: 优先 navigator.share 带文件分享, 不支持或失败则下载 PNG。 */
const _repAvCache = {};
function loadAvatarImg(src){
  return new Promise(res=>{
    if(_repAvCache[src]) return res(_repAvCache[src]);
    let done = false;
    const fin = v => { if(done) return; done = true; if(v) _repAvCache[src] = v; res(v); };
    let im;
    try{ im = new Image(); }catch(e){ return fin(null); }
    im.onload = ()=>fin(im);
    im.onerror = ()=>fin(null);
    try{ im.src = src; }catch(e){ fin(null); }
    setTimeout(()=>fin(null), 2500);
  });
}
function drawAvatarCircle(ctx, im, x, y, r, ringCol){
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.closePath(); ctx.clip();
  if(im && im.width && im.height){
    const s = Math.max(2*r/im.width, 2*r/im.height);
    const w = im.width*s, h = im.height*s;
    ctx.drawImage(im, x-w/2, y-h/2, w, h);
  } else if(im){
    ctx.drawImage(im, x-r, y-r, 2*r, 2*r);
  } else {
    ctx.fillStyle = '#20443e'; ctx.fillRect(x-r, y-r, 2*r, 2*r);
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.strokeStyle = ringCol || '#c9a24d'; ctx.lineWidth = 5; ctx.stroke();
}
function drawReport(ctx, data, avs, winnerSeat){
  const W = 1080, H = 1350;
  const F = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#1a4a43'); grd.addColorStop(1, '#0a2723');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  const rg = ctx.createRadialGradient(540, 430, 60, 540, 430, 560);
  rg.addColorStop(0, 'rgba(231,200,119,.20)'); rg.addColorStop(1, 'rgba(231,200,119,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(201,162,77,.9)'; ctx.lineWidth = 3; ctx.strokeRect(28, 28, W-56, H-56);
  ctx.strokeStyle = 'rgba(201,162,77,.35)'; ctx.lineWidth = 1; ctx.strokeRect(42, 42, W-84, H-84);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#e7c877'; ctx.font = '700 96px ' + F;
  ctx.fillText('萌友斗地主', 540, 150);
  ctx.fillStyle = '#b7c9bd'; ctx.font = '30px ' + F;
  ctx.fillText('M Y S K M E · ' + (data.bgName || '茶肆夜话') + ' 桌', 540, 208);   /* v2.1: 副标题跟随当前桌布 */
  ctx.fillStyle = '#f7efdc'; ctx.font = '34px ' + F;
  ctx.fillText(data.modeName + ' · ' + shanghaiToday(), 540, 262);
  /* v2.1: 全员战报带茶号行 */
  if(data.numNo){
    ctx.fillStyle = '#e7c877'; ctx.font = '700 36px ' + F;
    ctx.fillText('茶号 NO.' + data.numNo + ' · ' + data.numTierName + '档', 540, 308);
  }
  ctx.fillStyle = data.win ? '#e7c877' : '#c8cfc9'; ctx.font = '900 160px ' + F;
  ctx.fillText(data.title, 540, 428);
  ctx.fillStyle = '#cfe0d2'; ctx.font = '36px ' + F;
  ctx.fillText(data.sub, 540, 522);
  /* 三方头像: 左 = 2 号座, 中 = 玩家, 右 = 1 号座, 与牌桌方位一致 */
  const seats = [{seat:2, x:250}, {seat:0, x:540}, {seat:1, x:830}];
  for(const s of seats){
    drawAvatarCircle(ctx, avs[s.seat], s.x, 668, 96, s.seat===0 ? frameRingColor() : null);
    if(s.seat===0 && data.frameImg){ ctx.drawImage(data.frameImg, s.x-114, 668-114, 228, 228); }   /* v2.1: 玩家头像叠所装框环 */
    if(s.seat === winnerSeat){
      ctx.beginPath(); ctx.arc(s.x+68, 600, 30, 0, Math.PI*2);
      ctx.fillStyle = '#c9a24d'; ctx.fill();
      ctx.fillStyle = '#2a1f08'; ctx.font = '700 30px ' + F;

function shareReportImage(canvas){
  const name = '萌友斗地主-战报-' + shanghaiToday().replace(/-/g, '') + '.png';
  const setTip = t => { const el = $('reportTip'); if(el) el.textContent = t; };
  const download = blob => {
    try{
      if(typeof URL === 'undefined' || typeof URL.createObjectURL !== 'function') return false;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      if(document.body && document.body.appendChild) document.body.appendChild(a);
      if(a.click) a.click();
      if(a.remove) a.remove();
      setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch(e){} }, 4000);
      return true;
    }catch(e){ return false; }
  };
  try{
    if(canvas.toBlob){
      canvas.toBlob(async blob => {
        if(!blob){ setTip('战报图生成失败，请再试一次。'); return; }
        let shared = false;
        try{
          if(typeof navigator !== 'undefined' && typeof navigator.share === 'function' && typeof navigator.canShare === 'function' && typeof File !== 'undefined'){
            const f = new File([blob], name, { type:'image/png' });
            if(navigator.canShare({ files:[f] })){ await navigator.share({ files:[f] }); shared = true; }
          }
        }catch(e){ shared = false; }
        if(shared){ setTip('战报图已唤起分享。'); creditShareTreat(); }   /* v2.1: 分享回馈茶点 */
        else if(download(blob)){ setTip('战报图已生成并下载（PNG）。'); creditShareTreat(); }
        else setTip('战报图已生成（当前环境无法自动下载）。');
      }, 'image/png');
      return;
    }
    if(canvas.toDataURL){
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = name;
      if(document.body && document.body.appendChild) document.body.appendChild(a);
      if(a.click) a.click();
      setTip('战报图已生成并下载（PNG）。');
      creditShareTreat();
      return;
    }
    setTip('当前环境不支持导出图片。');
  }catch(e){ setTip('战报图生成失败，请再试一次。'); }
}

const _doPlay = doPlay, _doPass = doPass;
doPlay = function(seat, cards, info){
  const inf = info || analyzeCards(cards);
  recordStep(seat, 'play', cards, inf); lastShown[seat]={cards:cards.slice()};
  /* v1.1: 出牌音效与特效(表现层, 不影响引擎与记录) */
  if(inf && isBombLike(inf)){
    const c = seatZoneCenter(seat);
    if(inf.type === 'rocket'){ Snd.rocketLaunch(); setTimeout(()=>Fx.burst(c.x, c.y, true), 380); }
    else { Snd.play('bomb'); Fx.burst(c.x, c.y, false); }
    for(const s of [0,1,2]) if(s !== seat) setTimeout(()=>bounceAvatar(s), 60);
  } else if(inf && (inf.type === 'straight' || inf.type === 'pairs' || inf.type === 'plane')){
    /* v1.3.3: 顺子/连对/飞机专属音型 + 流光(明显区别于普通出牌, 低于炸弹层级) */
    Snd.combo(inf.type);

    if(inf.type === 'plane') fxText('飞 机');
  } else {
    Snd.play('place', .9, 0.96 + Math.random() * 0.08);

  saveResume();   /* v1.5: 每手落定后写断局快照(已结算/不纳入模式时内部自动跳过) */
};

/* ---------- v1.5: 单机断局恢复(本版新增存档键 myskme_ddz_resume, 总数 14→15, 旧键零改动) ----------
   信封 {v:1, app:'1.5.0', ts, data}; 写入: 叫分前 dealt 轻量态 / 定地主后 / 每手落定后 / 切后台补写;
   清理: 正常结算 / 用户放弃 / 校验失败 / 超 24 小时。纳入: 经典/癞子/不洗牌/残局/每日一局;
   不纳入: 好友分享挑战(一次性语义)/教学局/联机(服务端权威)。恢复走询问横幅, 不自动进局。 */
const RESUME_KEY = 'myskme_ddz_resume';
const RESUME_MODES = ['classic', 'laizi', 'noshuffle', 'challenge'];
let resumeOffer = null;   // 本次打开时校验通过的快照 data(仅横幅文案用; 恢复时重新读键校验)

function saveResume(){
  try{
    if(!G || G.over || G.online || G.tutorial || G.linkChallenge) return;
    if(!RESUME_MODES.includes(G.mode)) return;
    let data = null;
    if(G.mode !== 'challenge' && G.phase === 'bidding'){
      /* 叫分阶段局部状态不可恢复: 只存牌面, 恢复时同副牌重新叫分 */
      data = { phase:'dealt', mode:G.mode, laiziVal:G.laiziVal || 0,
        hands:G.hands, dipai:G.dipai, aiChar:G.aiChar };
    } else if(G.phase === 'playing'){
      data = { phase:'playing', mode:G.mode, laiziVal:G.laiziVal || 0,
        hands:G.hands, dipai:G.dipai, aiChar:G.aiChar,
        landlord:G.landlord, base:G.base, mult:G.mult, bombs:G.bombs, ownBombs:G.ownBombs || 0,
        turn:G.turn, lastPlay:G.lastPlay, lastOwner:G.lastOwner, passStreak:G.passStreak,
        selfPass:G.selfPass, playsCount:G.playsCount, playedCount:G.playedCount, playsBySide:G.playsBySide };
      if(G.mode === 'challenge'){
        data.challengeIdx = G.challengeIdx; data.daily = !!G.daily;
        data.dailyDate = shanghaiToday();
        data.trackSeed = G.trackSeed; data.trackBase = G.trackBase;
      } else if(G.record && G.record.steps && G.record.steps.length <= 120){
        data.record = G.record;   /* 复盘记录在阈值内一并存(超 120 步剥落, 其余照存), 恢复局仍可复盘 */
      }
    } else return;
    localStorage.setItem(RESUME_KEY, JSON.stringify({ v:1, app:'1.5.0', ts:Date.now(), data }));
  }catch(e){ /* 无痕/配额等写入失败静默, 不影响对局 */ }
}
function clearResume(){ try{ localStorage.removeItem(RESUME_KEY); }catch(e){} }

function resumeCardOk(c){ return !!c && Number.isInteger(c.v) && c.v >= 3 && c.v <= 17 && typeof c.s === 'string'; }
function resumeCounts(cardLists){
  const cnt = {};
  for(const cards of cardLists) for(const c of cards) cnt[c.v] = (cnt[c.v] || 0) + 1;
  return cnt;
}
/* 读端结构不变量校验: 任一不过即判损坏(删键静默回退, 绝不挡首页) */
function resumeDataValid(d){
  if(!d || typeof d !== 'object' || !RESUME_MODES.includes(d.mode)) return false;
  if(!Array.isArray(d.hands) || d.hands.length !== 3 || !d.hands.every(h => Array.isArray(h) && h.every(resumeCardOk))) return false;
  if(!Array.isArray(d.aiChar) || d.aiChar.length !== 3 || !CHARS[d.aiChar[1]] || !CHARS[d.aiChar[2]]) return false;
  const cnt = resumeCounts(d.hands);
  const played = (d.playedCount && typeof d.playedCount === 'object') ? d.playedCount : {};
  if(d.mode === 'challenge'){
    if(d.phase !== 'playing') return false;
    if(!Number.isInteger(d.challengeIdx) || d.challengeIdx < 0 || d.challengeIdx >= LEVELS.length) return false;
    const lv = LEVELS[d.challengeIdx];
    if(d.landlord !== lv.landlord) return false;
    if(d.daily && d.dailyDate !== shanghaiToday()) return false;   /* 每日局跨日作废 */
    if(!d.trackSeed || !d.trackBase) return false;
    const init = {};
    for(const h of lv.hands) for(const v of h) init[v] = (init[v] || 0) + 1;
    for(let v = 3; v <= 17; v++){
      const cap = v >= 16 ? 1 : 4, iv = init[v] || 0;
      if(d.trackBase[v] !== iv || d.trackSeed[v] !== cap - iv) return false;
      if((cnt[v] || 0) > iv) return false;
      if((played[v] || 0) !== d.trackSeed[v] + (iv - (cnt[v] || 0))) return false;
    }
  } else {
    if(!Array.isArray(d.dipai) || d.dipai.length !== 3 || !d.dipai.every(resumeCardOk)) return false;
    const dipCnt = resumeCounts([d.dipai]);
    if(d.phase === 'dealt'){
      if(d.landlord !== undefined && d.landlord !== -1) return false;
      let total = 0;
      for(let v = 3; v <= 17; v++){
        const cap = v >= 16 ? 1 : 4;
        if((cnt[v] || 0) + (dipCnt[v] || 0) > cap) return false;
        total += cnt[v] || 0;
      }
      if(total !== 51) return false;
    } else if(d.phase === 'playing'){
      if(![0,1,2].includes(d.landlord)) return false;
      if(!Number.isInteger(d.base) || d.base < 0 || d.base > 3) return false;
      if(!(typeof d.mult === 'number' && d.mult >= 1 && d.mult <= 4096)) return false;
      for(let v = 3; v <= 17; v++){
        const cap = v >= 16 ? 1 : 4;
        if((cnt[v] || 0) + (played[v] || 0) !== cap) return false;   /* 手牌+已出 恒等于一副牌 */
      }
      const lc = resumeCounts([d.hands[d.landlord]]);
      for(let v = 3; v <= 17; v++) if((dipCnt[v] || 0) > (lc[v] || 0)) return false;   /* 底牌已并入地主手牌 */
    } else return false;
  }
  if(d.phase === 'playing'){
    if(![0,1,2].includes(d.turn)) return false;
    if(d.lastPlay !== null && d.lastPlay !== undefined){
      const lp = d.lastPlay;
      if(!lp || !Array.isArray(lp.cards) || !lp.cards.length || !lp.cards.every(resumeCardOk)) return false;
      if(!lp.info || typeof lp.info.type !== 'string') return false;
      if(![0,1,2].includes(d.lastOwner)) return false;
      setLaizi(d.laiziVal || 0);
      const inf = analyzeCards(lp.cards);   /* 癞子局先 setLaizi 再复核牌型可解析 */
      setLaizi(0);
      if(!inf) return false;
    }
  }
  return true;
}
function loadResumeOffer(){
  try{
    const raw = localStorage.getItem(RESUME_KEY);
    if(!raw) return null;
    const env = JSON.parse(raw);
    const bad = !env || env.v !== 1 || typeof env.ts !== 'number'
      || (typeof env.app === 'string' && parseInt(env.app, 10) > 1)
      || (Date.now() - env.ts > 24 * 3600 * 1000)
      || !resumeDataValid(env.data);
    if(bad){ clearResume(); return null; }
    return env.data;
  }catch(e){ clearResume(); return null; }
}

    aiChar: d.aiChar,
    landlord: d.phase === 'dealt' ? -1 : d.landlord,

    playedCount: d.playedCount || {},

  } else if(d.phase === 'dealt'){

    for(let v = 3; v <= 17; v++) G.playedCount[v] = 0;
  }
  if(d.record) G.record = d.record;
  $('avR').src = CHARS[d.aiChar[1]].av; $('nmR').textContent = CHARS[d.aiChar[1]].name;
  $('avL').src = CHARS[d.aiChar[2]].av; $('nmL').textContent = CHARS[d.aiChar[2]].name;
  updateStoryButtonVisibility();
  $('uiBase').textContent = (d.mode === 'challenge' || d.phase === 'dealt') ? '—' : d.base + ' 分';
  $('uiMult').textContent = '×' + G.mult;
  const noteEl = $('modeNote');
  if(d.mode === 'challenge'){
    const lv = LEVELS[d.challengeIdx];
    $('uiMode').textContent = '残局 · 第 ' + (d.challengeIdx + 1) + ' 关';
    noteEl.textContent = '第 ' + (d.challengeIdx + 1) + ' 关《' + lv.name + '》：' + lv.goal + ' ' + lv.best + ' 手内三星，' + (lv.best + 1) + ' 手内两星。';
    if(d.daily){
      noteEl.textContent = '每日一局 · 第 ' + (d.challengeIdx + 1) + ' 关《' + lv.name + '》：全桌同题。记入连续记录，不影响残局星数。';
      const banner = $('challengeBanner');
      banner.textContent = '每日一局 · ' + shanghaiToday() + ' · 连续完成 ' + (dailyData().streak || 0) + ' 天';
      banner.classList.add('show');
    }
  } else {
    $('uiMode').textContent = d.mode === 'laizi' ? '癞子场 · ' + rankName(d.laiziVal || 0) + ' 癞' : (d.mode === 'noshuffle' ? '不洗牌场' : '经典场');
    noteEl.textContent = d.mode === 'laizi'
      ? '癞子点 ' + rankName(d.laiziVal || 0) + '：金框带「癞」，可当任意普通牌，不能当大小王。软炸小于硬炸，王炸最大。'
      : d.mode === 'noshuffle' ? '不洗牌场：成组发牌，牌型更易成型。'
      : '经典场：标准规则，随机洗牌发牌。';
  }
  noteEl.classList.add('show');
  lastShown[0] = lastShown[1] = lastShown[2] = null;
  if(G.lastPlay && G.lastOwner >= 0) lastShown[G.lastOwner] = { cards: G.lastPlay.cards };
  $('actionBar').innerHTML = '';
  hintIdx = 0;
  renderAll();
  if(d.phase === 'dealt') startBidding();
  else runTurn();
}

window.addEventListener('load', ()=>{
  elderContext='menu'; applyElderMode(); renderStats(); preloadCards();
  if(pendingChallenge) startLevel(pendingChallenge.idx);
  else {
    resumeOffer = loadResumeOffer();   /* v1.5: 断局恢复询问(校验不过已在读端静默删键) */
    showModeSelect();
    // v0.9: 带 ?room=房码 打开(邀请链接) -> 直达联机加入面板并预填房码
    const rp = new URLSearchParams(location.search).get('room');
    if(rp) showOnlinePanel(rp.trim().toUpperCase());
    else injectResumeBanner();
  }
});

/* v1.4: Service Worker 注册(离线可玩). 失败静默降级, 不影响正常游玩。
   策略在 sw.js: HTML 网络优先 + 静态资产缓存优先; 发版须同步 bump sw.js 的 CACHE 版本号。 */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
  });
}
</script>
</body>
</html>
