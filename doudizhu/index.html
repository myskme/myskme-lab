<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>萌友斗地主 · 原型 v0.9</title>
<style>
  :root{
    --teal:#123a36; --teal-deep:#0b2622; --teal-panel:rgba(10,32,29,.82);
    --gold:#c9a24d; --gold-l:#e7c877; --cream:#f7efdc; --paper:#f3e9d2;
    --red:#b03a2e; --ink:#22312c;
    --cw:76px;          /* 手牌宽 */
    --pw:52px;          /* 已出牌宽 */
    --dw:44px;          /* 底牌宽 */
    --radius:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    color:var(--cream); overflow:hidden; background:var(--teal-deep);
    user-select:none; -webkit-user-select:none;
  }
  #bg{position:fixed; inset:0; background:url('assets/桌布-茶肆夜话.webp') center/cover no-repeat; z-index:0;}
  #bg::after{content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 42%, rgba(6,20,17,.38), rgba(5,17,14,.78) 78%);}

  #app{position:relative; z-index:1; height:100dvh; display:flex; flex-direction:column;}

  /* ---------- 顶栏 ---------- */
  #topbar{
    display:flex; align-items:center; gap:10px; padding:8px 12px;
    background:linear-gradient(180deg, rgba(7,24,21,.92), rgba(7,24,21,.72));
    border-bottom:1px solid rgba(201,162,77,.45); flex-wrap:wrap;
  }
  #topbar .title{font-size:17px; letter-spacing:2px; color:var(--gold-l); font-weight:700; white-space:nowrap;}
  #topbar .title small{font-size:11px; color:#b7c9bd; letter-spacing:1px; font-weight:400;}
  .chip{
    background:rgba(18,58,54,.85); border:1px solid rgba(201,162,77,.55); color:var(--cream);
    border-radius:999px; padding:3px 11px; font-size:12.5px; white-space:nowrap;
  }
  .chip b{color:var(--gold-l); font-size:14px;}
  #topbar .spacer{flex:1;}
  button{
    font-family:inherit; cursor:pointer; border:1px solid var(--gold);
    background:linear-gradient(180deg,#1d554d,#123a36); color:var(--cream);
    border-radius:8px; padding:7px 16px; font-size:14.5px; letter-spacing:1px;
    transition:transform .08s, filter .15s, opacity .15s;
  }
  button:hover{filter:brightness(1.18);}
  button:active{transform:scale(.96);}
  button:disabled{opacity:.38; cursor:not-allowed; filter:grayscale(.4);}
  button.primary{background:linear-gradient(180deg,#d9a94f,#a87c2c); color:#2a1f08; font-weight:700; border-color:#e7c877;}
  button.ghost{background:rgba(10,32,29,.6);}
  button.danger{background:linear-gradient(180deg,#8f352a,#6d271e); border-color:#c96a5a;}

  /* ---------- 记牌器 ---------- */
  #counterBar{
    display:none; gap:4px; align-items:center; padding:5px 12px; flex-wrap:wrap;
    background:rgba(7,24,21,.78); border-bottom:1px solid rgba(201,162,77,.3); font-size:12px;
  }
  #counterBar.open{display:flex;}
  #counterBar .lab{color:var(--gold-l); margin-right:2px; letter-spacing:1px;}
  #counterBar .cell{
    min-width:30px; text-align:center; padding:2px 3px; border-radius:5px;
    background:rgba(247,239,220,.1); border:1px solid rgba(247,239,220,.14);
  }
  #counterBar .cell b{display:block; font-size:13.5px; color:#fff;}
  #counterBar .cell span{font-size:10px; color:#a9bcb0;}
  #counterBar .cell.out{opacity:.32;}
  #counterBar .cell.red b{color:#ff9a8a;}

  /* ---------- 桌面 ---------- */
  #table{flex:1; position:relative; min-height:0;}
  .seat{position:absolute; display:flex; flex-direction:column; align-items:center; gap:5px; width:200px;}
  .seat .who{display:flex; align-items:center; gap:8px; background:var(--teal-panel);
    border:1px solid rgba(201,162,77,.5); border-radius:999px; padding:4px 12px 4px 4px;}
  .avatar{
    width:46px; height:46px; border-radius:50%; object-fit:cover; display:block;
    border:2px solid rgba(201,162,77,.75); background:#20443e;
  }
  .seat.turn .avatar{border-color:var(--gold-l); box-shadow:0 0 0 3px rgba(231,200,119,.35), 0 0 18px rgba(231,200,119,.55);}
  .who .nm{font-size:14.5px; font-weight:600; line-height:1.15;}
  .who .role{font-size:11px; color:#b7c9bd;}
  .role.landlord{color:var(--gold-l); font-weight:700;}
  .backfan{position:relative; height:44px; width:86px;}
  .backfan img{position:absolute; top:0; width:32px; height:45px; border-radius:4px; box-shadow:0 2px 5px rgba(0,0,0,.45);}
  .countbadge{
    position:absolute; right:-4px; bottom:-4px; background:var(--red); color:#fff; font-size:11.5px;
    min-width:20px; height:20px; line-height:20px; text-align:center; border-radius:10px; padding:0 5px;
    border:1.5px solid #f3d9d2; font-weight:700; z-index:3;
  }
  .countbadge.low{background:#d9822b;}
  .bubble{
    position:absolute; top:-6px; max-width:190px; background:var(--cream); color:var(--ink);
    font-size:13px; line-height:1.35; padding:7px 11px; border-radius:10px; z-index:6;
    box-shadow:0 4px 14px rgba(0,0,0,.4); opacity:0; transform:translateY(4px); transition:opacity .25s, transform .25s;
    pointer-events:none;
  }
  .bubble.show{opacity:1; transform:translateY(0);}
  .bubble::after{content:''; position:absolute; bottom:-6px; left:26px; border:7px solid transparent; border-top-color:var(--cream); border-bottom:0;}
  #seatL{left:2.5%; top:5%;}
  #seatR{right:2.5%; top:5%;}
  #seatR .bubble{right:0;}
  #seatL .bubble{left:0;}

  .playzone{position:absolute; display:flex; gap:3px; justify-content:center; align-items:flex-start; min-height:74px; z-index:4;}
  #zoneL{left:4%; top:31%; }
  #zoneR{right:4%; top:31%;}
  #zoneP{left:50%; transform:translateX(-50%); bottom:24.5%; }
  .playzone img.pcard{width:var(--pw); height:calc(var(--pw)*1.4); border-radius:6px; box-shadow:0 3px 8px rgba(0,0,0,.5); animation:playIn .28s ease both;}
  .playzone .passchip{
    background:rgba(11,32,28,.88); border:1.5px solid rgba(201,162,77,.7); color:var(--gold-l);
    padding:5px 16px; border-radius:999px; font-size:15px; letter-spacing:3px; animation:playIn .2s ease both;
  }
  @keyframes playIn{from{opacity:0; transform:translateY(14px) scale(.92);} to{opacity:1; transform:none;}}
  @keyframes dealIn{from{opacity:0; transform:translateY(-16px);} to{opacity:1; transform:none;}}

  /* ---------- 底牌 ---------- */
  #dipai{
    position:absolute; left:50%; top:9px; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:3px; z-index:3;
  }
  #dipai .lab{font-size:11.5px; color:var(--gold-l); letter-spacing:3px; text-shadow:0 1px 4px #000;}
  #dipai .cards{display:flex; gap:5px;}
  #dipai img{width:var(--dw); height:calc(var(--dw)*1.4); border-radius:5px; box-shadow:0 3px 8px rgba(0,0,0,.55); border:1px solid rgba(201,162,77,.55);}

  #centerMsg{
    position:absolute; left:50%; top:34%; transform:translate(-50%,-50%); z-index:5;
    font-size:21px; letter-spacing:3px; color:var(--gold-l); text-shadow:0 2px 10px rgba(0,0,0,.8);
    text-align:center; pointer-events:none; font-weight:700; white-space:nowrap;
  }
  #centerMsg .sub{display:block; font-size:13.5px; color:#d8e4da; letter-spacing:1px; font-weight:400; margin-top:5px;}
  .fx-pop{
    position:absolute; left:50%; top:30%; transform:translate(-50%,-50%); z-index:8; pointer-events:none;
    font-size:52px; font-weight:900; letter-spacing:10px; color:var(--gold-l);
    text-shadow:0 0 22px rgba(231,200,119,.85), 0 4px 6px rgba(0,0,0,.7); opacity:0;
  }
  .fx-pop.boom{animation:fxBoom 1.15s ease both;}
  @keyframes fxBoom{0%{opacity:0; transform:translate(-50%,-50%) scale(.4);}18%{opacity:1; transform:translate(-50%,-50%) scale(1.18);}
    32%{transform:translate(-50%,-50%) scale(1);} 78%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-58%) scale(1.04);}}

  /* ---------- 玩家区 ---------- */
  #playerArea{
    position:relative; padding:2px 10px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg, rgba(7,24,21,.94) 62%, rgba(7,24,21,0));
  }
  #actionBar{display:flex; justify-content:center; align-items:center; gap:10px; min-height:44px; margin-bottom:2px; flex-wrap:wrap;}
  #actionBar .turntip{font-size:14px; color:var(--gold-l); letter-spacing:1px;}
  #meRow{display:flex; align-items:flex-end; gap:10px;}
  #meInfo{display:flex; flex-direction:column; align-items:center; gap:3px; flex:none; padding-bottom:4px;}
  #meInfo .avatar{width:52px; height:52px;}
  #meInfo.turn .avatar{border-color:var(--gold-l); box-shadow:0 0 0 3px rgba(231,200,119,.35), 0 0 18px rgba(231,200,119,.55);}
  #meInfo .nm{font-size:13.5px; font-weight:600;}
  #meInfo .role{font-size:11px; color:#b7c9bd;}
  #hand{
    flex:1; display:flex; align-items:flex-end; justify-content:center;
    min-height:calc(var(--cw)*1.4 + 20px); padding-top:20px; overflow:hidden;
  }
  #hand img.hcard{
    width:var(--cw); height:calc(var(--cw)*1.4); border-radius:8px; flex:none;
    box-shadow:0 4px 10px rgba(0,0,0,.5); cursor:pointer; background:#fff;
    transition:transform .13s ease, box-shadow .13s ease; animation:dealIn .3s ease both;
  }
  #hand img.hcard.sel{transform:translateY(-17px); box-shadow:0 0 0 2.5px var(--gold-l), 0 10px 18px rgba(0,0,0,.55);}
  #hand img.hcard:active{filter:brightness(1.06);}

  /* ---------- 结算弹层 ---------- */
  #overlay{
    position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    background:rgba(4,14,12,.66); backdrop-filter:blur(2px);
  }
  #overlay.show{display:flex;}
  .panel{
    width:min(92vw,430px); background:linear-gradient(180deg,#17453f,#0d2c28);
    border:1.5px solid var(--gold); border-radius:16px; padding:24px 26px 20px; text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.6); animation:playIn .3s ease both;
  }
  .panel h2{font-size:27px; letter-spacing:6px; color:var(--gold-l); margin-bottom:4px;}
  .panel h2.lose{color:#c8cfc9;}
  .panel .who-win{font-size:14px; color:#cfe0d2; margin-bottom:14px;}
  .panel table{width:100%; border-collapse:collapse; font-size:14.5px; margin-bottom:16px;}
  .panel td{padding:5px 4px; border-bottom:1px dashed rgba(201,162,77,.3); text-align:left; color:#e9e2cd;}
  .panel td:last-child{text-align:right; color:var(--gold-l); font-weight:700;}
  .panel .stats{font-size:12.5px; color:#a9bcb0; margin-top:12px;}

  /* ---------- v0.2: 模式说明 / 癞子标识 / 场次选择 ---------- */
  #modeNote{display:none; padding:4px 12px; font-size:11.5px; line-height:1.5; color:#cdbd93;
    background:rgba(7,24,21,.66); border-bottom:1px solid rgba(201,162,77,.22); letter-spacing:.5px;}
  #modeNote.show{display:block;}
  #counterBar .cell.wildcell{border-color:var(--gold-l); background:rgba(201,162,77,.25);}
  #counterBar .cell.wildcell span{color:var(--gold-l);}
  .hwrap{position:relative; flex:none;}
  #hand img.hcard.wild{box-shadow:0 0 0 3px var(--gold-l), 0 4px 14px rgba(231,200,119,.6);}
  .wildtag{
    position:absolute; top:-9px; left:-3px; z-index:40; width:21px; height:21px; line-height:21px;
    text-align:center; border-radius:50%; font-size:11.5px; font-weight:800; color:#2a1f08;
    background:linear-gradient(180deg,#f0d488,#c39a35); border:1.5px solid #fff3d0;
    box-shadow:0 2px 6px rgba(0,0,0,.55); pointer-events:none;
  }
  .playzone img.pcard.wild{box-shadow:0 0 0 2.5px var(--gold-l), 0 3px 8px rgba(0,0,0,.5);}
  #dipai img.wild{box-shadow:0 0 0 2.5px var(--gold-l), 0 3px 8px rgba(0,0,0,.55);}
  .panel .modebtn{display:block; width:100%; text-align:left; margin:9px 0; padding:12px 14px; border-radius:10px;}
  .panel .modebtn b{display:block; font-size:16.5px; letter-spacing:1px; color:var(--gold-l);}
  .panel .modebtn span{display:block; font-size:12px; line-height:1.55; color:#cfe0d2; margin-top:3px; letter-spacing:0;}

  /* ---------- v0.3: 残局闯关 ---------- */
  .panel .levelgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin:10px 0 14px;}
  .levelcell{background:rgba(18,58,54,.85); border:1px solid rgba(201,162,77,.55); border-radius:10px;
    padding:9px 3px 7px; text-align:center; color:var(--cream); font-family:inherit; letter-spacing:0;}
  button.levelcell{cursor:pointer; width:100%;}
  button.levelcell:hover{filter:brightness(1.22);}
  .levelcell .lvno{font-size:10.5px; color:#a9bcb0; letter-spacing:1px;}
  .levelcell .lvname{font-size:13.5px; font-weight:700; color:var(--gold-l); margin:2px 0; letter-spacing:1px;}
  .levelcell .lvstars{font-size:11.5px; color:var(--gold-l); letter-spacing:1px;}
  .levelcell.locked{opacity:.45;}
  .levelcell .lvstars.dim{color:#8a9a8e; font-size:10.5px;}
  .lvstars.big{font-size:30px; color:var(--gold-l); letter-spacing:6px; margin:2px 0 6px; text-align:center;}

  /* ---------- v0.5: 故事图鉴 / 残局分享挑战 ---------- */
  #challengeBanner{display:none; padding:8px 12px; text-align:center; font-size:14.5px; font-weight:700; letter-spacing:.5px;
    color:#2a1f08; background:linear-gradient(90deg,#d9a94f,#f0d488,#d9a94f); border-bottom:1px solid rgba(255,243,208,.8);}
  #challengeBanner.show{display:block;}
  .panel.story-panel{width:min(94vw,760px); max-height:92dvh; overflow-y:auto; text-align:left;}
  .panel.story-panel h2{text-align:center;}
  .panel.story-panel .who-win{text-align:center;}
  .story-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0;}
  .story-char{display:flex; flex-direction:column; align-items:center; gap:5px; padding:13px 8px 11px; text-align:center;}
  .story-char .avatar{width:62px; height:62px;}
  .story-char b{font-size:16.5px; color:var(--gold-l); letter-spacing:1px;}
  .story-char span{font-size:12px; line-height:1.45; color:#cfe0d2;}
  .story-head{display:flex; align-items:center; gap:14px; margin:8px 0 4px;}
  .story-head .avatar{width:76px; height:76px;}
  .story-head h3{font-size:24px; color:var(--gold-l); letter-spacing:2px; margin-bottom:4px;}
  .story-head p{font-size:13px; line-height:1.55; color:#cfe0d2;}
  .story-cards{display:flex; gap:9px; justify-content:center; margin:12px 0 4px; flex-wrap:wrap;}
  .story-cards img{width:96px; height:134px; object-fit:cover; border-radius:8px; border:1px solid rgba(201,162,77,.6); box-shadow:0 5px 14px rgba(0,0,0,.45); background:#fff;}
  .story-item{border-top:1px dashed rgba(201,162,77,.35); padding:13px 2px 11px;}
  .story-item h4{font-size:15.5px; color:var(--gold-l); letter-spacing:1px; margin-bottom:6px;}
  .story-item p{font-size:14.5px; line-height:1.75; color:#f1ead6;}
  .story-lock{display:flex; gap:13px; align-items:center; background:rgba(247,239,220,.06); border:1px dashed rgba(201,162,77,.4); border-radius:10px; padding:11px 13px;}
  .story-lock .q{font-size:34px; font-weight:900; color:#8a9a8e; line-height:1; flex:none;}
  .story-lock b{display:block; font-size:14.5px; color:#d8e4da; margin-bottom:3px;}
  .story-lock span{font-size:12.5px; line-height:1.5; color:#a9bcb0;}
  .story-actions{display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin-top:14px;}
  .share-result{margin-top:11px; font-size:13.5px; line-height:1.55; color:var(--gold-l);}
  .share-link{margin-top:7px; padding:9px 11px; border:1px solid rgba(201,162,77,.5); border-radius:8px; background:rgba(7,24,21,.55);
    color:#f7efdc; font-size:12px; line-height:1.5; word-break:break-all; user-select:text; -webkit-user-select:text;}
  .challenge-compare{font-size:14.5px; line-height:1.65; color:#f1ead6; background:rgba(247,239,220,.07);
    border:1px solid rgba(201,162,77,.4); border-radius:10px; padding:10px 13px; margin:0 0 14px;}
  @media (max-width:640px){
    .story-grid{grid-template-columns:repeat(2,1fr);}
    .story-cards img{width:82px; height:115px;}
    .panel.story-panel{padding:20px 17px 16px;}
  }

  /* ---------- v0.4: 长辈模式 ---------- */
  .elder-toggle{
    display:flex; align-items:center; gap:13px; width:100%; margin:12px 0 2px; padding:13px 14px;
    background:rgba(247,239,220,.08); border:1.5px solid rgba(201,162,77,.65); border-radius:12px;
    color:var(--cream); cursor:pointer; text-align:left;
  }
  .elder-toggle input{width:28px; height:28px; flex:none; accent-color:var(--gold);}
  .elder-toggle b{display:block; font-size:16.5px; color:var(--gold-l); letter-spacing:1px;}
  .elder-toggle small{display:block; font-size:12px; line-height:1.5; color:#cfe0d2; margin-top:2px;}
  /* ---------- v0.6: AI 难度切换 ---------- */
  .levelswitch{display:flex; align-items:center; gap:8px; flex-wrap:wrap; width:100%; margin:10px 0 2px; padding:11px 14px;
    background:rgba(247,239,220,.06); border:1.5px solid rgba(201,162,77,.45); border-radius:12px; text-align:left;}
  .levelswitch .lvlab{font-size:15px; color:var(--gold-l); letter-spacing:1px; font-weight:700; margin-right:2px;}
  .levelswitch .levelbtn{padding:6px 18px; font-size:14.5px; border-radius:999px;}
  .levelswitch .levelbtn.on{background:linear-gradient(180deg,#d9a94f,#a87c2c); color:#2a1f08; font-weight:700; border-color:#e7c877;}
  .levelswitch small{flex-basis:100%; font-size:12px; line-height:1.5; color:#cfe0d2;}
  /* ---------- v0.7: 复盘回放 / 教练点评 ---------- */
  .playzone.now img.pcard{box-shadow:0 0 0 3px var(--gold-l), 0 3px 10px rgba(0,0,0,.55);}
  .review-note{flex-basis:100%; text-align:center; font-size:15px; line-height:1.6; color:var(--gold-l); letter-spacing:.5px; padding:2px 6px;}
  .coach-list{margin:2px 0 14px;}
  .coach-note{
    font-size:15px; line-height:1.75; color:#f1ead6; text-align:left;
    background:rgba(247,239,220,.06); border-left:3px solid var(--gold);
    padding:9px 12px; margin:9px 0; border-radius:0 8px 8px 0;
  }
  body.elder .review-note{font-size:20px; line-height:1.55;}
  body.elder .coach-note{font-size:19px; line-height:1.8; padding:12px 14px;}
  .elder-result{font-size:27px; line-height:1.45; color:var(--cream); font-weight:800; margin:8px 0 16px;}
  .elder-result span{font-size:20px; color:var(--gold-l);}
  .elder-detail-btn{display:block; margin:12px auto 0;}
  .elder-detail[hidden]{display:none;}
  .elder-detail{margin-top:12px;}
  html.elder{--cw:104px; --pw:72px; --dw:60px;}
  body.elder #topbar{gap:12px; padding:12px;}
  body.elder #topbar .title{font-size:23px;}
  body.elder #topbar .title small{display:none;}
  body.elder .chip{font-size:17px; padding:7px 14px;}
  body.elder .chip b{font-size:20px;}
  body.elder button{min-height:60px; padding:12px 22px; font-size:19px; border-radius:12px;}
  body.elder .elder-hide{display:none !important;}
  body.elder #counterBar{display:none !important;}
  body.elder #modeNote{display:none !important;}
  body.elder .avatar{width:60px; height:60px;}
  body.elder #meInfo .avatar{width:68px; height:68px;}
  body.elder .who .nm{font-size:18px;}
  body.elder .who .role, body.elder #meInfo .role{font-size:14px;}
  body.elder #meInfo .nm{font-size:17px;}
  body.elder .countbadge{font-size:15px; min-width:27px; height:27px; line-height:27px;}
  body.elder .bubble{max-width:260px; font-size:17px; line-height:1.5; padding:10px 14px;}
  body.elder .playzone img.pcard{animation-duration:.56s;}
  body.elder #hand img.hcard{animation-duration:.6s;}
  body.elder #hand img.hcard.rec{box-shadow:0 0 0 5px var(--gold-l), 0 0 26px rgba(231,200,119,.95), 0 8px 18px rgba(0,0,0,.6);}
  body.elder #hand img.hcard.sel{transform:translateY(-22px);}
  body.elder .wildtag{width:30px; height:30px; line-height:30px; font-size:17px;}
  body.elder #centerMsg{width:min(92vw,760px); font-size:30px; line-height:1.35; letter-spacing:1px; white-space:normal;}
  body.elder #centerMsg .sub{font-size:19px; line-height:1.45;}
  body.elder .fx-pop.boom{animation-duration:2.3s;}

<script>
/* ================= 引擎（纯逻辑，可独立测试） ================= */
// === ENGINE START ===
// 牌值: 3..10 牌面, 11=J 12=Q 13=K 14=A 15=2, 16=小王, 17=大王
function newDeck(){
  const suits=['红桃','黑桃','梅花','方块']; const deck=[];
  for(const s of suits) for(let v=3; v<=15; v++) deck.push({v, s});
  deck.push({v:16,s:'王'},{v:17,s:'王'});
  return deck;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sortCards(cards){ return cards.slice().sort((a,b)=> b.v-a.v || (a.s<b.s?-1:1)); }
function valsOf(cards){ return cards.map(c=>c.v); }
function countMap(vals){ const m={}; for(const v of vals) m[v]=(m[v]||0)+1; return m; }

/* ---------- 癞子(万能牌) ----------
   LAIZI_VAL=0 表示经典场; 否则点数 LAIZI_VAL 的所有牌为万能牌:
   可替代任意普通点数(3..15)参与组合, 不能替代大小王(16/17)。
   炸弹分软/硬: 含替身癞子的四张同点为软炸(info.soft=true), 全自然为硬炸; 硬炸压软炸, 王炸最高。 */
let LAIZI_VAL = 0;
function setLaizi(v){ LAIZI_VAL = v || 0; }
function analyzeCards(cards){
  if(!LAIZI_VAL || !cards.some(c=>c.v===LAIZI_VAL)){
    const info = analyzeVals(valsOf(cards));
    if(info && info.type==='bomb') info.soft = false;
    return info;
  }
  return analyzeWild(cards);
}
/* 癞子双读的唯一优先序(手动判定、AI 与提示共用):
   王炸 > 炸弹(硬炸 > 软炸, 同软硬比 main 大者) > 其他读法(main 大者优先);
   main 相同再比 len、count、wings(均小者优先), 最后按类型序裁定(四带二在链型之前)。 */
const WILD_TYPE_ORDER = {single:0, pair:1, trio:2, trio1:3, trio2:4, four2:5, straight:6, pairs:7, plane:8, bomb:9, rocket:10};
function compareWildReadings(a, b){
  if(!a || !b) return !a && !b ? 0 : (!a ? 1 : -1);
  if(a.type==='rocket' || b.type==='rocket') return a.type===b.type ? 0 : (a.type==='rocket' ? -1 : 1);
  const aBomb = a.type==='bomb', bBomb = b.type==='bomb';
  if(aBomb || bBomb){
    if(aBomb !== bBomb) return aBomb ? -1 : 1;
    if(a.soft !== b.soft) return a.soft ? 1 : -1;
  }
  if(a.main !== b.main) return b.main - a.main;
  if((a.len||0) !== (b.len||0)) return (a.len||0) - (b.len||0);
  if((a.count||0) !== (b.count||0)) return (a.count||0) - (b.count||0);
  if((a.wings||0) !== (b.wings||0)) return (a.wings||0) - (b.wings||0);
  return (WILD_TYPE_ORDER[a.type] ?? 99) - (WILD_TYPE_ORDER[b.type] ?? 99);
}
function enumerateWildReadings(cards){
  const n = cards.length;
  const w = cards.filter(c=>c.v===LAIZI_VAL).length;
  const nv = cards.filter(c=>c.v!==LAIZI_VAL).map(c=>c.v);   // 自然牌点数(癞子牌已剔除)
  if(n===1) return [{type:'single', main:cards[0].v, len:0, count:1, wings:0, soft:false}];
  const cnt = countMap(nv);
  const candMains = [...new Set([...nv, LAIZI_VAL])].filter(v=>v<=15);   // 癞子不能替代大小王, 候选主值仅限普通点数
  const hasJok = a => a.some(v=>v>=16);
  const found = [];
  const add = (type, main, len, wings, soft)=>found.push({type, main, len:len||0, count:n, wings:wings||0, soft:!!soft});
  // 同点组: 对子 / 三张 / 炸弹(全部自然牌须同点)
  for(const m of candMains){
    if(!nv.every(v=>v===m)) continue;
    if(n===2) add('pair', m);
    else if(n===3) add('trio', m);
    else if(n===4) add('bomb', m, 0, 0, m!==LAIZI_VAL && w>0);
  }
  // 三带一 / 三带二
  for(const m of candMains){
    const natM = cnt[m]||0;
    if(m===LAIZI_VAL){ if(w<3) continue; }
    else { if(natM>3 || natM+w<3) continue; }
    const wildUsed = m===LAIZI_VAL ? 3 : 3-natM;
    const restNat = nv.filter(v=>v!==m);
    const restWild = w - wildUsed;
    const rest = n - 3;
    if(rest===1 && restNat.length+restWild===1) add('trio1', m);
    if(rest===2 && restNat.length+restWild===2 && !hasJok(restNat)){
      if(restNat.length===0 || restNat.length===1 || restNat[0]===restNat[1]) add('trio2', m);
    }
  }
  // 顺子(自然牌须互不相同且 <=A, 癞子补缺位)
  if(n>=5 && nv.every(v=>v<=14) && new Set(nv).size===nv.length){
    const loMin = nv.length ? Math.min(...nv) : 3, hiMax = nv.length ? Math.max(...nv) : 14;
    for(let lo=Math.max(3, hiMax-n+1); lo<=Math.min(loMin, 15-n); lo++){
      if(nv.every(v=>v>=lo && v<lo+n)) add('straight', lo+n-1, n);
    }
  }
  // 连对(窗口内每点恰需 2 张, 癞子补缺; 自然牌不得在窗口外)
  if(n>=6 && n%2===0){
    const L = n/2;
    for(let lo=3; lo+L-1<=14; lo++){
      let deficit=0, ok=true;
      for(let v=lo; v<lo+L; v++){ const c=cnt[v]||0; if(c>2){ ok=false; break; } deficit += 2-c; }
      if(!ok || nv.some(v=>v<lo || v>=lo+L)) continue;
      if(deficit===w) add('pairs', lo+L-1, L);
    }
  }
  // 飞机(核心窗口每点 3 张, 癞子补缺; 余牌作边翼)
  for(let L=2; 3*L<=n; L++){
    for(let lo=3; lo+L-1<=14; lo++){
      let deficit=0;
      const remVals = [];
      for(let v=lo; v<lo+L; v++){ const c=cnt[v]||0; if(c<3) deficit+=3-c; else for(let k=3;k<c;k++) remVals.push(v); }
      if(deficit>w) continue;
      for(const v of nv) if(v<lo || v>=lo+L) remVals.push(v);
      const remWild = w - deficit, rem = n - 3*L;
      if(remVals.length+remWild !== rem) continue;
      if(rem===0) add('plane', lo+L-1, L, 0);
      else if(rem===L) add('plane', lo+L-1, L, 1);
      else if(rem===2*L && !hasJok(remVals)){
        const rc = countMap(remVals);
        const odd = Object.values(rc).filter(c=>c%2===1).length;
        if(odd<=remWild && (remWild-odd)%2===0) add('plane', lo+L-1, L, 2);
      }
    }
  }
  // 四带二(带单张对 / 带两对)
  if(n===6 || n===8){
    for(const m of candMains){
      const natM = cnt[m]||0;
      if(m===LAIZI_VAL){ if(w<4) continue; }
      else { if(natM<1 || natM>4 || natM+w<4) continue; }
      const wildUsed = m===LAIZI_VAL ? 4 : 4-natM;
      const restNat = nv.filter(v=>v!==m);
      const restWild = w - wildUsed;
      if(restNat.length+restWild !== n-4) continue;
      if(n===6) add('four2', m);
      else if(!hasJok(restNat)){
        const rc = countMap(restNat);
        const odd = Object.values(rc).filter(c=>c%2===1).length;
        if(odd<=restWild && (restWild-odd)%2===0) add('four2', m);
      }
    }
  }
  const uniq = [], seen = new Set();
  for(const info of found){
    const key = [info.type, info.main, info.len||0, info.count, info.wings||0, info.soft?1:0].join('|');
    if(seen.has(key)) continue;
    seen.add(key); uniq.push(info);
  }
  return uniq.sort(compareWildReadings);
}
function analyzeWild(cards){
  const readings = enumerateWildReadings(cards);
  return readings.length ? readings[0] : null;
}
/* 提交一组牌时的上下文裁定: 自由出牌用统一优先序; 跟牌时先从全部合法读法中
   选能管上目标牌者, 再按同一优先序裁定。无可管上读法时回自由读法, 供界面提示“管不上”。 */
function resolvePlayInfo(cards, targetInfo){
  const freeInfo = analyzeCards(cards);
  if(!targetInfo || !freeInfo || !LAIZI_VAL || !cards.some(c=>c.v===LAIZI_VAL)) return freeInfo;
  const beating = enumerateWildReadings(cards).filter(info=>canBeat(info, targetInfo));
  return beating.length ? beating[0] : freeInfo;
}

// 牌型判定: 输入牌值数组, 返回 {type, main, len, count, wings} 或 null
// type: single pair trio trio1 trio2 straight pairs plane four2 bomb rocket
// len: 链长(straight=张数, pairs/plane=组数), 其余为0
function analyzeVals(vals){
  const n = vals.length; if(!n) return null;
  const cnt = countMap(vals);
  const keys = Object.keys(cnt).map(Number).sort((a,b)=>a-b);
  const T = (type, main, len, wings)=>({type, main, len:len||0, count:n, wings:wings||0});
  if(n===2 && cnt[16] && cnt[17]) return T('rocket', 17);
  if(n===1) return T('single', vals[0]);
  if(keys.length===1){
    if(n===2) return T('pair', keys[0]);
    if(n===3) return T('trio', keys[0]);
    if(n===4) return T('bomb', keys[0]);
  }
  if(n===4){ const t=keys.find(k=>cnt[k]===3); if(t!==undefined && keys.length===2) return T('trio1', t); }
  if(n===5){ const t=keys.find(k=>cnt[k]===3); if(t!==undefined && keys.length===2 && keys.some(k=>cnt[k]===2)) return T('trio2', t); }
  // 顺子
  if(n>=5 && keys.length===n && keys[n-1]<=14 && keys[n-1]-keys[0]===n-1) return T('straight', keys[n-1], n);
  // 连对
  if(n>=6 && n%2===0 && keys.every(k=>cnt[k]===2) && keys[keys.length-1]<=14 && keys[keys.length-1]-keys[0]===keys.length-1)
    return T('pairs', keys[keys.length-1], keys.length);
  // 飞机: 在三张组中找连续段
  const trioKeys = keys.filter(k=>cnt[k]>=3 && k<=14);
  for(let len=2; len<=trioKeys.length; len++){
    for(let i=0; i+len<=trioKeys.length; i++){
      const seq = trioKeys.slice(i, i+len);
      if(seq[len-1]-seq[0]!==len-1) continue;
      const rest = n - 3*len, main = seq[len-1];
      if(rest===0) return T('plane', main, len, 0);
      if(rest===len){
        // 边翼不能再拼出更长的三张主链(避免把飞机带翅膀误判成更长飞机由外层循环处理), 直接接受
        return T('plane', main, len, 1);
      }
      if(rest===2*len){
        const left = Object.assign({}, cnt); seq.forEach(k=>left[k]-=3);
        if(Object.values(left).every(c=>c===0||c===2)) return T('plane', main, len, 2);
      }
    }
  }
  // 四带二
  const four = keys.find(k=>cnt[k]===4);
  if(four!==undefined){
    if(n===6) return T('four2', four);
    if(n===8){
      const left = Object.assign({}, cnt); left[four]-=4;
      if(Object.values(left).every(c=>c===0||c===2)) return T('four2', four);
    }
  }
  return null;
}
// a 能否管上 b(b 为 null 表示首出)
function canBeat(a, b){
  if(!a) return false;
  if(!b) return true;
  if(a.type==='rocket') return true;
  if(b.type==='rocket') return false;
  if(a.type==='bomb' && b.type!=='bomb') return true;
  if(a.type==='bomb' && b.type==='bomb'){
    const ah = a.soft?0:1, bh = b.soft?0:1;       // 硬炸压软炸, 同类比点数
    if(ah!==bh) return ah>bh;
    return a.main > b.main;
  }
  if(b.type==='bomb') return false;
  if(a.type!==b.type) return false;
  if(a.count!==b.count || a.len!==b.len) return false;
  return a.main > b.main;
}

/* ---------- 出牌生成 ---------- */
function groupByVal(hand){
  const g = {}; for(const c of hand){ (g[c.v] = g[c.v]||[]).push(c); }
  return g;
}
function takeCards(g, v, n){ return (g[v]||[]).slice(0, n); }
function lowestSingles(g, excludeVals, n){
  const out = [];
  const vs = Object.keys(g).map(Number).sort((a,b)=>a-b);
  for(const v of vs){
    if(excludeVals.includes(v)) continue;
    for(const c of g[v]){ if(out.length<n) out.push(c); }
    if(out.length>=n) break;
  }
  return out;
}
function lowestPairs(g, excludeVals, n){
  const out = [];
  const vs = Object.keys(g).map(Number).sort((a,b)=>a-b);
  for(const v of vs){
    if(excludeVals.includes(v)) continue;
    if((g[v]||[]).length>=2 && out.length < 2*n) out.push(...g[v].slice(0,2));
    if(out.length>=2*n) break;
  }
  return out.length===2*n ? out : null;
}
// 生成全部候选出法(返回 [{cards, info}]), last=null 为首出
function genPlaysClassic(hand, last){
  const g = groupByVal(hand);
  const vs = Object.keys(g).map(Number).sort((a,b)=>a-b);
  const plays = [];
  const push = (cards)=>{
    if(!cards || !cards.length) return;
    const info = analyzeVals(valsOf(cards));
    if(info) plays.push({cards, info});
  };
  const pushIf = (cards)=>{ // 跟牌时校验
    if(!cards || !cards.length) return;
    const info = analyzeVals(valsOf(cards));
    if(info && canBeat(info, last ? last.info : null)) plays.push({cards, info});
  };
  const add = last ? pushIf : push;
  if(!last){
    for(const v of vs){
      push(takeCards(g, v, 1));
      if(g[v].length>=2) push(takeCards(g, v, 2));
      if(g[v].length>=3){
        push(takeCards(g, v, 3));
        const s1 = lowestSingles(g, [v], 1); if(s1.length) push([...takeCards(g,v,3), ...s1]);
        const p1 = lowestPairs(g, [v], 1); if(p1) push([...takeCards(g,v,3), ...p1]);
      }
      if(g[v].length===4){
        const s2 = lowestSingles(g, [v], 2); if(s2.length===2) push([...takeCards(g,v,4), ...s2]);
        const p2 = lowestPairs(g, [v], 2); if(p2) push([...takeCards(g,v,4), ...p2]);
      }
    }
    // 顺子
    const singles = vs.filter(v=>v<=14);
    for(let L=5; L<=12; L++) for(let i=0; i+L<=singles.length; i++){
      const seq = singles.slice(i, i+L);
      if(seq[L-1]-seq[0]===L-1) push(seq.map(v=>g[v][0]));
    }
    // 连对
    const pairVs = vs.filter(v=>v<=14 && g[v].length>=2);
    for(let L=3; L<=10; L++) for(let i=0; i+L<=pairVs.length; i++){
      const seq = pairVs.slice(i, i+L);
      if(seq[L-1]-seq[0]===L-1) push(seq.flatMap(v=>g[v].slice(0,2)));
    }
    // 飞机(不带/带单/带对, 翅膀取最低)
    const trioVs = vs.filter(v=>v<=14 && g[v].length>=3);
    for(let L=2; L<=6; L++) for(let i=0; i+L<=trioVs.length; i++){
      const seq = trioVs.slice(i, i+L);
      if(seq[L-1]-seq[0]!==L-1) continue;
      const core = seq.flatMap(v=>g[v].slice(0,3));
      push(core);
      const w1 = lowestSingles(g, seq, L); if(w1.length===L) push([...core, ...w1]);
      const w2 = lowestPairs(g, seq, L); if(w2) push([...core, ...w2]);
    }
  } else {
    const t = last.info.type, lm = last.info.main;
    const above = vs.filter(v=>v>lm);
    if(t==='single'){ for(const v of above) add(takeCards(g, v, 1)); }
    else if(t==='pair'){ for(const v of above) if(g[v].length>=2) add(takeCards(g, v, 2)); }
    else if(t==='trio'){ for(const v of above) if(g[v].length>=3) add(takeCards(g, v, 3)); }
    else if(t==='trio1' || t==='trio2'){
      for(const v of above){
        if(g[v].length<3) continue;
        if(t==='trio1'){ const s = lowestSingles(g, [v], 1); if(s.length) add([...takeCards(g,v,3), ...s]); }
        else { const p = lowestPairs(g, [v], 1); if(p) add([...takeCards(g,v,3), ...p]); }
      }
    }
    else if(t==='straight' || t==='pairs'){
      const L = last.info.len;
      const src = t==='straight' ? vs.filter(v=>v<=14) : vs.filter(v=>v<=14 && g[v].length>=2);
      for(let i=0; i+L<=src.length; i++){
        const seq = src.slice(i, i+L);
        if(seq[L-1]-seq[0]===L-1 && seq[L-1]>lm)
          add(t==='straight' ? seq.map(v=>g[v][0]) : seq.flatMap(v=>g[v].slice(0,2)));
      }
    }
    else if(t==='plane'){
      const L = last.info.len, wings = last.info.wings;
      const trioVs = vs.filter(v=>v<=14 && g[v].length>=3);
      for(let i=0; i+L<=trioVs.length; i++){
        const seq = trioVs.slice(i, i+L);
        if(seq[L-1]-seq[0]!==L-1 || seq[L-1]<=lm) continue;
        const core = seq.flatMap(v=>g[v].slice(0,3));
        if(wings===0) add(core);
        else if(wings===1){ const w = lowestSingles(g, seq, L); if(w.length===L) add([...core, ...w]); }
        else { const w = lowestPairs(g, seq, L); if(w) add([...core, ...w]); }
      }
    }
    else if(t==='four2'){
      for(const v of above){
        if(g[v].length<4) continue;
        if(last.info.count===6){ const s = lowestSingles(g, [v], 2); if(s.length===2) add([...takeCards(g,v,4), ...s]); }
        else { const p = lowestPairs(g, [v], 2); if(p) add([...takeCards(g,v,4), ...p]); }
      }
    }
  }
  // 炸弹与王炸永远是候选
  for(const v of vs) if(g[v].length===4) pushIf(takeCards(g, v, 4));
  if(g[16] && g[17]) pushIf([g[16][0], g[17][0]]);
  return plays;
}

/* ---------- 出牌生成: 模式分发 ---------- */
function genPlays(hand, last){
  return LAIZI_VAL ? genPlaysLaizi(hand, last) : genPlaysClassic(hand, last);
}
/* 癞子场生成: 按"目标点数 + 癞子替身"组合构造, info 为生成时的预定读法 */
function genPlaysLaizi(hand, last){
  const L = LAIZI_VAL;
  const wilds = hand.filter(c=>c.v===L);
  const W = wilds.length;
  const g = {};
  for(const c of hand) if(c.v!==L) (g[c.v]=g[c.v]||[]).push(c);
  const plays = [], byCards = new Map();
  function pushW(cards, info){
    if(!cards || !cards.length) return;
    // 构造 info 只是候选草稿: 入列前按这组实体牌与当前目标统一裁定,
    // 保证生成器预定读法与玩家手动提交走同一口径(同一优先序、跟牌先选可管上读法)。
    info = resolvePlayInfo(cards, last ? last.info : null);
    if(!info) return;
    if(last && !canBeat(info, last.info)) return;
    const cardKey = cards.map(c=>hand.indexOf(c)).sort((a,b)=>a-b).join(',');
    if(byCards.has(cardKey)) return;   // 同一组实体牌在同一上下文只保留这一读法
    const play = {cards, info};
    byCards.set(cardKey, play);
    plays.push(play);
  }
  function fill(v, need){           // 取 need 张点数 v: 自然牌优先, 癞子补足; v 即癞子点则全用癞子本体
    if(v===L) return W>=need ? wilds.slice(0,need) : null;
    const nat = (g[v]||[]);
    if(nat.length + W < need) return null;
    const useNat = nat.slice(0, Math.min(nat.length, need));
    return [...useNat, ...wilds.slice(0, need-useNat.length)];
  }
  function subsUsed(v, need){ return v===L ? 0 : need - Math.min((g[v]||[]).length, need); }
  function restAfter(used){ const u=new Set(used); return hand.filter(c=>!u.has(c)); }
  function lowestFrom(pool, n){     // 边翼取最小: 自然牌优先(按点数), 癞子最后
    return pool.slice().sort((a,b)=> ((a.v===L)-(b.v===L)) || a.v-b.v).slice(0, n);
  }
  function pairsFrom(pool, npairs){ // 从余牌组对: 自然对优先, 其次单张配癞, 最后双癞; 大小王不可组对
    const byV = {}, w = [];
    for(const c of pool){
      if(c.v===L) w.push(c);
      else if(c.v<16) (byV[c.v]=byV[c.v]||[]).push(c);
    }
    const out = [], singles = [];
    for(const v of Object.keys(byV).map(Number).sort((a,b)=>a-b)){
      const arr = byV[v].slice();
      while(arr.length>=2 && out.length<2*npairs){ out.push(arr.shift(), arr.shift()); }
      if(arr.length) singles.push(...arr);
    }
    let wi = 0;
    while(out.length<2*npairs && singles.length && wi<w.length) out.push(singles.shift(), w[wi++]);
    while(out.length<2*npairs && w.length-wi>=2) out.push(w[wi++], w[wi++]);
    return out.length===2*npairs ? out : null;
  }
  function chainCompose(lo, len, per){  // 链型核心: 窗口内每点 per 张, 不足用癞子补
    const cards = []; let wi = 0;
    for(let v=lo; v<lo+len; v++){
      const nat = (g[v]||[]).slice(0, per);
      cards.push(...nat);
      for(let k=nat.length; k<per; k++){ if(wi>=W) return null; cards.push(wilds[wi++]); }
    }
    return cards;
  }
  const natVals = Object.keys(g).map(Number).sort((a,b)=>a-b);
  const groupVals = [...new Set([...natVals.filter(v=>v<=15), ...(W?[L]:[])])].sort((a,b)=>a-b);
  // 单张(每个点数一张; 癞子单张按本点数出)
  for(const v of [...new Set(hand.map(c=>c.v))].sort((a,b)=>a-b)){
    pushW([v===L ? wilds[0] : g[v][0]], {type:'single', main:v});
  }
  // 同点组: 对 / 三 / 三带 / 炸 / 四带
  for(const v of groupVals){
    const pair = fill(v,2); if(pair) pushW(pair, {type:'pair', main:v});
    const trio = fill(v,3);
    if(trio){
      pushW(trio, {type:'trio', main:v});
      const rest1 = restAfter(trio);
      const w1 = lowestFrom(rest1, 1); if(w1.length===1) pushW([...trio, ...w1], {type:'trio1', main:v});
      const w2 = pairsFrom(rest1, 1); if(w2) pushW([...trio, ...w2], {type:'trio2', main:v});
    }
    const four = fill(v,4);
    if(four){
      pushW(four, {type:'bomb', main:v, soft: subsUsed(v,4)>0});
      const rest2 = restAfter(four);
      const s2 = lowestFrom(rest2, 2); if(s2.length===2) pushW([...four, ...s2], {type:'four2', main:v});
      const p2 = pairsFrom(rest2, 2); if(p2) pushW([...four, ...p2], {type:'four2', main:v});
    }
  }
  // 顺子
  for(let len=5; len<=12; len++) for(let lo=3; lo+len-1<=14; lo++){
    const cards = chainCompose(lo, len, 1);
    if(cards) pushW(cards, {type:'straight', main:lo+len-1, len});
  }
  // 连对
  for(let len=3; len<=10; len++) for(let lo=3; lo+len-1<=14; lo++){
    const cards = chainCompose(lo, len, 2);
    if(cards) pushW(cards, {type:'pairs', main:lo+len-1, len});
  }
  // 飞机(不带 / 带单 / 带对)
  for(let len=2; len<=6; len++) for(let lo=3; lo+len-1<=14; lo++){
    const core = chainCompose(lo, len, 3);
    if(!core) continue;
    pushW(core, {type:'plane', main:lo+len-1, len, wings:0});
    const rest = restAfter(core);
    const w1 = lowestFrom(rest, len); if(w1.length===len) pushW([...core, ...w1], {type:'plane', main:lo+len-1, len, wings:1});
    const w2 = pairsFrom(rest, len); if(w2) pushW([...core, ...w2], {type:'plane', main:lo+len-1, len, wings:2});
  }
  // 王炸(双王必须自然牌)
  if(g[16] && g[17]) pushW([g[16][0], g[17][0]], {type:'rocket', main:17});
  return plays;
}

/* ---------- 不洗牌: 成包发牌 ----------
   先从整副牌中切出组合牌包(王包/炸弹/顺子/连对/三张/对子), 余牌为散牌;
   牌包洗乱后轮流分给三家(不超 17 张上限, 放不下则拆入散牌), 散牌补满 17。
   全副仍为 54 张不重复, 三家各 17 张 + 底牌 3 张。 */
function dealNoShuffle(){
  const byRank = {};
  for(const s of ['红桃','黑桃','梅花','方块']) for(let v=3; v<=15; v++) (byRank[v]=byRank[v]||[]).push({v, s});
  const avail = v => (byRank[v]||[]).length;
  const rnd = (a,b)=> a + Math.floor(Math.random()*(b-a+1));
  const pickFrom = arr => arr[Math.floor(Math.random()*arr.length)];
  const packets = [];
  let jokersPacked = false;
  if(Math.random()<0.35){ packets.push([{v:16,s:'王'},{v:17,s:'王'}]); jokersPacked = true; }
  if(Math.random()<0.55){
    const cand = []; for(let v=3; v<=15; v++) if(avail(v)===4) cand.push(v);
    if(cand.length) packets.push(byRank[pickFrom(cand)].splice(0,4));
  }
  for(let t=0; t<2; t++){
    const len = rnd(5,8), starts = [];
    for(let lo=3; lo+len-1<=14; lo++){ let ok=true; for(let v=lo; v<lo+len; v++) if(avail(v)<1){ ok=false; break; } if(ok) starts.push(lo); }
    if(!starts.length) continue;
    const lo = pickFrom(starts), pkt = [];
    for(let v=lo; v<lo+len; v++) pkt.push(byRank[v].splice(Math.floor(Math.random()*byRank[v].length),1)[0]);
    packets.push(pkt);
  }
  for(let t=0, chainN=rnd(1,2); t<chainN; t++){
    const len = rnd(3,4), starts = [];
    for(let lo=3; lo+len-1<=14; lo++){ let ok=true; for(let v=lo; v<lo+len; v++) if(avail(v)<2){ ok=false; break; } if(ok) starts.push(lo); }
    if(!starts.length) continue;
    const lo = pickFrom(starts), pkt = [];
    for(let v=lo; v<lo+len; v++) pkt.push(...byRank[v].splice(0,2));
    packets.push(pkt);
  }
  for(let t=0, trioN=rnd(2,3); t<trioN; t++){
    const cand = []; for(let v=3; v<=15; v++) if(avail(v)>=3) cand.push(v);
    if(!cand.length) break;
    packets.push(byRank[pickFrom(cand)].splice(0,3));
  }
  for(let t=0, pairN=rnd(3,5); t<pairN; t++){
    const cand = []; for(let v=3; v<=15; v++) if(avail(v)>=2) cand.push(v);
    if(!cand.length) break;
    packets.push(byRank[pickFrom(cand)].splice(0,2));
  }
  const loose = [];
  for(let v=3; v<=15; v++) loose.push(...byRank[v]);
  if(!jokersPacked) loose.push({v:16,s:'王'},{v:17,s:'王'});
  shuffle(loose); shuffle(packets);
  const hands = [[],[],[]];
  let seat = Math.floor(Math.random()*3);
  for(const pkt of packets){
    let placed = false;
    for(let k=0; k<3; k++){
      const s = (seat+k)%3;
      if(hands[s].length + pkt.length <= 17){ hands[s].push(...pkt); seat = (s+1)%3; placed = true; break; }
    }
    if(!placed) loose.push(...pkt);
  }
  shuffle(loose);
  for(let s=0; s<3; s++) while(hands[s].length<17) hands[s].push(loose.pop());
  return {hands, dipai: loose.slice()};
}

/* ---------- AI ---------- */
// 性格: bombLuck 炸弹冲动, hold 忍耐(大牌保留倾向)
const PERSONA = {
  monkey:{aggro:.45, bombLuck:.22},
  fish:  {aggro:.8,  bombLuck:.38},
  teapot:{aggro:.3,  bombLuck:.12},
  egg:   {aggro:.5,  bombLuck:.35},
  donkey:{aggro:.4,  bombLuck:.16},
  snake: {aggro:.62, bombLuck:.08},
};
function handStrength(hand){
  const cnt = countMap(valsOf(hand)); let s = 0;
  if(cnt[17]) s += 3.2; if(cnt[16]) s += 2.2;
  if(LAIZI_VAL && cnt[LAIZI_VAL]) s += cnt[LAIZI_VAL]*1.5;
  for(const v in cnt){ if(cnt[v]===4) s += 3; if(+v===15) s += cnt[v]*1.1; if(+v===14) s += cnt[v]*.4; }
  return s;
}
function aiBid(hand, persona, level){
  const s = handStrength(hand) + (persona ? persona.aggro : .5) * .8;
  if(level==='easy'){   // 简单: 叫分保守, 最高只叫 2 分
    if(s >= 7.6) return 2; if(s >= 5.4) return 1; return 0;
  }
  if(level==='expert'){ // 高手: 强度评估更准, 强牌果断叫满, 中等牌也敢争
    if(s >= 7.9) return 3; if(s >= 5.8) return 2; if(s >= 4.0) return 1; return 0;
  }
  if(s >= 8.4) return 3; if(s >= 6.2) return 2; if(s >= 4.2) return 1; return 0;
}
function isBombLike(info){ return info.type==='bomb' || info.type==='rocket'; }
/* ---------- v0.6: AI 三档难度 ----------
   level 经 ctx.level 传入('easy'|'normal'|'expert', 缺省 normal)。
   普通档即 aiDecide 原有启发式, 代码路径与随机调用顺序不变;
   残局闯关在 UI 层强制 normal, 不受难度设置影响。 */
function aiDecideEasy(hand, last, ctx){
  const plays = genPlays(hand, last);
  if(!plays.length) return null;
  const rndPick = arr => arr[Math.floor(Math.random()*arr.length)];
  const nonBomb = plays.filter(p=>!isBombLike(p.info));
  if(!last){
    const full = plays.find(p=>p.cards.length===hand.length);
    if(full && Math.random()<0.5) return full;
    // 偏随机出牌: 拆对、拆三张出单张、随手甩掉大牌, 都会发生
    return rndPick(nonBomb.length ? nonBomb : plays);
  }
  // 跟牌: 没有队友配合概念(队友的牌同样照跟), 且常常直接过
  const mustPlay = (ctx.selfPass||0) >= 6;   // 兜底: 久不出手时被迫打一手, 避免整局旁观
  if(!mustPlay && Math.random() < 0.5) return null;
  if(nonBomb.length) return rndPick(nonBomb);
  // 只剩炸弹类出法: 极低概率才舍得炸
  if(mustPlay || Math.random() < 0.06)
    return plays.slice().sort((a,b)=>a.info.main-b.info.main)[0];
  return null;
}
// 拆整惩罚: 一个出法只用掉某点数的一部分(拆炸弹/拆三张/拆对子)时计罚
function splitPenalty(hand, play){
  const g = groupByVal(hand), used = countMap(valsOf(play.cards));
  let pen = 0;
  for(const v in used){
    const total = (g[v]||[]).length;
    if(used[v] < total){
      if(total===4) pen += 60;
      else if(total===3) pen += 26;
      else if(total===2) pen += 12;
    }
  }
  return pen;
}
// 记牌推断: 某点数还可能在外面的张数(总数 - 已出 - 自己手里), 与记牌器同一数据源
function unseenCount(ctx, hand, v){
  const total = v>=16 ? 1 : 4;
  const played = (ctx.played && ctx.played[v]) || 0;
  let mine = 0; for(const c of hand) if(c.v===v) mine++;
  return total - played - mine;
}
function highestUnseen(ctx, hand){
  for(let v=17; v>=3; v--) if(unseenCount(ctx, hand, v)>0) return v;
  return 0;
}
function bombMayBeOut(ctx, hand){
  for(let v=3; v<=15; v++) if(unseenCount(ctx, hand, v)===4) return true;
  return unseenCount(ctx, hand, 16)>0 && unseenCount(ctx, hand, 17)>0;
}
// 手数估计: 贪心拆解一手牌, 估计打完所需的最少手数(链型优先抽取, 三张挂翅膀不另计手)
function estimateMoves(cards){
  if(!cards.length) return 0;
  const cnt = countMap(valsOf(cards));
  let moves = 0;
  const take = (v, n)=>{ cnt[v] -= n; if(cnt[v]<=0) delete cnt[v]; };
  if(cnt[16] && cnt[17]){ moves++; delete cnt[16]; delete cnt[17]; }
  for(const v in Object.keys(cnt)) if(cnt[v]===4){ moves++; delete cnt[v]; }
  for(;;){
    const ranks = Object.keys(cnt).map(Number).filter(v=>v<=14).sort((a,b)=>a-b);
    let best = null;
    for(let i=0;i<ranks.length;i++){ let j=i; while(j+1<ranks.length && ranks[j+1]===ranks[j]+1) j++;
      if(j-i+1>=5 && (!best || j-i+1>best.cover)) best = {seq:ranks.slice(i,j+1), use:1, cover:j-i+1, plane:false}; }
    const pr = ranks.filter(v=>cnt[v]>=2);
    for(let i=0;i<pr.length;i++){ let j=i; while(j+1<pr.length && pr[j+1]===pr[j]+1) j++;
      if(j-i+1>=3 && (!best || (j-i+1)*2>best.cover)) best = {seq:pr.slice(i,j+1), use:2, cover:(j-i+1)*2, plane:false}; }
    const tr = ranks.filter(v=>cnt[v]>=3);
    for(let i=0;i<tr.length;i++){ let j=i; while(j+1<tr.length && tr[j+1]===tr[j]+1) j++;
      if(j-i+1>=2 && (!best || (j-i+1)*3>best.cover)) best = {seq:tr.slice(i,j+1), use:3, cover:(j-i+1)*3, plane:true}; }
    if(!best) break;
    for(const v of best.seq) take(v, best.use);
    moves++;
    if(best.plane){
      // 翅膀: 优先整单张组, 其次整对子组, 凑满核心节数则不另计手
      const len = best.seq.length;
      let got = 0;
      for(const v of Object.keys(cnt).map(Number).sort((a,b)=>a-b)){
        if(got>=len) break;
        if(cnt[v]===1){ take(v,1); got++; }
      }
      if(got<len) for(const v of Object.keys(cnt).map(Number).sort((a,b)=>a-b)){
        if(got>=len) break;
        if(cnt[v]===2){ take(v,2); got++; }
      }
    }
  }
  const groups = Object.keys(cnt).length;
  const trios = Object.values(cnt).filter(c=>c===3).length;
  moves += groups - Math.min(trios, groups - trios);
  return moves;
}
function aiDecideExpert(hand, last, ctx, plays){
  const full = plays.find(p=>p.cards.length===hand.length);
  const restAfter = p => hand.filter(c=>!p.cards.includes(c));
  // 以"打出后剩余手数"为主序: 手数少者优; 次序为多出牌、低点数、少拆整
  const movesScore = p => estimateMoves(restAfter(p))*100 - p.info.count*3 + p.info.main*0.5 + splitPenalty(hand, p)*0.2;
  const pickByMoves = arr => arr.slice().sort((a,b)=>movesScore(a)-movesScore(b))[0];
  if(!last){
    if(full) return full;
    const nonBomb = plays.filter(p=>!isBombLike(p.info));
    const pool = nonBomb.length ? nonBomb : plays;
    // 农民队友只剩 <=2 张: 喂最小单张送队友先走(自己能一手走完已在上面处理)
    if(!ctx.isLandlord && (ctx.partnerCards==null ? 99 : ctx.partnerCards)<=2){
      const singles = pool.filter(p=>p.info.type==='single').sort((a,b)=>a.info.main-b.info.main);
      if(singles.length) return singles[0];
    }
    let cands = pool;
    if(ctx.nextOppCards===1){
      // 对手只剩 1 张: 不喂单张——只出组合, 或出记牌确认的已知最大单张
      const hus = highestUnseen(ctx, hand);
      const safe = pool.filter(p=> p.info.type!=='single' || p.info.main>=hus);
      if(safe.length) cands = safe;
    }
    return pickByMoves(cands);
  }
  // 跟牌: 能一手走完必走(普通档的对手跟牌路径没有这条判断)
  if(full && canBeat(full.info, last.info)) return full;
  if(ctx.rel==='partner'){
    if(ctx.lastOwnerCards<=5 || isBombLike(last.info)) return null;   // 让行, 且绝不炸队友
    const pn = plays.filter(p=>!isBombLike(p.info));
    if(pn.length) return pickByMoves(pn);
    return null;
  }
  const nonBomb = plays.filter(p=>!isBombLike(p.info));
  if(nonBomb.length){
    const best = pickByMoves(nonBomb);
    // 保留控制牌: 跟小牌若必须动用大牌(2/王)且打完手数不降、出牌者还远未收官, 则让过这一手
    if(best.info.main>=15 && last.info.main<=13 && ctx.lastOwnerCards>5
       && estimateMoves(restAfter(best)) >= estimateMoves(hand)) return null;
    return best;
  }
  const bombs = plays.filter(p=>isBombLike(p.info)).sort((a,b)=>a.info.main-b.info.main);
  if(bombs.length){
    const ownerLow = ctx.lastOwnerCards<=2;                          // 出牌者只剩 <=2 张, 必拦
    const finishByBomb = estimateMoves(restAfter(bombs[0])) <= 1;    // 炸完一手内可收官
    const safeWindow = ctx.lastOwnerCards<=3 && !bombMayBeOut(ctx, hand); // 记牌确认外面已无更大炸弹/王炸
    if(ownerLow || finishByBomb || safeWindow) return bombs[0];
  }
  return null;
}
// ctx: {rel:'lead'|'partner'|'opponent', lastOwnerCards, nextOppCards, personaKey}
// 返回 {cards, info} 或 null(不出)
function aiDecide(hand, last, ctx){
  const P = PERSONA[ctx.personaKey] || PERSONA.monkey;
  const level = ctx.level || 'normal';
  if(level==='easy') return aiDecideEasy(hand, last, ctx);
  const plays = genPlays(hand, last);
  if(!plays.length) return null;
  if(level==='expert') return aiDecideExpert(hand, last, ctx, plays);
  const full = plays.find(p=>p.cards.length===hand.length);
  if(!last){
    if(full) return full;
    const normal = plays.filter(p=>!isBombLike(p.info));
    const pool = normal.length ? normal : plays;
    let sorted;
    if(ctx.nextOppCards===1){
      // 下家只剩一张: 不喂单张, 优先组合, 否则出最大单张
      const combos = pool.filter(p=>p.info.count>=2);
      if(combos.length) sorted = combos.sort((a,b)=> b.info.count-a.info.count || a.info.main-b.info.main);
      else sorted = pool.sort((a,b)=> b.info.main-a.info.main);
    } else {
      sorted = pool.sort((a,b)=> b.info.count-a.info.count || a.info.main-b.info.main);
    }
    return sorted[0];
  }
  // 跟牌
  // 防旁观: 本局从未出过牌且已让过一次时, 再遇合法出法必须出最小的一手(队友只剩<=2 张时仍让行)
  const neverPlayed = (ctx.playsMade||0)===0;
  if(ctx.rel==='partner'){
    // 队友的牌: 能直接走完时接管; 仅当队友接近走完(<=5 张)或刚出炸弹时让行,
    // 否则打最小可管的普通牌——避免队友长期领出时整局旁观
    if(full && canBeat(full.info, last.info)) return full;
    const mustJoin = neverPlayed && (ctx.selfPass||0)>=1 && ctx.lastOwnerCards>2;
    if(!mustJoin && (ctx.lastOwnerCards<=5 || isBombLike(last.info))) return null;
    const pn = plays.filter(p=>!isBombLike(p.info))
      .sort((a,b)=> a.info.main-b.info.main || b.info.count-a.info.count);
    if(pn.length) return pn[0];
    if(mustJoin && plays.length)
      return plays.slice().sort((a,b)=> (isBombLike(a.info)-isBombLike(b.info)) || a.info.main-b.info.main)[0];
    return null;
  }
  // 防旁观兜底: 从未出过牌且已让过一次, 或已连续不出 4 轮时, 有合法出法必须出最小的一手
  if(plays.length && ((neverPlayed && (ctx.selfPass||0)>=1) || (ctx.selfPass||0)>=4)){
    return plays.slice().sort((a,b)=> (isBombLike(a.info)-isBombLike(b.info)) || a.info.main-b.info.main)[0];
  }
  const normal = plays.filter(p=>!isBombLike(p.info))
    .sort((a,b)=> a.info.main-b.info.main || b.info.count-a.info.count);
  if(normal.length) return normal[0];
  const bombs = plays.filter(p=>isBombLike(p.info)).sort((a,b)=>a.info.main-b.info.main);
  if(bombs.length){
    const ownerLow = ctx.lastOwnerCards<=2;                       // 出牌者只剩<=2张, 必须拦
    const finishSoon = hand.length - bombs[0].cards.length <= 5;  // 炸完接近走完
    if(ownerLow || finishSoon || Math.random() < P.bombLuck) return bombs[0];
  }
  return null;
}
// === ENGINE END ===

/* ---------- v0.8: 赛季段位 ----------
   仅经典/癞子/不洗牌三场次对局计入: finishGame 中残局已提前分流到 finishChallenge,
   走到计分代码的必然是三场次。存档独立键 myskme_ddz_rank, 不动既有任何键。
   段位阶梯(头部产品通行做法): 青铜/白银/黄金/铂金/钻石 各 III、II、I 三小段 + 大师;
   每小段 100 分, 门槛 = 小段序号 × 100(青铜III 0 … 钻石I 1400, 大师 1500)。
   计分公式: 胜 delta = 本局得分 + 4(基础胜分); 负 delta = -(本局得分 + 2)(基础负分);
   保级: 实扣不跌穿本局开局时所在大段的最低分(大段底 = 大段序号 × 300, 大师 1500)。
   赛季: 自然月一季; 跨月首次读取时结算上赛季(最终段位写入 history, 最多留 6 条),
   新赛季段位分软重置到「上赛季最终大段 - 1 档」的起点(青铜保底 0)。
   注(v0.8.1): 段位名函数叫 tierName(points); 牌面点数标签是 rankName(v)(引擎后 UI 段),
   两者绝不可重名——v0.8 首版曾同名冲突, 后声明覆盖先声明, 解说/点评里的点数全被段位名顶掉。 */
const RANK_MAJORS = ['青铜','白银','黄金','铂金','钻石','大师'];
const RANK_STEP = 100;        // 每小段分差
const RANK_WIN_BASE = 4;      // 基础胜分
const RANK_LOSE_BASE = 2;     // 基础负分
function rankIndex(points){ return Math.min(15, Math.floor(Math.max(0, points) / RANK_STEP)); }   // 0..14 小段, 15 大师
function rankMajorIndex(points){ const i = rankIndex(points); return i>=15 ? 5 : Math.floor(i/3); }
function rankMajorFloor(points){ return rankMajorIndex(points) * 300; }
function tierName(points){
  const i = rankIndex(points);
  if(i>=15) return '大师';
  return RANK_MAJORS[Math.floor(i/3)] + ' ' + ['III','II','I'][i%3];
}
function rankNextThreshold(points){ const i = rankIndex(points); return i>=15 ? null : (i+1)*RANK_STEP; }
function rankDeltaFor(myWin, score){ return myWin ? score + RANK_WIN_BASE : -(score + RANK_LOSE_BASE); }
function currentSeason(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function seasonLabel(s){ const p = String(s||'').split('-'); return p.length===2 ? p[0]+' 年 '+Number(p[1])+' 月' : String(s||''); }
let rankStore = null;
function saveRank(){ localStorage.setItem('myskme_ddz_rank', JSON.stringify(rankStore)); }
function rankData(){
  if(!rankStore){
    try{ rankStore = JSON.parse(localStorage.getItem('myskme_ddz_rank')||'null'); }catch(e){ rankStore = null; }
    if(!rankStore || typeof rankStore!=='object' || typeof rankStore.points!=='number' || !rankStore.season){
      rankStore = {season: currentSeason(), points: 0, history: []};
      saveRank();
    }
    if(!Array.isArray(rankStore.history)) rankStore.history = [];
  }
  if(rankStore.season !== currentSeason()){
    rankStore.history.unshift({season: rankStore.season, points: rankStore.points, rank: tierName(rankStore.points)});
    rankStore.history = rankStore.history.slice(0, 6);
    rankStore.points = Math.max(0, rankMajorIndex(rankStore.points) - 1) * 300;
    rankStore.season = currentSeason();
    saveRank();
  }
  return rankStore;
}
/* 结算一局三场次对局的段位分: 返回实际变化(经保级钳制后)与升段信息, 供结算面板展示 */
function applyRankResult(myWin, score){
  const rk = rankData();
  const beforePts = rk.points;
  const beforeIdx = rankIndex(beforePts);
  let afterPts = beforePts + rankDeltaFor(myWin, score);
  const floor = rankMajorFloor(beforePts);
  if(afterPts < floor) afterPts = floor;
  rk.points = afterPts;
  saveRank();
  return {delta: afterPts - beforePts, beforePts, afterPts, promoted: rankIndex(afterPts) > beforeIdx, name: tierName(afterPts)};
}

  const rk = rankData();

  const last = rk.history.length ? '<br>上赛季（'+seasonLabel(rk.history[0].season)+'）定格 '+rk.history[0].rank+' · '+rk.history[0].points+' 分' : '';
  return '<div class="rankbar"><span class="rank-badge">'+tierName(rk.points)+'</span>' +
    '<span class="rank-info">'+seasonLabel(rk.season)+'赛季 · 段位分 <b>'+rk.points+'</b><br>'+nextTxt+last+'</span></div>';
}

let storyProgress = JSON.parse(localStorage.getItem('myskme_ddz_story')||'{"defeats":{}}');
if(!storyProgress || typeof storyProgress!=='object' || !storyProgress.defeats || typeof storyProgress.defeats!=='object') storyProgress = {defeats:{}};
function saveStoryProgress(){ localStorage.setItem('myskme_ddz_story', JSON.stringify(storyProgress)); }
function storyDefeatCount(key){ return storyProgress.defeats[key] || 0; }
function storyPieceUnlocked(key, idx){
  if(idx===0) return true;
  if(idx===1) return storyDefeatCount(key) >= 2;
  return storyDefeatCount(key) >= 4 && totalStars() >= 6;
}
function storyPieceCondition(idx){
  return idx===1 ? '击败该角色 2 次后解锁' : '击败该角色 4 次，且残局总星达到 6 星后解锁';
}
function storyUnlockedFor(key){ return [0,1,2].filter(i=>storyPieceUnlocked(key, i)).length; }
function unlockedStoryCount(){ return Object.keys(CHARS).reduce((sum,key)=>sum + storyUnlockedFor(key), 0); }
function recordStoryDefeats(playerWon){
  if(!playerWon || !G || !Array.isArray(G.aiChar)) return;
  for(const seat of [1,2]){
    const key = G.aiChar[seat];
    if(key && CHARS[key]) storyProgress.defeats[key] = storyDefeatCount(key) + 1;
  }
  saveStoryProgress();
}
let storyReturn = 'menu';
function showStoryCodex(from){
  storyReturn = from || 'menu';
  setPanelClass('story-panel');
  const cards = Object.keys(CHARS).map(key=>{
    const c = CHARS[key], unlocked = storyUnlockedFor(key);
    return '<button class="modebtn story-char" onclick="showStoryChar(\''+key+'\')">' +
      '<img class="avatar" src="'+c.av+'" alt="">' +
      '<b>'+c.name+'</b><span>已解锁 '+unlocked+' / 3 篇<br>已击败 '+storyDefeatCount(key)+' 次</span></button>';
  }).join('');
  $('panel').innerHTML =
    '<h2>故事图鉴</h2>' +
    '<div class="who-win">已解锁 '+unlockedStoryCount()+' / 18 篇 · 残局总星 '+totalStars()+' / 30</div>' +
    '<div class="story-grid">'+cards+'</div>' +
    '<div class="story-actions"><button class="ghost" onclick="closeStoryCodex()">'+(storyReturn==='game'?'返回对局':'返回场次选择')+'</button></div>';
  $('overlay').classList.add('show');
}
function showStoryChar(key){
  const c = CHARS[key];
  if(!c || !STORIES[key]) return;
  setPanelClass('story-panel');
  const pieces = STORIES[key].map((text, idx)=>{
    if(storyPieceUnlocked(key, idx)){
      return '<article class="story-item"><h4>篇'+['一','二','三'][idx]+'</h4><p>'+text+'</p></article>';
    }
    return '<article class="story-item"><div class="story-lock"><div class="q">?</div><div>' +
      '<b>篇'+['一','二','三'][idx]+'尚未解锁</b><span>'+storyPieceCondition(idx)+'。当前已击败 '+storyDefeatCount(key)+' 次，残局总星 '+totalStars()+' 星。</span></div></div></article>';
  }).join('');
  const cards = STORY_FEATURE_CARDS[key].map(name=>'<img src="assets/'+name+'.webp" alt="'+c.name+'特色牌">').join('');
  $('panel').innerHTML =
    '<div class="story-head"><img class="avatar" src="'+c.av+'" alt=""><div><h3>'+c.name+'</h3>' +
    '<p>已解锁 '+storyUnlockedFor(key)+' / 3 篇 · 已击败 '+storyDefeatCount(key)+' 次 · 残局总星 '+totalStars()+' / 30</p></div></div>' +
    '<div class="story-cards">'+cards+'</div>' + pieces +
    '<div class="story-actions"><button class="ghost" onclick="showStoryCodex(\''+storyReturn+'\')">返回图鉴</button>' +
    '<button class="ghost" onclick="closeStoryCodex()">'+(storyReturn==='game'?'返回对局':'返回场次选择')+'</button></div>';
  $('overlay').classList.add('show');
}
function closeStoryCodex(){
  if(storyReturn==='game' && G && !G.over){
    setPanelClass();
    $('overlay').classList.remove('show');
  } else {
    showModeSelect();
  }
}

/* ================= v0.9: 联机茶局房(客户端) =================
   后端见 ../后端/: Cloudflare Workers + Durable Objects, 服务端权威判定。
   联机时本页只是客户端: 对局状态完全由服务端 state 消息驱动, 映射进 G 镜像后
   复用单机的桌面渲染(renderAll/renderHand/renderZones 等)与选牌交互;
   本地引擎只用来给「提示」算候选(自己的手牌已知, 口径与单机相同),
   出牌是否合法一律以服务端回执为准。
   【长辈模式 与 联机"长辈友好" 的关系】
   - 本地 elderMode(长辈模式) 是个人显示偏好: 大字、大牌、慢节奏, 只影响自己这台
     设备, 单机与联机都生效(elderContext 在联机对局时置为 'online', 不会被残局逻辑关掉)。
   - 联机房的 elderFriendly 是房主建房时定的房间规则: 服务端放慢 AI 出牌节奏、
     本玩法本来就没有出牌倒计时, 对全房三人生效。两者互相独立, 可以叠加。 */
const ONLINE_WS_BASE = 'wss://myskme-ddz.kaput-becklespinax-369.workers.dev';   // ← 部署后只改这一处, 如 'wss://myskme-ddz.<账号>.workers.dev'
const ON = {
  active: false,       // 是否在联机流程中(面板/大厅/对局)
  inGame: false,       // 是否已进入联机对局(非大厅)
  ws: null, code: '', token: '', seat: -1,
  state: null,         // 最近一份服务端 state 快照
  intentional: false,  // 主动关闭连接时置真, 抑制自动重连
  expectResume: false, // 本次连接是回座尝试(被拒时回到联机面板)
  reconnects: 0,
  nick: '',
};
function onEsc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function onlStatus(t){ const el = $('onlStatus'); if (el) el.textContent = t || ''; }

function showOnlinePanel(prefill){

    '<div class="onl-block"><b>建一个新房间</b>' +

    '<button class="primary" onclick="onJoinRoom()">加入</button></div>' +
    '<div class="onl-status" id="onlStatus"></div>' +
    '<button class="ghost" onclick="showModeSelect()">返回场次选择</button>';
  $('overlay').classList.add('show');

function onReadNick(){
  const v = ($('onlNick') && $('onlNick').value || '').trim();
  ON.nick = v || '牌友';
  localStorage.setItem('myskme_ddz_nick', ON.nick);
  return ON.nick;
}
function onCreateRoom(){
  onReadNick();
  const mode = $('onlMode').value === 'laizi' ? 'laizi' : 'classic';
  const elderFriendly = !!$('onlElder').checked;
  onlStatus('正在连接联机服务…');
  onConnect('/ws/new', { type: 'create', nickname: ON.nick, mode, elderFriendly });
}
function onJoinRoom(){
  onReadNick();
  const code = (($('onlCode') && $('onlCode').value) || '').trim().toUpperCase();
  if (!/^[A-HJ-NP-Z2-9]{6}$/.test(code)){ onlStatus('房码是 6 位字母和数字，核对一下再试'); return; }
  onlStatus('正在连接联机服务…');
  onConnect('/ws/' + code, { type: 'join', nickname: ON.nick });
}
function onConnect(path, hello){
  if (ON.ws){ ON.intentional = true; try { ON.ws.close(); } catch (e) {} ON.ws = null; }
  ON.intentional = false;
  ON.expectResume = hello.type === 'resume';
  let ws;
  try { ws = new WebSocket(ONLINE_WS_BASE + path); }
  catch (e) { onConnectFail(); return; }
  ON.ws = ws;
  let opened = false;
  ws.onopen = () => { opened = true; ON.reconnects = 0; ws.send(JSON.stringify(hello)); };
  ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } onWsMessage(m); };
  ws.onerror = () => {};
  ws.onclose = () => {
    if (ON.ws !== ws || ON.intentional) return;
    ON.ws = null;
    if (!opened && !ON.active){ onConnectFail(); return; }
    if (ON.active) onScheduleReconnect();
  };
}
function onConnectFail(){
  onlStatus('联机服务暂时连不上。本地预览要先启动后端（在 后端 目录运行 npm run local），正式版会指向线上地址。单机场次不受影响，可以先玩单机。');
  centerMsg('联机服务连不上', '可以先玩单机');
}
function onScheduleReconnect(){
  if (ON.reconnects >= 15){ centerMsg('连接断了', '重连不上，点「新对局」回主菜单'); return; }
  ON.reconnects++;
  centerMsg('连接断了', '正在自动重连…（第 ' + ON.reconnects + ' 次）');
  const bar = $('actionBar');
  if (bar && ON.inGame) bar.innerHTML = '<span class="turntip">连接断了，正在重连…</span>';
  setTimeout(() => {
    if (!ON.active || ON.intentional) return;
    onConnect('/ws/' + ON.code, { type: 'resume', token: ON.token });
  }, 2000);
}
function onWsMessage(m){
  if (m.type === 'created' || m.type === 'joined'){
    ON.code = m.code; ON.token = m.token; ON.seat = m.seat; ON.active = true; ON.reconnects = 0;
    return;
  }
  if (m.type === 'resumed'){
    ON.code = m.code; ON.seat = m.seat; ON.active = true; ON.expectResume = false;
    centerMsg('已回到牌局', '');
    return;
  }
  if (m.type === 'error'){
    if (ON.expectResume){
      ON.expectResume = false;
      onLeaveRoom(true);
      showOnlinePanel();
      onlStatus(m.msg);
      return;
    }
    if (ON.inGame){
      centerMsg(m.msg, '');
      if (ON.state) applyOnlineGameState(ON.state);   // 回滚到服务端快照: 恢复操作区与选牌
    } else onlStatus(m.msg);
    return;
  }
  if (m.type === 'event'){ onWsEvent(m); return; }
  if (m.type === 'state'){ ON.state = m; onApplyState(m); }
}
function onWsEvent(m){
  if (!ON.inGame || !G) return;
  const disp = s => (s - ON.seat + 3) % 3;
  if (m.event === 'play' && m.info && isBombLike(m.info))
    fxText(m.info.type === 'rocket' ? '王 炸' : (m.info.soft ? '软 炸' : '炸 弹'));
  else if (m.event === 'bid'){
    const ds = disp(m.seat);
    if (ds !== 0) say(ds, m.value > 0 ? m.value + ' 分！' : '不叫');
  }
  else if (m.event === 'redeal') centerMsg('无人叫分', '重新发牌…');
}
function onApplyState(st){
  if (!ON.active) return;
  if (st.phase === 'lobby'){ ON.inGame = false; renderOnlineLobby(st); return; }
  ON.inGame = true;
  $('overlay').classList.remove('show');
  applyOnlineGameState(st);
}
function renderOnlineLobby(st){
  elderContext = 'menu';
  setPanelClass();
  const me = st.seats[ON.seat];
  const rows = st.seats.map(s => {
    const who = s.kind === 'empty' ? '空位（开局后 AI 补位）' : (s.kind === 'ai' ? onEsc(s.nickname) + '（AI）' : onEsc(s.nickname));
    const tags = [s.host ? '房主' : '', s.seat === ON.seat ? '你' : '', s.kind === 'human' ? (s.connected ? '在线' : '已断线') : '', s.kind === 'human' && s.ready ? '已准备' : ''].filter(Boolean).join(' · ');

  }).join('');

  $('overlay').classList.add('show');
  ON.inviteLink = link;

function onCopyInvite(){

/* 服务端 state -> G 镜像(显示坐标: 自己恒为 0 号位, 下家 1 号=右, 上家 2 号=左), 复用单机渲染 */
function applyOnlineGameState(st){
  const g = st.game;
  if (!g) return;
  const disp = s => (s - ON.seat + 3) % 3;
  const srv = d => (ON.seat + d) % 3;
  elderContext = 'online';
  applyElderMode();
  setLaizi(st.config.mode === 'laizi' ? (g.laiziVal || 0) : 0);
  const placeholder = n => Array.from({ length: n }, () => ({ v: 0, s: '背' }));
  window._gid = (window._gid || 0) + 1;
  G = {
    gid: window._gid, online: true,
    mode: st.config.mode, laiziVal: g.laiziVal || 0,
    phase: st.phase === 'settled' ? 'over' : st.phase,
    hands: [st.you.hand.slice(), placeholder(g.counts[srv(1)]), placeholder(g.counts[srv(2)])],
    dipai: g.dipai ? g.dipai.slice() : [{ v: 0, s: '背' }, { v: 0, s: '背' }, { v: 0, s: '背' }],
    aiChar: [null,
      st.seats[srv(1)].kind === 'ai' ? st.seats[srv(1)].charKey : null,
      st.seats[srv(2)].kind === 'ai' ? st.seats[srv(2)].charKey : null],
    landlord: g.landlord >= 0 ? disp(g.landlord) : -1,
    base: g.base, mult: g.mult, bombs: g.bombs,
    turn: disp(g.turn),
    lastPlay: g.lastPlay ? { cards: g.lastPlay.cards.slice(), info: g.lastPlay.info } : null,
    lastOwner: g.lastOwner >= 0 ? disp(g.lastOwner) : -1,
    passStreak: 0, selfPass: [0, 0, 0], playsCount: [0, 0, 0],
    playedCount: g.playedCount || {},
    playsBySide: { landlord: 0, farmer: 0 },
    selected: new Set(), over: st.phase === 'settled',
  };
  lastShown[0] = lastShown[1] = lastShown[2] = null;
  g.zones.forEach((z, s) => { if (z) lastShown[disp(s)] = z.pass ? { pass: true } : { cards: z.cards.slice() }; });
  const sR = st.seats[srv(1)], sL = st.seats[srv(2)];
  if (sR.charKey){ $('avR').src = CHARS[sR.charKey].av; $('nmR').textContent = sR.nickname; }
  if (sL.charKey){ $('avL').src = CHARS[sL.charKey].av; $('nmL').textContent = sL.nickname; }
  $('uiBase').textContent = g.base ? g.base + ' 分' : '—';
  $('uiMode').textContent = '联机 · ' + (st.config.mode === 'laizi' ? '癞子场' : '经典场');
  const noteEl = $('modeNote');
  noteEl.textContent = st.config.mode === 'laizi'
    ? '联机癞子场：癞子点 ' + rankName(g.laiziVal) + '，规则与单机癞子场一致，出牌由服务端判定。'
    : '联机茶局房：出牌由服务端判定；断线会自动重连，空位由 AI 补位。';
  noteEl.classList.add('show');
  $('dipai').style.display = '';
  renderDipai(g.landlord >= 0);
  renderAll();

function renderOnlineBid(st){
  const bar = $('actionBar');

    const btn = document.createElement('button');
    btn.textContent = lab;
    if (v === 3) btn.className = 'primary';
    btn.disabled = v > 0 && v <= b.highest;
    btn.onclick = () => {
      bar.innerHTML = '<span class="turntip">已提交，等其他人叫分…</span>';

function renderOnlinePlayBar(st){
  const bar = $('actionBar');
  bar.innerHTML = '';
  const g = st.game;
  hintIdx = 0;
  if (g.turn !== ON.seat){
    const who = st.seats[g.turn];
    bar.innerHTML = '<span class="turntip">等 ' + onEsc(who.nickname) + ' 出牌…</span>' +
      (who.kind === 'human' && !who.connected ? '<span class="turntip">（对方已断线，AI 托管中）</span>' : '');
    return;
  }
  const last = (G.lastOwner === 0 || G.lastOwner < 0) ? null : G.lastPlay;
  const tip = document.createElement('span');
  tip.className = 'turntip';
  tip.textContent = last ? '轮到你出牌' : '由你首出，点选手牌后出牌';
  bar.appendChild(tip);
  const bHint = document.createElement('button'); bHint.className = 'ghost'; bHint.textContent = '提示';
  const bPlay = document.createElement('button'); bPlay.className = 'primary'; bPlay.textContent = '出牌'; bPlay.id = 'btnPlay'; bPlay.disabled = true;
  const bPass = document.createElement('button'); bPass.textContent = '不出'; bPass.disabled = !last;
  bHint.onclick = () => {
    const cand = getPlayerHintCandidates(last);
    if (!cand.length){ centerMsg('没有能管上的牌', '点「不出」过掉这一手'); return; }
    const p = cand[hintIdx % cand.length]; hintIdx++;
    G.selected = new Set(p.cards.map(c => G.hands[0].indexOf(c)));
    renderHand();
    bPlay.disabled = G.selected.size === 0;
  };
  bPlay.onclick = () => {
    const cards = [...G.selected].sort((a, b) => a - b).map(i => G.hands[0][i]);
    if (!cards.length) return;
    if (ON.ws) ON.ws.send(JSON.stringify({ type: 'play', cards: cards.map(c => ({ v: c.v, s: c.s })) }));
    G.selected.clear();
    bar.innerHTML = '<span class="turntip">已出牌，等其他人…</span>';
  };
  bPass.onclick = () => {
    if (ON.ws) ON.ws.send(JSON.stringify({ type: 'pass' }));
    bar.innerHTML = '<span class="turntip">已过，等其他人…</span>';
  };
  bar.append(bHint, bPlay, bPass);
}

/* ---------- v0.5: 残局分享挑战 ----------
   链接参数: challenge=关卡序号(1 起), stars=好友星数, plays=好友手数。
   带参打开只生成一次性 pendingChallenge: 直达关卡、绕过选关锁定, 本局不写残局存档。 */
function parseChallengeParams(){
  try{
    const p = new URLSearchParams(window.location.search || '');
    if(!p.has('challenge')) return null;
    const levelNum = Number(p.get('challenge'));
    const stars = Number(p.get('stars'));
    const plays = Number(p.get('plays'));
    if(!Number.isInteger(levelNum) || levelNum<1 || levelNum>LEVELS.length) return null;
    if(!Number.isInteger(stars) || stars<1 || stars>3) return null;
    if(!Number.isInteger(plays) || plays<1 || plays>999) return null;
    return {idx: levelNum-1, stars, plays};
  }catch(e){ return null; }
}

function buildChallengeLink(idx, stars, plays){
  const url = new URL(window.location.href);
  url.searchParams.set('challenge', String(idx+1));
  url.searchParams.set('stars', String(stars));
  url.searchParams.set('plays', String(plays));
  url.hash = '';
  return url.toString();
}
async function shareChallenge(idx, stars, plays){
  const link = buildChallengeLink(idx, stars, plays);
  const out = $('shareResult');
  if(!out) return;
  if(typeof navigator !== 'undefined' && navigator.clipboard && typeof navigator.clipboard.writeText === 'function'){
    try{
      await navigator.clipboard.writeText(link);
      out.textContent = '链接已复制，快发给朋友挑战吧。';
      return;
    }catch(e){ /* 剪贴板不可用时走下方手动复制 */ }
  }
  const safe = link.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  out.innerHTML = '自动复制没有成功，请手动复制这条链接：<div class="share-link">'+safe+'</div>';
}
function challengeCompareText(link, stars, plays, playerWin){
  if(!link) return '';
  const mine = stars+' 星 · '+plays+' 手';
  const theirs = link.stars+' 星 · '+link.plays+' 手';
  if(!playerWin) return '挑战结果：好友以 '+theirs+'过关，你这次还没过关，好友守住了这次挑战。';
  if(stars>link.stars || (stars===link.stars && plays<link.plays))
    return '挑战成功：你以 '+mine+'过关，超过了好友的 '+theirs+'。';
  if(stars===link.stars && plays===link.plays)
    return '挑战打平：你和好友都是 '+theirs+'过关。';
  return '还差一点：你以 '+mine+'过关，好友的成绩是 '+theirs+'，这次好友获胜。';
}

function finishChallenge(winnerSeat){
  setPanelClass();
  const lv = LEVELS[G.challengeIdx];
  const link = G.linkChallenge || null;
  const playerWin = roleOf(winnerSeat) === roleOf(0);
  const myPlays = G.playsCount[0];
  let stars = 0;
  if(playerWin){
    stars = myPlays<=lv.best ? 3 : (myPlays<=lv.best+1 ? 2 : 1);
    if(!link && stars > (challenge.stars[G.challengeIdx]||0)){ challenge.stars[G.challengeIdx] = stars; saveChallenge(); }
  }
  renderAll();
  let desc;
  if(playerWin){
    desc = (winnerSeat===0 ? '你率先出完' : '队友 '+CHARS[G.aiChar[winnerSeat]].name+' 率先出完') +
      ' · 你共出牌 '+myPlays+' 手（最优 '+lv.best+' 手）';
  } else {
    desc = CHARS[G.aiChar[winnerSeat]].name+' 率先出完 · 调整打法，重开本关再战';
  }
  const compare = challengeCompareText(link, stars, myPlays, playerWin);
  let btns = '';
  if(playerWin) btns += '<button class="primary" onclick="shareChallenge('+G.challengeIdx+','+stars+','+myPlays+')">把这关发给朋友挑战</button> ';
  btns += '<button class="primary" onclick="startLevel('+G.challengeIdx+')">重开本关</button> ';
  if(playerWin && !link && G.challengeIdx < LEVELS.length-1) btns += '<button class="primary" onclick="startLevel('+(G.challengeIdx+1)+')">下一关</button> ';

  $('panel').innerHTML =
    '<h2 class="'+(playerWin?'':'lose')+'">'+(playerWin?'过 关':'闯关失败')+'</h2>'+
    '<div class="lvstars big">'+starStr(stars)+'</div>'+
    '<div class="who-win">'+desc+'</div>'+
    (compare ? '<div class="challenge-compare">'+compare+'</div>' : '')+
    btns+
    (playerWin ? '<div class="share-result" id="shareResult"></div>' : '')+

}
