<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MYSKME Lab · 原型试验田</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#0d0b08;color:#e8dcc3;font-family:"PingFang SC","Microsoft YaHei",serif;min-height:100vh;padding:24px 16px 48px}
  .wrap{max-width:640px;margin:0 auto}
  header{text-align:center;padding:32px 0 8px}
  header .mark{font-size:15px;letter-spacing:6px;color:#b08d4a}
  h1{font-size:26px;letter-spacing:4px;color:#f0e2bd;margin:10px 0 6px;font-weight:600}
  .sub{font-size:13px;color:#8a7a5c;letter-spacing:1px}
  .rule{height:1px;background:linear-gradient(90deg,transparent,#b08d4a,transparent);margin:22px 0}
  .card{display:block;background:#161310;border:1px solid #3a2f1e;border-radius:14px;padding:20px;margin-bottom:16px;text-decoration:none;color:inherit;transition:border-color .2s}
  .card:active{border-color:#b08d4a}
  .card .tag{display:inline-block;font-size:11px;color:#0d0b08;background:#b08d4a;border-radius:20px;padding:2px 10px;letter-spacing:2px;margin-bottom:10px}
  .card h2{font-size:19px;color:#f0e2bd;letter-spacing:2px;margin-bottom:8px}
  .card p{font-size:13.5px;color:#a89878;line-height:1.8}
  .card .go{margin-top:12px;font-size:13px;color:#d4a94e;letter-spacing:2px}
  footer{text-align:center;margin-top:36px;font-size:12px;color:#6b5f45;letter-spacing:1px;line-height:2}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">MYSKME</div>
    <h1>原型试验田</h1>
    <div class="sub">狼先生工作室 · 小游戏原型验证</div>
  </header>
  <div class="rule"></div>

  <a class="card" href="./xingchen-dalao/">
    <span class="tag">休闲 · v0.1</span>
    <h2>星尘打捞</h2>
    <p>挖金矿式单屏休闲小游戏。摇摆钩子，点击放钩，捞星尘、灯猫的小灯与金叶徽章，避开雾团。60 秒，看能捞多少分。</p>
    <div class="go">开始试玩 →</div>
  </a>

  <a class="card" href="./shouye-denghuo/">
    <span class="tag">叙事 · v0.5</span>
    <h2>守夜灯火</h2>
    <p>谷地守夜人题材叙事原型。夜观异象、判词推理、求签问卜、雾中呓语——六更守夜，一灯长明。</p>
    <div class="go">开始试玩 →</div>
  </a>

  <footer>
    MYSKME · make yourself special and kind<br>
    原型均为单文件离线可玩 · 手机扫码即玩
  </footer>
</div>
</body>
</html>
