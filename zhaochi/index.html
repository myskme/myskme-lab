<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>寻珍大亨 v0.5 | MYSKME</title>
<style>
:root{--p:#C9A86A;--blu:#7A9BB5;--mint:#A8E6CF;--lav:#C3B2E8;--peach:#FFD8B8;--gold:#E8B84B;--ink:#5A4A42;--bg:#FFF9F5;--card:#fff;--sh:0 4px 18px rgba(201,168,106,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
html,body{height:100dvh;overflow:hidden;overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;height:100dvh;max-height:100dvh;overflow:hidden;padding:10px;display:flex;flex-direction:column}
.scr{display:none}.scr.on{display:flex;flex-direction:column;height:100%;overflow:hidden;min-height:0;animation:fade .25s}
.scroll-inner{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.scr .top{flex:none}
#s-game .pics{flex:1;min-height:0}
#s-game .gbar,#s-game .row{flex:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 2px}
.top b{font-size:20px}
.sd{background:#fff;border-radius:999px;padding:6px 14px;box-shadow:var(--sh);font-weight:700}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px;margin:8px 0}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:14px;margin:10px 0;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,#C9A86A,#E8B84B);box-shadow:var(--sh);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.mint{background:linear-gradient(135deg,var(--mint),#d6f5e6)}
.btn.lav{background:linear-gradient(135deg,var(--blu),#d8e8f2)}
.btn.ghost{background:#fff;border:2px solid var(--p)}
.row{display:flex;gap:10px}.row .btn{margin:6px 0}
.pill{display:inline-block;background:#fff;border-radius:999px;padding:4px 12px;margin:2px;box-shadow:var(--sh);font-size:13px}
.bar{height:12px;background:#f3e7df;border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7BA08B,var(--gold));border-radius:99px;transition:width .4s}
.gbar{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:10px 14px;margin:8px 0;font-size:15px;font-weight:700;position:sticky;top:0;z-index:5}
.pics{display:flex;flex-direction:column;gap:10px}
@media(min-width:820px) and (orientation:landscape){.pics{flex-direction:row}.pics .pdiv{display:none}#app{max-width:1060px}}
.pic{position:relative;flex:1;border-radius:16px;overflow:hidden;box-shadow:var(--sh),0 0 0 2px rgba(232,184,75,.35);cursor:pointer;line-height:0}
.pic img{width:100%;display:block;pointer-events:none}
.tag{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);border-radius:99px;padding:4px 14px 4px 5px;font-size:14px;font-weight:700;line-height:1.6;z-index:2;display:flex;align-items:center}
.tag .n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--gold));color:#fff;font-size:12px;margin-right:4px}
.pdiv{display:flex;align-items:center;gap:10px;margin:2px 4px;color:#b99f8d;font-size:13px;font-weight:700}
.pdiv:before,.pdiv:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,#f3d9c8,transparent);border-radius:2px}
.mk{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
.mk svg{width:100%;height:100%;display:block;overflow:visible}
.mk circle{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;stroke-dasharray:283;stroke-dashoffset:283;animation:draw .55s ease-out forwards}
.mk.hint circle{stroke:var(--p);stroke-dasharray:16 12;animation:draw .55s ease-out forwards,hintp 1.8s .6s infinite}
.mk.ans circle{stroke:#ff8a8a}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes hintp{50%{opacity:.5}}
.rip{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid #d8c9bd;pointer-events:none;z-index:3;animation:rip .65s ease-out forwards}
@keyframes rip{from{transform:scale(.35);opacity:.95}to{transform:scale(1.6);opacity:0}}.zoomtag{position:absolute;right:8px;top:8px;z-index:4;background:rgba(255,255,255,.94);border:1px solid #F5E6DC;border-radius:99px;padding:6px 14px;font-size:14px;font-weight:700;color:#5A4A42}#zoom{position:fixed;inset:0;z-index:99;display:none;background:rgba(43,32,26,.94);overflow:auto;-webkit-overflow-scrolling:touch}#zoom.on{display:block}#zoom .pic{width:170%;max-width:720px;flex:none;margin:14px auto}#zoom .pic img{width:100%}#zoom .zoomtag{display:none}.zth{position:sticky;bottom:12px;text-align:center;color:#fff;font-size:15px;font-weight:700;background:rgba(43,32,26,.7);border-radius:99px;padding:8px 16px;width:max-content;margin:0 auto}
.slot{display:inline-block;width:46px;height:46px;line-height:46px;text-align:center;border-radius:50%;background:#f3e7df;margin:4px;font-weight:800;color:#b9a89e;font-size:18px}
.slot.hit{background:var(--mint);color:var(--ink);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.35)}}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:900;color:#e8a13b;font-size:18px;pointer-events:none;z-index:4;animation:up 1s forwards}
@keyframes up{to{transform:translate(-50%,-160%);opacity:0}}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(90,74,66,.92);color:#fff;padding:10px 20px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;max-width:86%;text-align:center}
#modal{position:fixed;inset:0;background:rgba(90,74,66,.45);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:24px;padding:24px 20px;max-width:380px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.18);animation:drop .5s cubic-bezier(.2,1.3,.4,1);max-height:84vh;overflow:auto}
@keyframes drop{from{transform:translateY(-48px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.mbox h3{margin:6px 0 10px}
.shake{animation:shk .5s}
@keyframes shk{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg) scale(1.05)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
.flash{animation:fl .5s}
@keyframes fl{0%{filter:brightness(1)}50%{filter:brightness(2.2)}100%{filter:brightness(1)}}
.jit{animation:jit .3s}
@keyframes jit{25%{transform:translate(2px,-2px)}50%{transform:translate(-2px,2px)}75%{transform:translate(2px,2px)}}
.big{font-size:44px;margin:4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.cell{background:#fff;border-radius:14px;padding:8px 4px;text-align:center;box-shadow:var(--sh);font-size:12px;position:relative}
.cell .e{font-size:26px}
.cell.lock{filter:grayscale(1);opacity:.55}
.cell .st{color:var(--gold);font-size:11px;font-weight:800}
.bond{border:2px dashed var(--gold);border-radius:14px;padding:8px;margin:8px 0;font-size:13px}
.small{font-size:13px;color:#a68d80}
.stars{color:var(--gold);font-size:26px;letter-spacing:2px}
h2.st{margin:8px 0}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.ic{width:1.15em;height:1.15em;vertical-align:-.22em}.big .ic{width:64px;height:64px;color:var(--gold)}.mg{display:inline-flex;align-items:center;justify-content:center;min-width:2.2em;height:2.2em;padding:0 .4em;border-radius:999px;background:linear-gradient(135deg,#C9A86A,#E8B84B);color:#fff;font-weight:800;font-size:.95em;vertical-align:middle}.cell .mg{width:44px;height:44px;padding:0;font-size:20px;border-radius:50%}.mg.hid{background:linear-gradient(135deg,#7A9BB5,#5a7d99);color:#fff}.mg.q{background:#f3e7df;color:#b9a89e}.bdg{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#f8dc8f,#E8B84B);color:#5a3d1e;font-size:36px;box-shadow:0 6px 18px rgba(232,184,75,.45)}.bdg.dim{background:#e8ddd4;color:#a68d80;box-shadow:none}#b-mute.off{opacity:.55}.okk{color:var(--gold);font-weight:800}.noo{color:#d8c9bd;font-weight:800}.seriesBadge{display:inline-flex;align-items:center;gap:4px;background:#C9A86A;color:#4A2E12;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25);vertical-align:middle}
.seriesBadge svg{width:13px;height:13px;flex:none}
.eggBonus{position:absolute;width:30px;height:34px;z-index:5;cursor:pointer;animation:eggPulse 2s ease-in-out infinite}
@keyframes eggPulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.12);opacity:1}}
.snakeFlash{position:absolute;top:32%;left:-90px;width:78px;z-index:6;cursor:pointer;animation:snakeSlide 1.6s linear forwards}
.fisheye .pic img{transform:scale(1.07);border-radius:46%;filter:saturate(1.2) brightness(1.05)}
.fisheye .pic{transition:all .4s}
.mk.soft{opacity:.32}
.donkeyVisit{position:absolute;width:64px;height:56px;z-index:6;cursor:pointer;animation:donkBob 1s ease-in-out infinite}
@keyframes donkBob{50%{transform:translateY(-6px)}}
.snakeTipArrow{position:absolute;z-index:7;font-weight:900;font-size:30px;color:#E8B84B;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.3);animation:tipPulse 1s ease-in-out infinite}
@keyframes tipPulse{50%{transform:scale(1.25)}}
.famPick{outline:3px solid var(--gold)}
@keyframes snakeSlide{from{left:-90px}to{left:110%}}
</style>
</head>
<body>
<div id="app">
<!-- 首页 -->
<div class="scr" id="s-home">
  <div class="top"><div><b>寻珍大亨</b> <span class="small">v0.5</span></div><div class="sd"><span class="seriesBadge"><svg viewBox="0 0 24 24"><path d="M12 5C8 5 5 8.5 5 12.5 5 17 8.5 20.5 12 20.5s7-3.5 7-8C19 8.5 16 5 12 5z" fill="#FFB27D"/><path d="M12 5c.5 2.5-.5 5-2.5 6.5" stroke="#8A5A2B" stroke-width="1.2" fill="none" stroke-linecap="round"/><path d="M12.5 4.5c2-1.2 4-1 5 .5-.8 1.2-2.8 1.4-5-.5z" fill="#7CB342"/></svg>猴先生系列</span>★<span id="h-sd">0</span></div></div><div class="scroll-inner">
  <div class="card"><div class="kv"><span id="h-lv">Lv.1</span><span class="small" id="h-xp"></span></div><div class="bar"><i id="h-xpbar" style="width:0%"></i></div>
  <div class="kv"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> 图鉴 <span id="h-prog">0/15</span></span><span class="small" id="h-bond"></span></div><div class="bar"><i id="h-progbar" style="width:0%"></i></div><div class="kv"><span>蛋的委屈值</span><span class="small" id="h-vex">0/3</span></div><div class="small" style="text-align:center">v0.5 · 茶肆八事：点单/赊账本/蛇指路/蛋委屈/秒回挑战/鱼眼/打烊/全家福</div></div>
  <div class="card" id="buddy"></div>
  <div class="row" style="margin:4px 0"><button class="btn ghost" id="lv0" style="flex:1">云巅学宫</button><button class="btn ghost" id="lv1" style="flex:1">天之国</button><button class="btn ghost" id="lv2" style="flex:1">雾隐茶肆</button></div>
  <div class="row" style="margin:4px 0"><button class="btn lav" id="b-daily" style="flex:1">每日挑战</button><button class="btn lav" id="b-speed" style="flex:1">秒回挑战</button></div>
  <button class="btn" id="b-start">开始寻珍</button>
  <div class="row"><button class="btn mint" id="b-box"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg> 盲盒</button><button class="btn lav" id="b-album"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> 集卡册</button></div>
  <div class="row"><button class="btn ghost" id="b-mute" style="font-size:14px"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg> <span id="b-mute-t">音效开</span></button><button class="btn ghost" id="b-week" style="font-size:14px"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg> 每周任务</button></div>
</div></div>
<!-- 游戏 -->
<div class="scr" id="s-game">
  <div class="gbar"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><b id="g-t">120</b>s</span><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><b id="g-f">0/5</b></span><span id="g-sh"></span><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg><b id="g-h">3</b></span><span class="seriesBadge"><svg viewBox="0 0 24 24"><path d="M12 5C8 5 5 8.5 5 12.5 5 17 8.5 20.5 12 20.5s7-3.5 7-8C19 8.5 16 5 12 5z" fill="#FFB27D"/><path d="M12 5c.5 2.5-.5 5-2.5 6.5" stroke="#8A5A2B" stroke-width="1.2" fill="none" stroke-linecap="round"/><path d="M12.5 4.5c2-1.2 4-1 5 .5-.8 1.2-2.8 1.4-5-.5z" fill="#7CB342"/></svg>猴先生系列</span></div>
  <div class="small" style="text-align:center;margin:6px" id="g-name"></div>
  <div class="pics">
    <div class="pic" id="p0"><span class="tag"><b class="n">1</b>原图</span><button class="zoomtag" onclick="zoomPic(0,event)">放大</button><img id="i0" alt=""></div>
    <div class="pdiv"><span id="pdiv-t">上下对照 · 找出 5 处不同</span></div>
    <div class="pic" id="p1"><span class="tag"><b class="n">2</b>找不同</span><button class="zoomtag" onclick="zoomPic(1,event)">放大</button><img id="i1" alt=""></div>
  </div>
  <div style="text-align:center;margin:8px 0" id="slots"></div>
  <div class="row"><button class="btn mint" id="b-hint"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg> 提示</button><button class="btn mint" id="b-fish">鱼眼</button><button class="btn ghost" id="b-re"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> 重来</button><button class="btn ghost" id="b-home"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></button></div>
</div>
<!-- 结算 -->
<div class="scr" id="s-over"><div class="card" style="text-align:center" id="over-box"></div></div>
<!-- 盲盒 -->
<div class="scr" id="s-box">
  <div class="top"><div><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg><b>星语盲盒</b></div><div class="sd">★<span id="x-sd">0</span></div></div><div class="scroll-inner">
  <div class="card" style="text-align:center"><div class="big" id="box-emoji"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg></div><div id="box-msg" class="small">单抽 50 星尘 · 每局结算送 1 次免费抽</div>
  <div class="kv"><span>免费抽</span><b id="x-free">0</b></div>
  <div class="kv"><span>保底进度</span><b id="x-pity">0/10</b></div></div>
  <button class="btn" id="b-draw">抽一次 · 50★</button>
  <button class="btn mint" id="b-drawf">免费抽一次</button>
  <div class="card"><b><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h2.996A5.002 5.002 0 0 0 22 12c0-5.5-4.5-10-10-10z"/></svg> 主题色</b><div id="themes" class="small" style="margin-top:6px"></div></div>
  <button class="btn ghost" id="b-boxhome"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg> 返回</button>
</div></div>
<!-- 集卡册 -->
<div class="scr" id="s-album">

else{T(700,0,.1)}}

/* ===== 每日挑战 ===== */
var DPOOL=[
[0.82,0.18,0.055,0],[0.179,0.43,0.05,0],[0.308,0.681,0.05,1],[0.492,0.778,0.04,0],
[0.121,0.733,0.045,1],[0.15,0.15,0.05,2],[0.226,0.589,0.045,1],[0.458,0.80,0.04,0],
[0.312,0.33,0.05,1],[0.90,0.80,0.055,0],[0.65,0.30,0.05,2],[0.40,0.90,0.045,3]];
function h32(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mbr(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dailyPick(){
  var r=mbr(h32("zc-d"+today())),pool=DPOOL.slice(),pk=[];
  var guard=0;
  while(pk.length<5&&pool.length&&guard++<200){
    var c=pool.splice(Math.floor(r()*pool.length),1)[0],ok=true;
    for(var j=0;j<pk.length;j++){var dx=c[0]-pk[j][0],dy=c[1]-pk[j][1];if(dx*dx+dy*dy<0.0256){ok=false;break}}
    if(ok)pk.push(c);
  }
  return pk;
}
function buildDaily(base,ds,cb){
  var w=base.naturalWidth,h=base.naturalHeight,c=document.createElement("canvas");
  c.width=w;c.height=h;var x=c.getContext("2d");x.drawImage(base,0,0);
  ds.forEach(function(df){
    var px=df[0]*w,py=df[1]*h,pr=df[2]*w;
    if(df[3]===0){var sx=px+pr*2.4;if(sx+pr*2>w)sx=px-pr*4.4;if(sx-pr<0)sx=px+pr*2.4;
      x.drawImage(base,sx-pr,py-pr,pr*2,pr*2,px-pr,py-pr,pr*2,pr*2);}
    else if(df[3]===1){var id=x.getImageData(Math.max(0,px-pr|0),Math.max(0,py-pr|0),pr*2|0,pr*2|0),dd=id.data;
      for(var i=0;i<dd.length;i+=4){var rr=dd[i];dd[i]=dd[i+2];dd[i+2]=dd[i+1];dd[i+1]=rr;}
      x.save();x.beginPath();x.arc(px,py,pr,0,7);x.clip();x.putImageData(id,Math.max(0,px-pr|0),Math.max(0,py-pr|0));x.restore();}
    else if(df[3]===2){var g=x.createRadialGradient(px,py,pr*0.15,px,py,pr);
      g.addColorStop(0,"rgba(255,250,222,1)");g.addColorStop(0.55,"rgba(255,244,200,.85)");g.addColorStop(1,"rgba(255,244,200,0)");
      x.fillStyle=g;x.beginPath();x.arc(px,py,pr,0,7);x.fill();}
    else{x.fillStyle="#9aa0ae";x.beginPath();x.arc(px,py,pr*0.55,0,7);x.fill();
      x.fillStyle="rgba(255,255,255,.35)";x.beginPath();x.arc(px-pr*0.2,py-pr*0.2,pr*0.18,0,7);x.fill();}
  });
  cb(c.toDataURL("image/webp",0.82));
}
function startDaily(){
  var pk=dailyPick(),base=new Image();
  base.onload=function(){
    buildDaily(base,pk,function(url){
      G_={lv:-1,daily:true,dd:pk,found:pk.map(function(){return false}),time:120,t0:120,miss:0,combo:0,shield:false,bonus:0,hints:3+(LV.lv>=2?1:0)+(BU&&buddyLv()>=2?1:0),over:false,timer:null,fishUsed:false,eggStrike:false,teaPuer:false};
      LP=today();save();
      $("g-name").textContent="每日挑战 · 雾隐茶肆（120 秒找 5 处不同）";
      $("pdiv-t").textContent="上下对照 · 找出 5 处不同";
      $("i0").src=IMG[4];$("i1").src=url;
      var sl=$("slots");sl.innerHTML="";for(var i=0;i<5;i++){var s=document.createElement("div");s.className="slot";s.id="slot"+i;s.textContent=i+1;sl.appendChild(s)}
      var ps=document.querySelectorAll(".pic");for(var k=0;k<ps.length;k++){ps[k].querySelectorAll(".mk,.float").forEach(function(m){m.remove()})}
      $("g-sh").textContent="";updG();show("s-game");
      clearInterval(G_.timer);
      G_.timer=setInterval(function(){G_.time--;if(G_.time<=0){G_.time=0;lose()}updG()},1000);
      toast(DY.date==today()?"今日已完成，再来一把纯练习":"上下对照，找出 5 处不同吧！今日奖励 +30★");
    });
  };
  base.src=IMG[4];
}

  var b=$("b-daily");if(!b)return;
  b.innerHTML=DY.date==today()?"每日挑战 · 已完成 ✓":"每日挑战 · 今日 +30★";
}
