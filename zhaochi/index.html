<style>
:root{--bg:#0b0a08;--panel:#14110c;--bronze:#b08d57;--gold:#f0c96a;--ink:#e8ddc4;--dim:#8a7c5f}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 10px 30px}
h1{font-size:20px;letter-spacing:6px;color:var(--gold);font-weight:600;margin:6px 0 2px}
.sub{font-size:11px;color:var(--dim);letter-spacing:3px;margin-bottom:10px}
.hud{display:flex;gap:10px;width:100%;max-width:1060px;margin-bottom:10px}
.hud .box{flex:1;background:var(--panel);border:1px solid #2b2318;border-radius:10px;padding:8px 4px;text-align:center}
.hud .lab{font-size:10px;color:var(--dim);letter-spacing:2px}
.hud .val{font-size:20px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.stage{display:flex;gap:10px;width:100%;max-width:1060px;justify-content:center}
.pic{position:relative;flex:1;max-width:520px;border:1px solid #2b2318;border-radius:10px;overflow:hidden;background:#000;cursor:crosshair;touch-action:manipulation}
.pic img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.pic .tag{position:absolute;top:8px;left:8px;font-size:11px;letter-spacing:2px;background:rgba(0,0,0,.55);color:var(--gold);border:1px solid var(--bronze);border-radius:6px;padding:3px 10px;pointer-events:none}
.mark{position:absolute;border:2px solid var(--gold);border-radius:50%;box-shadow:0 0 10px rgba(240,201,106,.8),inset 0 0 8px rgba(240,201,106,.5);pointer-events:none;transform:translate(-50%,-50%);animation:pop .35s ease}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.x{position:absolute;color:#ff6b5e;font-size:26px;font-weight:900;pointer-events:none;transform:translate(-50%,-50%);animation:fadeout .6s ease forwards;text-shadow:0 0 6px #000}
@keyframes fadeout{to{opacity:0;transform:translate(-50%,-60%)}}
.float{position:absolute;color:var(--gold);font-weight:700;font-size:15px;pointer-events:none;transform:translate(-50%,-50%);animation:rise 1s ease forwards;text-shadow:0 0 8px rgba(240,201,106,.9)}
@keyframes rise{to{opacity:0;transform:translate(-50%,-220%)}}
.slots{display:flex;gap:8px;margin:12px 0 4px}
.slot{width:34px;height:34px;border-radius:50%;border:1px dashed var(--bronze);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--dim)}
.slot.hit{border:1px solid var(--gold);color:var(--gold);background:rgba(240,201,106,.08)}
.toast{min-height:22px;font-size:13px;color:var(--bronze);letter-spacing:1px;margin-top:6px;text-align:center}
.btn{margin-top:14px;background:linear-gradient(180deg,#3a2f1c,#241c0e);color:var(--gold);border:1px solid var(--bronze);border-radius:10px;padding:12px 44px;font-size:16px;letter-spacing:4px;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(5,4,2,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex}
.card{background:var(--panel);border:1px solid var(--bronze);border-radius:14px;padding:28px 30px;text-align:center;max-width:340px}
.card h2{color:var(--gold);letter-spacing:4px;margin-bottom:10px;font-size:20px}
.card p{font-size:14px;color:var(--ink);line-height:1.9}
.card .big{font-size:34px;color:var(--gold);font-weight:800;margin:8px 0}
@media(max-width:700px){.stage{flex-direction:column;align-items:center}.pic{max-width:100%;width:100%}}
</style>
</head>

  document.getElementById('f').textContent=found.filter(Boolean).length+'/5';
}
function addMark(pic,x,y,cls,txt){
  var m=document.createElement('div');m.className=cls;
  m.style.left=(x*100)+'%';m.style.top=(y*100)+'%';if(txt)m.textContent=txt;pic.appendChild(m);
}
function sz(pic,i){
  var r=pic.getBoundingClientRect(), d=DIFFS[i], rad=d.r*r.width;
  var m=document.createElement('div');m.className='mark';
  m.style.left=(d.x*100)+'%';m.style.top=(d.y*100)+'%';
  m.style.width=m.style.height=(rad*2)+'px';pic.appendChild(m);
}
function hit(i,x,y){
  found[i]=true;missStreak=0;score+=100;
  document.getElementById('slot'+i).classList.add('hit');
  ['p0','p1'].forEach(function(id){var p=document.getElementById(id);sz(p,i);addMark(p,x,y,'float','+100');});
  toast(['好眼力!','正是此处!','一击即中!','火眼金睛!','漂亮!'][found.filter(Boolean).length-1]||'好眼力!');
  upd();check();
}
function miss(pic,x,y){
  missStreak++;score=Math.max(0,score-20);addMark(pic,x,y,'x','✕');upd();
  if(missStreak>=3){score=Math.max(0,score-30);missStreak=0;toast('连错三次，再扣 30 分 —— 定睛细看，再试一次');}
  else toast('这里两图一样，再找找');
}
function onTap(e){
  if(over)return;
  var pic=e.currentTarget, r=pic.getBoundingClientRect();
  var cx=e.clientX!==undefined?e.clientX:(e.touches&&e.touches[0].clientX);
  var cy=e.clientY!==undefined?e.clientY:(e.touches&&e.touches[0].clientY);
  var x=(cx-r.left)/r.width, y=(cy-r.top)/r.height;
  for(var i=0;i<DIFFS.length;i++){
    if(found[i])continue;var d=DIFFS[i];
    var dx=x-d.x, dy=(y-d.y)*(r.height/r.width);
    if(Math.sqrt(dx*dx+dy*dy)<=d.r*1.25){hit(i,x,y);return;}
  }
  miss(pic,x,y);
}
['p0','p1'].forEach(function(id){
  var p=document.getElementById(id);
  p.addEventListener('click',onTap);
});
function end(win){
  over=true;clearInterval(timer);
  var ov=document.getElementById('ov'),t=document.getElementById('ovt'),p=document.getElementById('ovp');
  document.getElementById('ovs').textContent=score;
  if(win){
    var title=timeLeft>=60?'明察秋毫':(timeLeft>=30?'火眼金睛':'细致入微');
    t.textContent='五处全中';p.innerHTML='称号:'+title+'<br>剩余 '+timeLeft+' 秒';
  }else{
    t.textContent='时间到';p.innerHTML='找到 '+found.filter(Boolean).length+' / 5 处<br>未找出的已用金圈标出';
    DIFFS.forEach(function(d,i){if(!found[i]){['p0','p1'].forEach(function(id){sz(document.getElementById(id),i);});}});
  }
  ov.classList.add('show');
}
function check(){if(found.every(Boolean))end(true);}
timer=setInterval(function(){timeLeft--;upd();if(timeLeft<=0)end(false);},1000);
upd();
</script>
</body>
</html>
