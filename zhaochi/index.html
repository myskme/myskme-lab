<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>寻微乐园 v0.2</title>
<style>
:root{--p:#FFB7C5;--mint:#A8E6CF;--lav:#C3B2E8;--peach:#FFD8B8;--gold:#E8B84B;--ink:#5A4A42;--bg:#FFF9F5;--card:#fff;--sh:0 4px 18px rgba(255,183,197,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:10px 10px 94px}
.scr{display:none}.scr.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 2px}
.top b{font-size:20px}
.sd{background:#fff;border-radius:999px;padding:6px 14px;box-shadow:var(--sh);font-weight:700}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px;margin:8px 0}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:14px;margin:10px 0;font-size:17px;font-weight:800;color:var(--ink);background:linear-gradient(135deg,var(--p),var(--peach));box-shadow:var(--sh);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.mint{background:linear-gradient(135deg,var(--mint),#d6f5e6)}
.btn.lav{background:linear-gradient(135deg,var(--lav),#e6ddf7)}
.btn.ghost{background:#fff;border:2px solid var(--p)}
.row{display:flex;gap:10px}.row .btn{margin:6px 0}
.pill{display:inline-block;background:#fff;border-radius:999px;padding:4px 12px;margin:2px;box-shadow:var(--sh);font-size:13px}
.bar{height:12px;background:#f3e7df;border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--gold));border-radius:99px;transition:width .4s}
.gbar{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:10px 14px;margin:8px 0;font-size:15px;font-weight:700;position:sticky;top:0;z-index:5}
.pics{display:flex;flex-direction:column;gap:10px}
@media(min-width:820px) and (orientation:landscape){.pics{flex-direction:row}.pics .pdiv{display:none}#app{max-width:1060px}}
.pic{position:relative;flex:1;border-radius:16px;overflow:hidden;box-shadow:var(--sh),0 0 0 2px rgba(232,184,75,.35);cursor:pointer;line-height:0}
.pic img{width:100%;display:block;pointer-events:none}
.tag{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);border-radius:99px;padding:4px 14px 4px 5px;font-size:14px;font-weight:700;line-height:1.6;z-index:2;display:flex;align-items:center}
.tag .n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--gold));color:#fff;font-size:12px;margin-right:4px}
.pdiv{display:flex;align-items:center;gap:10px;margin:2px 4px;color:#b99f8d;font-size:13px;font-weight:700}
.pdiv:before,.pdiv:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,#f3d9c8,transparent);border-radius:2px}
.mk{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
.mk svg{width:100%;height:100%;display:block;overflow:visible}
.mk circle{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;stroke-dasharray:283;stroke-dashoffset:283;animation:draw .55s ease-out forwards}
.mk.hint circle{stroke:var(--p);stroke-dasharray:16 12;animation:draw .55s ease-out forwards,hintp 1.8s .6s infinite}
.mk.ans circle{stroke:#ff8a8a}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes hintp{50%{opacity:.5}}
.rip{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid #eec9c2;pointer-events:none;z-index:3;animation:rip .65s ease-out forwards}
@keyframes rip{from{transform:scale(.35);opacity:.95}to{transform:scale(1.6);opacity:0}}.zoomtag{position:absolute;right:8px;top:8px;z-index:4;background:rgba(255,255,255,.94);border:1px solid #F5E6DC;border-radius:99px;padding:6px 14px;font-size:14px;font-weight:700;color:#5A4A42}#zoom{position:fixed;inset:0;z-index:99;display:none;background:rgba(43,32,26,.94);overflow:auto;-webkit-overflow-scrolling:touch}#zoom.on{display:block}#zoom .pic{width:170%;max-width:720px;flex:none;margin:14px auto}#zoom .pic img{width:100%}#zoom .zoomtag{display:none}.zth{position:sticky;bottom:12px;text-align:center;color:#fff;font-size:15px;font-weight:700;background:rgba(43,32,26,.7);border-radius:99px;padding:8px 16px;width:max-content;margin:0 auto}
.slot{display:inline-block;width:46px;height:46px;line-height:46px;text-align:center;border-radius:50%;background:#f3e7df;margin:4px;font-weight:800;color:#b9a89e;font-size:18px}
.slot.hit{background:var(--mint);color:var(--ink);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.35)}}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:900;color:#e8a13b;font-size:18px;pointer-events:none;z-index:4;animation:up 1s forwards}
@keyframes up{to{transform:translate(-50%,-160%);opacity:0}}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(90,74,66,.92);color:#fff;padding:10px 20px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;max-width:86%;text-align:center}
#modal{position:fixed;inset:0;background:rgba(90,74,66,.45);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:24px;padding:24px 20px;max-width:380px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.18);animation:drop .5s cubic-bezier(.2,1.3,.4,1);max-height:84vh;overflow:auto}
@keyframes drop{from{transform:translateY(-48px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.mbox h3{margin:6px 0 10px}
.shake{animation:shk .5s}
@keyframes shk{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg) scale(1.05)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
.flash{animation:fl .5s}
@keyframes fl{0%{filter:brightness(1)}50%{filter:brightness(2.2)}100%{filter:brightness(1)}}
.jit{animation:jit .3s}
@keyframes jit{25%{transform:translate(2px,-2px)}50%{transform:translate(-2px,2px)}75%{transform:translate(2px,2px)}}
.big{font-size:44px;margin:4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.cell{background:#fff;border-radius:14px;padding:8px 4px;text-align:center;box-shadow:var(--sh);font-size:12px;position:relative}
.cell .e{font-size:26px}
.cell.lock{filter:grayscale(1);opacity:.55}
.cell .st{color:var(--gold);font-size:11px;font-weight:800}
.bond{border:2px dashed var(--gold);border-radius:14px;padding:8px;margin:8px 0;font-size:13px}
.small{font-size:13px;color:#a68d80}
.stars{color:var(--gold);font-size:26px;letter-spacing:2px}
h2.st{margin:8px 0}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.ic{width:1.15em;height:1.15em;vertical-align:-.22em}.big .ic{width:64px;height:64px;color:var(--gold)}.mg{display:inline-flex;align-items:center;justify-content:center;min-width:2.2em;height:2.2em;padding:0 .4em;border-radius:999px;background:linear-gradient(135deg,#FFD9B3,#FFB7C5);color:#5A4A42;font-weight:800;font-size:.95em;vertical-align:middle}.cell .mg{width:44px;height:44px;padding:0;font-size:20px;border-radius:50%}.mg.hid{background:linear-gradient(135deg,#C3B2E8,#8f7cc9);color:#fff}.mg.q{background:#f3e7df;color:#b9a89e}.bdg{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#f8dc8f,#E8B84B);color:#5a3d1e;font-size:36px;box-shadow:0 6px 18px rgba(232,184,75,.45)}.bdg.dim{background:#e8ddd4;color:#a68d80;box-shadow:none}#b-mute.off{opacity:.55}.okk{color:var(--gold);font-weight:800}.noo{color:#d8c9bd;font-weight:800}</style>
</head>

function updG(){$("g-t").textContent=G_.time;$("g-f").textContent=G_.found.filter(Boolean).length+"/5";$("g-h").textContent=G_.hints;$("g-sh").innerHTML=G_.shield?'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>':""}

    var w=$("p"+k).getBoundingClientRect().width;m.style.width=m.style.height=(rad*w*2)+"px";$("p"+k).appendChild(m)}}
function zoomPic(k,ev){ev.stopPropagation();if(!G_)return;var src=$("p"+k),z=$("zoom"),ow=src.getBoundingClientRect().width;z.innerHTML='<div class="pic" id="zp">'+src.innerHTML+'</div><div class="zth">点按任意处关闭 · 回原图上点按寻微</div>';z.classList.add("on");var zb=z.querySelector(".zoomtag");if(zb)zb.remove();var nw=z.querySelector("#zp").getBoundingClientRect().width,r=nw/ow;z.querySelectorAll(".mk").forEach(function(m){var s=parseFloat(m.style.width)*r;if(s>0){m.style.width=m.style.height=s+"px"}});z.onclick=function(){z.classList.remove("on")}}function tap(e){

}
function stopT(){if(G_&&G_.timer)clearInterval(G_.timer)}
function win(){G_.over=true;stopT();settle(true)}
function lose(){
  if(!G_||G_.over)return;G_.over=true;stopT();sfx("lose");
  var d=LVL[G_.lv].d;for(var i=0;i<5;i++)if(!G_.found[i])addMark(d[i][0],d[i][1],"mk ans");
  settle(false);
}
function settle(ok){
  if(WK.week!=weekStr())WK={week:weekStr(),done:{},games:0};
  var n=G_.found.filter(Boolean).length,stars=0;
  if(ok){stars=2;if(G_.time>40&&G_.miss<=2)stars=3}
  var gain=ok?(n*8+(G_.miss==0?20:0)+20+(stars==3?15:0)):(n*8);
  if(bondOn())gain=Math.round(gain*1.15);
  var dbl=FG!=today();if(dbl&&ok){gain*=2;FG=today()}
  var newT=[];
  if(ok&&G_.miss==0&&TI.indexOf("title-连击王")<0){TI.push("title-连击王");newT.push("连击王")}
  if(stars==3&&TI.indexOf("title-火眼金睛")<0){TI.push("title-火眼金睛");newT.push("火眼金睛")}
  addSD(gain);addXP(10);FD++;
  WK.games++;if(ok&&G_.miss==0)WK.done.flawless=1;save();checkWeekly();
  if(ok&&G_.miss==0){AC.zero++}
  save();
  var mood=BU?(ok?"\"你太棒了！"+cardMark(BU.id)+"为你撒花\"":"\"没关系，"+cardMark(BU.id)+"陪你再来一局\""):"";
  var st="★".repeat(stars)+"☆".repeat(3-stars);
  var html="<div class='big'>"+(ok?"<span class='bdg'>★</span>":"<span class='bdg dim'>!</span>") + "</div><h3>"+(ok?"找齐啦！太厉害了":"时间到，别灰心")+"</h3>"
   +(ok?"<div class='stars'>"+st+"</div><div class='small'>"+(stars==3?"3 星！火眼金睛":stars==2?"2 星！继续加油":"")+"</div>":"<div class='small'>未找出的已经用红圈标出啦，下次一定行</div>")
   +"<div class='kv'><span>找到差异</span><b>"+n+"/5 ×8★</b></div>"
   +(G_.miss==0?"<div class='kv'><span>零失误</span><b>+20★</b></div>":"")
   +(ok?"<div class='kv'><span>全找齐</span><b>+20★</b></div>":"")
   +(stars==3?"<div class='kv'><span>3 星评价</span><b>+15★</b></div>":"")
   +(bondOn()?"<div class='kv'><span>谷地四人羁绊</span><b>+15%</b></div>":"")
   +(dbl&&ok?"<div class='kv'><span>每日首局双倍</span><b>×2</b></div>":"")
   +"<div class='kv'><span>本局星尘</span><b style='color:#e8a13b'>+"+gain+" ★</b></div>"
   +(newT.length?"<div class='kv'><span>新称号</span><b>"+newT.join("、")+"</b></div>":"")
   +(mood?"<div class='small' style='margin:8px 0'>伙伴说："+mood+"</div>":"")
   +"<button class='btn' onclick='drawFreeGo()'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='8' width='18' height='4' rx='1'/><path d='M12 8v13'/><path d='M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7'/><path d='M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5'/></svg> 免费盲盒抽一次</button>"
   +"<div class='row'><button class='btn mint' onclick='startGame(1-lastLv)'>"+(lastLv==0?"去第二关":"回第一关")+"</button><button class='btn ghost' onclick='startGame(lastLv)'>再来一局</button></div>"
   +"<button class='btn lav' onclick='show(\"s-home\");renderHome()'>"+"<svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/><path d='M9 22V12h6v10'/></svg>"+" 返回首页</button>";
  $("over-box").innerHTML=html;show("s-over");
  if(ok&&stars==3){confetti({particleCount:140,spread:100});sfx("win")}
  else if(ok){confetti({particleCount:60,spread:70});sfx("win")}
  save();
}
/* ===== 盲盒 ===== */
function boxRender(){updSD();$("x-free").textContent=FD;$("x-pity").textContent=Math.min(PT,10)+"/10";renderThemes()}
function newCardOwn(id){
  if(CL.indexOf(id)<0)CL.push(id);
  if(!CD[id])CD[id]={s:1,n:0};
  PT=0;save();
}
function drawBox(free){
  if(free){if(FD<=0){toast("没有免费抽啦");return}FD--}
  else{if(SD<50){toast("星尘不够啦，去玩一局吧 ★");return}addSD(-50)}
  PT++;AC.draws++;addXP(5);save();checkWeekly("draw");
  var em=$("box-emoji"),msg=$("box-msg");
  em.innerHTML='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>';em.classList.remove("shake","flash");void em.offsetWidth;em.classList.add("shake");
  msg.textContent="摇晃中……";sfx("box1");
  setTimeout(function(){
    em.classList.remove("shake");em.classList.add("flash");msg.textContent="金光爆发！";
    confetti({particleCount:80,spread:100,origin:{y:.6}});
    setTimeout(function(){em.classList.remove("flash");reveal()},550);
  },650);
  function reveal(){
    var r=roll(),html="";
    if(r.t=="card"){
      var nm=cardName(r.id),ce=cardMark(r.id),isNew=r.isNew,dup=r.dup;
      em.textContent=ce;
      if(isNew){html="<h3><span class='mg'"+(r.id==HIDDEN[0]?' hid':'')+'">'+ce+"</span> "+nm+"</h3><div class='pill'>"+(r.id==HIDDEN[0]?"隐藏款！":"新卡！")+"</div><div class='stars'>★</div>";sfx("box2");confetti({particleCount:120,spread:100});if(r.id==HIDDEN[0])unlock("hidden","星语收藏家","抽到隐藏款星语")}
      else{html="<h3><span class='mg'"+(r.id==HIDDEN[0]?' hid':'')+'">'+ce+"</span> "+nm+"</h3><div class='pill'>重复卡 → +20★ 进化进度 "+CD[r.id].n+"/3</div><div class='stars'>"+"★".repeat(CD[r.id].s)+"</div>";sfx("coin");
        if(r.evo){html+="<div class='pill' style='background:#fff3d6'>合成进化！"+nm+" → "+CD[r.id].s+" 星</div>";confetti({particleCount:150,spread:120});sfx("box2")}
        else if(r.near){html+="<div class='small'>就差一点！再来一次？</div>"}}
    }else if(r.t=="title"){
      em.innerHTML='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"/><path d="M11 12 5.12 2.2"/><path d="m13 12 5.88-9.8"/><path d="M8 7h8"/><circle cx="12" cy="17" r="5"/><path d="M12 18v-2h-.5"/></svg>';
      if(r.isNew){html="<h3>称号 · "+r.id.slice(6)+"</h3><div class='pill'>新称号！</div>"}
      else{html="<h3>"+r.id.slice(6)+"</h3><div class='pill'>重复 → +20★</div>"}
      sfx("box2");confetti({particleCount:70,spread:80});
    }else{
      em.innerHTML='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h2.996A5.002 5.002 0 0 0 22 12c0-5.5-4.5-10-10-10z"/></svg>';
      if(r.isNew){html="<h3>主题 · "+r.id.slice(6)+"</h3><div class='pill'>点击下方切换</div>";applyTheme(r.id)}
      else{html="<h3>"+r.id.slice(6)+"</h3><div class='pill'>重复 → +20★</div>"}
      sfx("box2");confetti({particleCount:70,spread:80});
    }
    msg.innerHTML=html;boxRender();save();
  }
}
function roll(){
  if(PT>=10){var un=CARDS.filter(function(c){return !has(c[0])});if(un.length){var c=un[Math.floor(Math.random()*un.length)];newCardOwn(c[0]);return{t:"card",id:c[0],isNew:true}}PT=0}
  var cw=LV.lv>=5?0.65:0.60,tw=LV.lv>=5?0.21:0.25,r=Math.random();
  if(r<0.02){var owned=has(HIDDEN[0]),was=CD[HIDDEN[0]];newCardOwn(HIDDEN[0]);var isN=!owned;var evo=false,near=false;
    if(!isN){CD[HIDDEN[0]].n++;addSD(20);if(CD[HIDDEN[0]].n>=3&&CD[HIDDEN[0]].s<5){CD[HIDDEN[0]].s++;CD[HIDDEN[0]].n=0;evo=true}else{near=Object.keys(CD).some(function(k){return CD[k].n==2})}}
    save();return{t:"card",id:HIDDEN[0],isNew:isN,dup:!isN,evo:evo,near:near}}
  r-=0.02;
  if(r<cw){
    var c=CARDS[Math.floor(Math.random()*CARDS.length)],id=c[0];
    if(!has(id)){newCardOwn(id);return{t:"card",id:id,isNew:true}}
    CD[id].n++;addSD(20);var evo2=false;
    if(CD[id].n>=3&&CD[id].s<5){CD[id].s++;CD[id].n=0;evo2=true}
    var near2=!evo2&&Object.keys(CD).some(function(k){return CD[k].n==2});
    save();return{t:"card",id:id,dup:true,evo:evo2,near:near2};
  }
  r-=cw;
  if(r<tw){var t=TITLES[Math.floor(Math.random()*TITLES.length)];
    if(TI.indexOf(t)<0){TI.push(t);save();return{t:"title",id:t,isNew:true}}
    addSD(20);save();return{t:"title",id:t,dup:true}}
  var th=THEMES[Math.floor(Math.random()*THEMES.length)][0];
  if(!has(th)){CL.push(th);save();return{t:"theme",id:th,isNew:true}}
  addSD(20);save();return{t:"theme",id:th,dup:true};
}
function drawFreeGo(){save();show("s-box");boxRender();drawBox(true)}
/* ===== 集卡册 ===== */
function renderAlbum(){
  updSD();
  var hc="";for(var i=0;i<CARDS.length;i++){var id=CARDS[i][0],own=has(id),cd=CD[id]||{s:0,n:0};
    hc+="<div class='cell"+(own?"":" lock")+"'><div class='e'>"+(own?"<span class='mg'>"+CARDS[i][2]+"</span>":"<span class='mg q'>?</span>")+"</div>"+(own?CARDS[i][1]:"???")+(own?"<div class='st'>"+"★".repeat(cd.s)+(cd.s<5?" <span class='small'>"+cd.n+"/3</span>":" MAX")+"</div>":"<div class='small'>盲盒抽取</div>")}
  var hid=has(HIDDEN[0]);
  hc+="<div class='cell"+(hid?"":" lock")+"'><div class='e'>"+(hid?"<span class='mg hid'>"+HIDDEN[2]+"</span>":"<span class='mg q'>?</span>")+"</div>"+(hid?HIDDEN[1]:"???")+"<div class='small'>"+(hid?"隐藏款":"？？？")+"</div></div>";
  $("a-cards").innerHTML=hc;
  $("a-cprog").textContent=CARDS.filter(function(c){return has(c[0])}).length+"/8"+(hid?" +隐藏":"");
  $("a-bond").innerHTML=bondOn()?"<b>谷地四人羁绊已激活</b>：狼先生·洋·Xi·Lin 集齐，每局结算星尘 +15% ★":"谷地四人羁绊：集齐 狼先生·洋·Xi·Lin（"+["card-wolf","card-yang","card-xi","card-lin"].filter(has).length+"/4）→ 结算 +15%";
  var ht="";for(var j=0;j<TITLES.length;j++){var own2=TI.indexOf(TITLES[j])>=0;ht+="<div class='cell"+(own2?"":" lock")+"'><div class='e'>"+(own2?'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"/><path d="M11 12 5.12 2.2"/><path d="m13 12 5.88-9.8"/><path d="M8 7h8"/><circle cx="12" cy="17" r="5"/><path d="M12 18v-2h-.5"/></svg>':"?")+"</div>"+TITLES[j].slice(6)+"</div>"}
  $("a-titles").innerHTML=ht;
  var hm="";for(var k=0;k<THEMES.length;k++){var id2=THEMES[k][0],own3=has(id2);hm+="<span class='pill' style='"+(own3?"":"opacity:.5")+"'><i style='display:inline-block;width:12px;height:12px;border-radius:50%;background:"+THEMES[k][1]+"'></i> "+id2.slice(6)+(own3?"":"")+"</span>"}
  $("a-themes").innerHTML=hm;
  var pts=AC.zero*10+AC.found+AC.draws*2+(SG.streak||0)*3;
  var tiers=[["青铜",0],["白银",50],["黄金",150],["铂金",300],["星尘大师",600]],tn=tiers[0][0],nx=tiers[1][1];
  for(var x=0;x<tiers.length;x++)if(pts>=tiers[x][1]){tn=tiers[x][0];nx=x<4?tiers[x+1][1]:null}
  var mys=[["night","深夜玩家"],["dawn","晨曦追光者"],["hidden","星语收藏家"]];
  var mh="";for(var m=0;m<mys.length;m++){var u=AC.unlock.indexOf(mys[m][0])>=0;mh+="<span class='pill' style='"+(u?"":"opacity:.5")+"'>"+(u?mys[m][1]:"??? 神秘成就")+"</span>"}
  $("a-ach").innerHTML="<div class='kv'><span>段位</span><b>"+tn+"</b></div><div class='bar'><i style='width:"+(nx?Math.min(100,pts/nx*100):100)+"%'></i></div><div class='small'>成就点 "+pts+(nx?" / "+nx:" MAX")+" · 零失误局 "+AC.zero+" · 累计寻微 "+AC.found+" · 抽卡 "+AC.draws+" · 连签 "+(SG.streak||0)+" 天</div><div style='margin-top:6px'>"+mh+"</div>";
}
function unlock(id,name,how){
  if(AC.unlock.indexOf(id)>=0)return;
  AC.unlock.push(id);addSD(30);save();
  toast("神秘成就解锁："+name+"！+30★");confetti({particleCount:100,spread:90});sfx("win");
}
/* ===== 每周任务 ===== */
function checkWeekly(kind){
  if(WK.week!=weekStr())WK={week:weekStr(),done:{},games:0};
  var changed=false;
  function grant(k,label){if(!WK.done[k]){WK.done[k]=1;addSD(30);changed=true;toast("每周任务完成："+label+" +30★");confetti({particleCount:50,spread:70});sfx("coin")}}
  if(WK.games>=2)grant("g2","完成 2 局");
  if(kind=="draw")grant("d1","抽盲盒 1 次");
  if(WK.done.flawless)grant("zf","单局零失误");
  save();if(changed)renderHome();
}
function showWeekly(){
  if(WK.week!=weekStr())WK={week:weekStr(),done:{},games:0};
  var rows=[["g2","完成 2 局","（"+Math.min(WK.games,2)+"/2）"],["zf","单局零失误",""],["d1","抽盲盒 1 次",""]];
  var h="<h3><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2'/><path d='M16 2v4'/><path d='M8 2v4'/><path d='M3 10h18'/></svg> 每周任务</h3><div class='small'>"+WK.week+" · 每个 +30★</div>";
  for(var i=0;i<rows.length;i++)h+="<div class='kv'><span>"+(WK.done[rows[i][0]]?"<b class='okk'>★</b> ":"<b class='noo'>☆</b> ")+rows[i][1]+" "+rows[i][2]+"</span><b>"+(WK.done[rows[i][0]]?"+30★":"待完成")+"</b></div>";
  h+="<button class='btn' onclick='modalOff()'>知道了</button>";
  modal(h);
}
/* ===== 启动：签到 / 回归 ===== */
function boot(){
  renderHome();updSD();applyTheme(TH);
  var t=today();
  if(SG.last!=t){
    var cont=SG.last==yday();SG.streak=cont?SG.streak+1:1;SG.last=t;
    var g=30+Math.min(SG.streak*10,100);if(LV.lv>=3)g=Math.round(g*1.2);
    addSD(g);AC.streak=SG.streak;save();
    modal("<div class='big'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2'/><path d='M16 2v4'/><path d='M8 2v4'/><path d='M3 10h18'/></svg></div><h3>签到成功！连续 "+SG.streak+" 天</h3><div class='kv'><span>签到奖励</span><b>+"+g+" ★</b></div><div class='small'>明天继续，连续签到加成更高哦</div><button class='btn' onclick='modalOff()'>开心收下</button>");
    confetti({particleCount:110,spread:90});sfx("win");
  }
  if(LP&&LP!=t){
    var days=Math.round((new Date(t)-new Date(LP))/864e5);
    if(days>2){addSD(50);FD++;save();
      setTimeout(function(){modal("<div class='big'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='8' width='18' height='4' rx='1'/><path d='M12 8v13'/><path d='M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7'/><path d='M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5'/></svg></div><h3>想你了！回归礼包</h3><div class='kv'><span>星尘</span><b>+50 ★</b></div><div class='kv'><span>免费盲盒</span><b>+1 次</b></div>"+(BU?"<div class='small'>"+cardName(BU.id)+"：好想你呀</div>":"")+"<button class='btn' onclick='modalOff()'>谢谢！</button>");confetti({particleCount:90,spread:80})},SG.last!=t?2500:500);
    }
  }
  show("s-home");
}
